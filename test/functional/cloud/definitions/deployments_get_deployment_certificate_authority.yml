# Cloud control plane API: Get certificate authority (GET /api/v1/deployments/{deployment_id}/certificate-authority)
# Id for {deployment_id} is derived from deployments.list-deployments.
# TODO: verify the response path in the `set` step against a live API.
---
"deployments get-deployment-certificate-authority":
  - do:
      deployments.list-deployments: {}
  - set: {deployments.0.id: deployment_id}
  - do:
      deployments.get-deployment-certificate-authority:
        deployment_id: $deployment_id
