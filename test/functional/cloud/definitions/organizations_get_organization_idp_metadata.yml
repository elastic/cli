# Cloud control plane API: Get organization service provider SAML2 metadata.xml for configuring the identity provider (GET /api/v1/organizations/{organization_id}/idp/metadata.xml)
# Id for {organization_id} is derived from organizations.list-organizations.
# TODO: verify the response path in the `set` step against a live API.
---
"organizations get-organization-idp-metadata":
  - do:
      organizations.list-organizations: {}
  - set: {organizations.0.id: organization_id}
  - do:
      organizations.get-organization-idp-metadata:
        organization_id: $organization_id
