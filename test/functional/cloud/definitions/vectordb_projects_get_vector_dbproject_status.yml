# Cloud control plane API: Get the status of a VectorDB project (GET /api/v1/serverless/projects/vectordb/{id}/status)
# Id for {id} is derived from vectordb-projects.list-vector-dbprojects.
---
"vectordb-projects get-vector-dbproject-status":
  - do:
      vectordb-projects.list-vector-dbprojects: {}
  - set: {dbprojects.0.id: id}
  - do:
      vectordb-projects.get-vector-dbproject-status:
        id: $id
