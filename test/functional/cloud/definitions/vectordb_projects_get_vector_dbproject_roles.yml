# Cloud control plane API: Get roles for a VectorDB project (GET /api/v1/serverless/projects/vectordb/{id}/roles)
# Id for {id} is derived from vectordb-projects.list-vector-dbprojects.
---
"vectordb-projects get-vector-dbproject-roles":
  - do:
      vectordb-projects.list-vector-dbprojects: {}
  - set: {dbprojects.0.id: id}
  - do:
      vectordb-projects.get-vector-dbproject-roles:
        id: $id
