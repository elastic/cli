# Cloud control plane API: Get Elasticsearch project link candidates (GET /api/v1/serverless/projects/elasticsearch/{id}/link-candidates)
# Id for {id} is derived from elasticsearch-projects.list-elasticsearch-projects.
---
"elasticsearch-projects get-elasticsearch-project-link-candidates":
  - do:
      elasticsearch-projects.list-elasticsearch-projects: {}
  - set: {projects.0.id: id}
  - do:
      elasticsearch-projects.get-elasticsearch-project-link-candidates:
        id: $id
