# Cloud control plane API: Get a VectorDB project (GET /api/v1/serverless/projects/vectordb/{id})
# Id for {id} is derived from vectordb-projects.list-vector-dbprojects.
---
"vectordb-projects get-vector-dbproject":
  - do:
      vectordb-projects.list-vector-dbprojects: {}
  - set: {dbprojects.0.id: id}
  - do:
      vectordb-projects.get-vector-dbproject:
        id: $id
