# Cloud control plane API: Get associated deployments (GET /api/v1/deployments/traffic-filter/rulesets/{ruleset_id}/associations)
# Id for {ruleset_id} is derived from deployments-traffic-filter.get-traffic-filter-rulesets.
# TODO: verify the response path in the `set` step against a live API.
---
"deployments-traffic-filter get-traffic-filter-ruleset-deployment-associations":
  - do:
      deployments-traffic-filter.get-traffic-filter-rulesets: {}
  - set: {rulesets.0.id: ruleset_id}
  - do:
      deployments-traffic-filter.get-traffic-filter-ruleset-deployment-associations:
        ruleset_id: $ruleset_id
