# Cloud control plane API: Get Observability project link candidates (GET /api/v1/serverless/projects/observability/{id}/link-candidates)
# Id for {id} is derived from observability-projects.list-observability-projects.
---
"observability-projects get-observability-project-link-candidates":
  - do:
      observability-projects.list-observability-projects: {}
  - set: {projects.0.id: id}
  - do:
      observability-projects.get-observability-project-link-candidates:
        id: $id
