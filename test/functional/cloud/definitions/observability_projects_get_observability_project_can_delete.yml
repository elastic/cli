# Cloud control plane API: Get Observability project delete status (GET /api/v1/serverless/projects/observability/{id}/_can-delete)
# Id for {id} is derived from observability-projects.list-observability-projects.
---
"observability-projects get-observability-project-can-delete":
  - do:
      observability-projects.list-observability-projects: {}
  - set: {projects.0.id: id}
  - do:
      observability-projects.get-observability-project-can-delete:
        id: $id
