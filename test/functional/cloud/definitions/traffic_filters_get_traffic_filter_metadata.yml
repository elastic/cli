# Cloud control plane API: List PrivateLink region metadata (GET /api/v1/serverless/traffic-filters/metadata)
---
setup:
  - do:
      organizations.list-organizations: {}
  - set: {organizations.0.id: organization_id}
---
"traffic-filters get-traffic-filter-metadata":
  - do:
      traffic-filters.get-traffic-filter-metadata:
        organization_id: $organization_id
