# Cloud control plane API: Get VectorDB project delete status (GET /api/v1/serverless/projects/vectordb/{id}/_can-delete)
# Id for {id} is derived from vectordb-projects.list-vector-dbprojects.
---
"vectordb-projects get-vector-dbproject-can-delete":
  - do:
      vectordb-projects.list-vector-dbprojects: {}
  - set: {dbprojects.0.id: id}
  - do:
      vectordb-projects.get-vector-dbproject-can-delete:
        id: $id
