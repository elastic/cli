#
# Kibana security-entity-store: enable an entity resolution rule.
# Fetches the list of managed rules, captures the first rule ID, disables
# it to ensure a known state, then verifies that enable turns it on.
---
requires:
  serverless: false
  stack: false
---
setup:
  - do:
      security-entity-store.get_security_entity_store_resolution_rules: {}
  - set: { "rules.0.id": rule_id }
  - do:
      security-entity-store.put_security_entity_store_resolution_rules_id_disable:
        id: $rule_id
---
teardown:
  - do:
      security-entity-store.put_security_entity_store_resolution_rules_id_enable:
        id: $rule_id
        ignore: [404]
---
"security-entity-store enable entity resolution rule":
  - do:
      security-entity-store.put_security_entity_store_resolution_rules_id_enable:
        id: $rule_id
  - is_true: enabled
