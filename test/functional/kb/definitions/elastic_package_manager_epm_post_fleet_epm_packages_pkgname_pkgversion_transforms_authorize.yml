# Kibana elastic-package-manager-epm API: authorize transforms for a package version.
---
requires:
  serverless: true
  stack: true
---
setup:
  - do:
      elastic-package-manager-epm.get_fleet_epm_packages_pkgname:
        pkg_name: apache
  - set: {"item.version": pkg_version}
  - do:
      elastic-package-manager-epm.post_fleet_epm_packages_pkgname_pkgversion:
        pkg_name: apache
        pkg_version: $pkg_version
---
teardown:
  - do:
      elastic-package-manager-epm.delete_fleet_epm_packages_pkgname_pkgversion:
        pkg_name: apache
        pkg_version: $pkg_version
        ignore: [404]
---
"elastic-package-manager-epm post fleet epm packages pkgname pkgversion transforms authorize":
  - do:
      elastic-package-manager-epm.post_fleet_epm_packages_pkgname_pkgversion_transforms_authorize:
        pkg_name: apache
        pkg_version: $pkg_version
        body:
          transforms: []
  - is_true: ""
