#
# Kibana security-entity-store: put security entity store.
# Verifies that put-security-entity-store updates the Entity Store without error.
---
requires:
  serverless: true
  stack: true
  # Entity Store V2; x-state carries no version, so gate here.
  stack_since: 9.4.0
---
"security-entity-store put security entity store":
  - do:
      security-entity-store.put_security_entity_store:
        body:
          logExtraction: {}
  - is_true: ""
