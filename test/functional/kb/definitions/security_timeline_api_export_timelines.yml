#
# Kibana security-timeline-api: export timelines.
# Creates a timeline in setup, exports it by ID, then deletes it in teardown.
---
requires:
  serverless: true
  stack: true
  serverless_project: security
---
setup:
  - do:
      security-timeline-api.create_timelines:
        body:
          timeline:
            title: CLI FT export-timelines test
  - set: {"savedObjectId": timeline_id}
---
teardown:
  - do:
      security-timeline-api.delete_timelines:
        body:
          savedObjectIds:
            - $timeline_id
        ignore: [404]
---
"security-timeline-api export timelines":
  - do:
      security-timeline-api.export_timelines:
        file_name: export.ndjson
        body:
          ids:
            - $timeline_id
  - is_true: ""
