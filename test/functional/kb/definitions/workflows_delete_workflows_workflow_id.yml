# Kibana workflows API: create a workflow then delete it by ID.
---
requires:
  serverless: true
---
setup:
  - do:
      workflows.post_workflows_workflow:
        body:
          id: cli-ft-workflow-delete-by-id
          yaml: |
            version: '1'
            name: CLI FT Workflow Delete By ID
            triggers:
              - type: manual
            steps: []
---
teardown:
  - do:
      workflows.delete_workflows_workflow_id:
        id: cli-ft-workflow-delete-by-id
        force: true
        ignore: [404]
---
"workflows delete workflow by id":
  - do:
      workflows.delete_workflows_workflow_id:
        id: cli-ft-workflow-delete-by-id
