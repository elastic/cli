# Kibana streams API: link an attachment to a stream.
---
requires:
  serverless: true
  stack: true
---
setup:
  - do:
      streams.put_streams_name:
        name: cli-ft-streams-att-put
        body:
          dashboards: []
          rules: []
          stream:
            description: ""
            type: wired
            ingest:
              lifecycle: {inherit: {}}
              processing:
                steps: []
              settings: {}
              failure_store: {inherit: {}}
              wired:
                fields: {}
                routing: []
---
teardown:
  - do:
      streams.delete_streams_name:
        name: cli-ft-streams-att-put
        ignore: [404]
---
"streams put streams streamname attachments attachmenttype attachmentid":
  - do:
      streams.put_streams_streamname_attachments_attachmenttype_attachmentid:
        stream_name: cli-ft-streams-att-put
        attachment_type: dashboard
        attachment_id: cli-ft-dashboard-id
  - is_true: ""
