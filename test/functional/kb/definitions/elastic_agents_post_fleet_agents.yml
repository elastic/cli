# Kibana elastic-agents API: get agents by action IDs.
---
requires:
  serverless: true
  stack: true
---
setup:
  - do:
      elastic-agents.get_fleet_agents: {}
  - set: {"items.0.id": agent_id}
  - do:
      elastic-agent-actions.post_fleet_agents_agentid_request_diagnostics:
        agent_id: $agent_id
  - set: {actionId: action_id}
---
"elastic-agents post fleet agents":
  - do:
      elastic-agents.post_fleet_agents:
        body:
          actionIds:
            - $action_id
  - is_true: ""
