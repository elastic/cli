# Kibana security-lists-api: create a value list then find it.
---
requires:
  serverless: true
  stack: true
  serverless_project: security
---
setup:
  - do:
      security-lists-api.create_list_index:
  - do:
      security-lists-api.create_list:
        body:
          id: cli-ft-sec-lists-find-lists
          name: CLI FT Find Lists
          description: Created by functional test
          type: keyword
---
teardown:
  - do:
      security-lists-api.delete_list:
        id: cli-ft-sec-lists-find-lists
        ignore: [404]
---
"security-lists-api find lists":
  - do:
      security-lists-api.find_lists: {}
  - gt: {total: 0}
  - is_true: data
