# Kibana agent-builder API: create tool / delete tool by ID.
---
requires:
  serverless: true
  stack: true
---
teardown:
  - do:
      agent-builder.delete_agent_builder_tools_toolid:
        tool_id: cli-ft-ab-post-tools
        force: true
        ignore: [404]
---
"agent-builder create tool":
  - do:
      agent-builder.post_agent_builder_tools:
        body:
          id: cli-ft-ab-post-tools
          type: esql
          description: Created by functional test
          configuration:
            query: FROM logs-* | LIMIT 10
            params: {}
  - match: { id: cli-ft-ab-post-tools }
  - match: { type: esql }

  - do:
      agent-builder.delete_agent_builder_tools_toolid:
        tool_id: cli-ft-ab-post-tools
        force: true
