#
# Kibana security-endpoint-management-api: get file information for a response action.
# No real endpoint response action can be created in a test environment, so known-missing
# UUIDs are used and a 404 is expected.
---
requires:
  serverless: true
  stack: true
---
"security-endpoint-management-api get endpoint file info":
  - do:
      catch: missing
      security-endpoint-management-api.endpoint_file_info:
        action_id: "00000000-0000-0000-0000-000000000000"
        file_id: "00000000-0000-0000-0000-000000000000.00000000-0000-0000-0000-000000000001"
