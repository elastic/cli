#
# Kibana security-timeline-api: delete timelines.
# Creates a timeline in setup, then verifies delete-timelines removes it.
# Teardown cleans up in case the delete step fails.
---
requires:
  serverless: true
  stack: true
---
setup:
  - do:
      security-timeline-api.create_timelines:
        body:
          timeline:
            title: CLI FT delete-timelines test
  - set: {"savedObjectId": timeline_id}
---
teardown:
  - do:
      security-timeline-api.delete_timelines:
        body:
          savedObjectIds:
            - $timeline_id
        ignore: [404]
---
"security-timeline-api delete timelines":
  - do:
      security-timeline-api.delete_timelines:
        body:
          savedObjectIds:
            - $timeline_id
  - is_true: ""
