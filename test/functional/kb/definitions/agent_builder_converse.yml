# Kibana agent-builder API: send a chat message and verify a conversation is created.
---
requires:
  serverless: true
  stack: true
---
teardown:
  - do:
      agent-builder.delete_agent_builder_conversations_conversation_id:
        conversation_id: $conv_id
        ignore: [404]
---
"agent-builder converse":
  - do:
      agent-builder.post_agent_builder_converse:
        body:
          input: ping
  - set: { conversation_id: conv_id }
  - is_true: conversation_id
