# Kibana agent-builder API: list attachments for a conversation.
---
requires:
  serverless: true
---
teardown:
  - do:
      agent-builder.delete_agent_builder_conversations_conversation_id:
        conversation_id: $conv_id
        ignore: [404]
---
"agent-builder get conversation attachments":
  - do:
      agent-builder.post_agent_builder_converse:
        body:
          input: ping
  - set: {conversation_id: conv_id}
  - is_true: conversation_id

  - do:
      agent-builder.get_agent_builder_conversations_conversation_id_attachments:
        conversation_id: $conv_id
  - is_true: ""
