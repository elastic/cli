# Kibana ML saved-objects sync API: syncs ML saved objects in the default space.
# Non-destructive GET; no setup or teardown required.
---
requires:
  serverless: true
  stack: true
---
"ml ml-sync":
  - do:
      ml.ml_sync: {}
  - is_true: savedObjectsCreated
  - is_true: savedObjectsDeleted
