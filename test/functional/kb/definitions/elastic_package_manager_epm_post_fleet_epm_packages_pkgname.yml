# Kibana elastic-package-manager-epm API: install a package from the registry by name.
---
requires:
  serverless: true
  stack: true
---
teardown:
  - do:
      elastic-package-manager-epm.delete_fleet_epm_packages_pkgname:
        pkg_name: apache
        ignore: [404]
---
"elastic-package-manager-epm post fleet epm packages pkgname":
  - do:
      elastic-package-manager-epm.post_fleet_epm_packages_pkgname:
        pkg_name: apache
  - is_true: ""
