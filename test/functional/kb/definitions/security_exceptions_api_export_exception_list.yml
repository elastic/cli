# Kibana security-exceptions-api: create an exception list, then export it.
---
requires:
  serverless: true
  stack: true
  serverless_project: security
---
setup:
  - do:
      security-exceptions-api.create_exception_list:
        body:
          name: CLI FT Exception List Export
          description: Created by functional test
          type: detection
          list_id: cli-ft-sec-exc-export-list
          namespace_type: single
  - set: {id: list_id}
---
teardown:
  - do:
      security-exceptions-api.delete_exception_list:
        list_id: cli-ft-sec-exc-export-list
        namespace_type: single
        ignore: [404]
---
"security-exceptions-api export exception list":
  - do:
      security-exceptions-api.export_exception_list:
        id: $list_id
        list_id: cli-ft-sec-exc-export-list
        namespace_type: single
        include_expired_exceptions: "false"
  - is_true: 0.list_id
  - match: {0.list_id: cli-ft-sec-exc-export-list}
