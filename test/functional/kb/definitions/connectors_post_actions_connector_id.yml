#
# Kibana connectors API: create a connector by ID.
# Uses the built-in .index connector type (ships with all Kibana deployments).
---
requires:
  serverless: true
  stack: true
---
teardown:
  - do:
      connectors.delete_actions_connector_id:
        id: c3d4e5f6-a7b8-9012-cdef-012345678803
        ignore: [404]
---
"connectors post by ID":
  - do:
      connectors.post_actions_connector_id:
        id: c3d4e5f6-a7b8-9012-cdef-012345678803
        body:
          connector_type_id: ".index"
          name: CLI FT Connector Post
          config: {index: "cli-ft-connector-post-*"}
  - match: {id: c3d4e5f6-a7b8-9012-cdef-012345678803}
  - match: {name: CLI FT Connector Post}
  - match: {connector_type_id: ".index"}
