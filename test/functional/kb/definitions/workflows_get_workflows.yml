# Kibana workflows API: list workflows.
---
requires:
  serverless: true
---
teardown:
  - do:
      workflows.delete_workflows_workflow_id:
        id: cli-ft-workflow-get-workflows
        force: true
        ignore: [404]
---
"workflows get workflows":
  - do:
      workflows.post_workflows_workflow:
        body:
          id: cli-ft-workflow-get-workflows
          yaml: |
            version: '1'
            name: CLI FT Workflow Get Workflows
            triggers:
              - type: manual
            steps: []

  - do:
      workflows.get_workflows: {}
  - is_true: 0.id
