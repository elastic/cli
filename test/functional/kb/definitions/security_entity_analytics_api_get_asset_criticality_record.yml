#
# Kibana security-entity-analytics-api: get asset criticality record.
# Creates a record in setup, then verifies get-asset-criticality-record returns it.
---
requires:
  serverless: true
  stack: true
---
setup:
  - do:
      security-entity-analytics-api.create_asset_criticality_record:
        body:
          id_field: host.name
          id_value: cli-ft-get-asset-criticality-test
          criticality_level: low_impact
---
teardown:
  - do:
      security-entity-analytics-api.delete_asset_criticality_record:
        id_value: cli-ft-get-asset-criticality-test
        id_field: host.name
        ignore: [404]
---
"security-entity-analytics-api get asset criticality record":
  - do:
      security-entity-analytics-api.get_asset_criticality_record:
        id_value: cli-ft-get-asset-criticality-test
        id_field: host.name
  - is_true: id_value
