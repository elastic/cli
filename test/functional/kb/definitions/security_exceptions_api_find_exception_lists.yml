# Kibana security-exceptions-api: create an exception list then find it.
---
requires:
  serverless: true
  stack: true
---
setup:
  - do:
      security-exceptions-api.create_exception_list:
        body:
          name: CLI FT Exception List Find
          description: Created by functional test
          type: detection
          list_id: cli-ft-sec-exc-find-list
          namespace_type: single
---
teardown:
  - do:
      security-exceptions-api.delete_exception_list:
        list_id: cli-ft-sec-exc-find-list
        namespace_type: single
        ignore: [404]
---
"security-exceptions-api find exception lists":
  - do:
      security-exceptions-api.find_exception_lists: {}
  - gt: {total: 0}
  - is_true: data
