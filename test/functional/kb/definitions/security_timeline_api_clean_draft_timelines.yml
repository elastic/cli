# Kibana security-timeline-api: clean draft timelines.
---
requires:
  serverless: true
  stack: true
  serverless_project: security
---
"security-timeline-api clean draft timelines":
  - do:
      security-timeline-api.clean_draft_timelines:
        timeline_type: default
  - is_true: ""
