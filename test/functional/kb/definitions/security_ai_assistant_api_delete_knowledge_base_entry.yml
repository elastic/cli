#
# Kibana security-ai-assistant-api: delete knowledge base entry.
# Creates an entry in setup, then verifies delete-knowledge-base-entry removes it.
# Teardown cleans up in case the delete step fails.
---
requires:
  serverless: true
  stack: true
---
setup:
  - do:
      security-ai-assistant-api.create_knowledge_base_entry:
        body:
          name: CLI FT delete-knowledge-base-entry test
          type: document
          kbResource: user
          source: test-source
          text: This is a test knowledge base entry created by the CLI functional test.
  - set: { id: entry_id }
---
teardown:
  - do:
      security-ai-assistant-api.delete_knowledge_base_entry:
        id: $entry_id
        ignore: [404]
---
"security-ai-assistant-api delete knowledge base entry":
  - do:
      security-ai-assistant-api.delete_knowledge_base_entry:
        id: $entry_id
  - do:
      catch: missing
      security-ai-assistant-api.read_knowledge_base_entry:
        id: $entry_id
