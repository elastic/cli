# Kibana maintenance-window API: find maintenance windows (no filter, default pagination).
---
requires:
  serverless: true
  stack: true
---
setup:
  - do:
      maintenance-window.post_maintenance_window:
        body:
          title: CLI FT Find Maintenance Window
          schedule:
            custom:
              start: "2030-01-01T00:00:00.000Z"
              duration: 1h
  - set: { id: mw_id }
---
teardown:
  - do:
      maintenance-window.delete_maintenance_window_id:
        id: $mw_id
        ignore: [404]
---
"maintenance-window find":
  - do:
      maintenance-window.get_maintenance_window_find: {}
  - gt: { total: 0 }
  - is_true: maintenanceWindows
