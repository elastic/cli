# Kibana security-lists-api: create a value list + item then find items in it.
---
requires:
  serverless: true
  stack: true
  serverless_project: security
---
setup:
  - do:
      security-lists-api.create_list_index:
  - do:
      security-lists-api.create_list:
        body:
          id: cli-ft-sec-lists-find-items-list
          name: CLI FT Find List Items List
          description: Created by functional test
          type: keyword
  - do:
      security-lists-api.create_list_item:
        body:
          id: cli-ft-sec-lists-find-items-item
          list_id: cli-ft-sec-lists-find-items-list
          value: "192.0.2.1"
---
teardown:
  - do:
      security-lists-api.delete_list_item:
        id: cli-ft-sec-lists-find-items-item
        ignore: [404]
  - do:
      security-lists-api.delete_list:
        id: cli-ft-sec-lists-find-items-list
        ignore: [404]
---
"security-lists-api find list items":
  - do:
      security-lists-api.find_list_items:
        list_id: cli-ft-sec-lists-find-items-list
  - gt: {total: 0}
  - is_true: data
