#
# Kibana security-osquery-api: delete a saved query.
# Creates a saved query in setup, deletes it in the test, and verifies deletion.
---
requires:
  serverless: true
  stack: true
---
setup:
  - do:
      security-osquery-api.osquery_create_saved_query:
        body:
          id: cli-ft-osquery-delete-saved-query
          query: SELECT * FROM uptime LIMIT 1
          interval: "3600"
          description: Created by elastic-cli functional test
  - set: {"data.id": saved_query_id}
---
teardown:
  - do:
      security-osquery-api.osquery_delete_saved_query:
        id: $saved_query_id
        ignore: [404]
---
"security-osquery-api delete saved query":
  - do:
      security-osquery-api.osquery_delete_saved_query:
        id: $saved_query_id

  - do:
      catch: missing
      security-osquery-api.osquery_delete_saved_query:
        id: $saved_query_id
