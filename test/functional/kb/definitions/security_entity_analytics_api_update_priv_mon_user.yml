#
# Kibana security-entity-analytics-api: update priv-mon user.
# Initializes the Privilege Monitoring Engine and creates a user in setup,
# then verifies update-priv-mon-user modifies the monitored user. Teardown deletes the engine to clean up.
---
requires:
  serverless: true
  stack: true
---
setup:
  - do:
      security-entity-analytics-api.init_monitoring_engine: {}
  - do:
      security-entity-analytics-api.create_priv_mon_user:
        body:
          user:
            name: cli-ft-update-priv-mon-user
  - set: { "id": user_id }
---
teardown:
  - do:
      security-entity-analytics-api.delete_monitoring_engine:
        ignore: [404]
---
"security-entity-analytics-api update priv-mon user":
  - do:
      security-entity-analytics-api.update_priv_mon_user:
        id: $user_id
        body:
          user:
            name: cli-ft-update-priv-mon-user
            is_privileged: true
  - is_true: user.name
