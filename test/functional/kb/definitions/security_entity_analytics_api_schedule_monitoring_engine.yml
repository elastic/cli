#
# Kibana security-entity-analytics-api: schedule monitoring engine.
# Initializes the Privilege Monitoring Engine in setup, then verifies
# schedule-monitoring-engine schedules it. Teardown deletes it to clean up.
---
requires:
  serverless: true
  stack: true
  serverless_project: security
---
setup:
  - do:
      security-entity-analytics-api.init_monitoring_engine: {}
---
teardown:
  - do:
      security-entity-analytics-api.delete_monitoring_engine:
        ignore: [404]
---
"security-entity-analytics-api schedule monitoring engine":
  - do:
      security-entity-analytics-api.schedule_monitoring_engine: {}
