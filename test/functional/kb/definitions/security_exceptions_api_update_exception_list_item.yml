# Kibana security-exceptions-api: create an exception list item then update it.
---
requires:
  serverless: true
  stack: true
  serverless_project: security
---
setup:
  - do:
      security-exceptions-api.delete_exception_list:
        list_id: cli-ft-sec-exc-update-parent
        namespace_type: single
        ignore: [404]
  - do:
      security-exceptions-api.create_exception_list:
        body:
          name: CLI FT Exception List Update Parent
          description: Parent list for update item test
          type: detection
          list_id: cli-ft-sec-exc-update-parent
          namespace_type: single
  - do:
      security-exceptions-api.create_exception_list_item:
        body:
          item_id: cli-ft-sec-exc-update-list-item
          name: CLI FT Update Exception List Item
          description: Created by functional test
          type: simple
          list_id: cli-ft-sec-exc-update-parent
          namespace_type: single
          entries:
            - field: host.name
              type: match
              operator: included
              value: test-host
---
teardown:
  - do:
      security-exceptions-api.delete_exception_list_item:
        item_id: cli-ft-sec-exc-update-list-item
        namespace_type: single
        ignore: [404]
  - do:
      security-exceptions-api.delete_exception_list:
        list_id: cli-ft-sec-exc-update-parent
        namespace_type: single
        ignore: [404]
---
"security-exceptions-api update exception list item":
  - do:
      security-exceptions-api.update_exception_list_item:
        body:
          item_id: cli-ft-sec-exc-update-list-item
          name: CLI FT Update Exception List Item Updated
          description: Updated by functional test
          type: simple
          list_id: cli-ft-sec-exc-update-parent
          namespace_type: single
          entries:
            - field: host.name
              type: match
              operator: included
              value: test-host
  - is_true: item_id
  - match: {item_id: cli-ft-sec-exc-update-list-item}
  - match: {name: CLI FT Update Exception List Item Updated}
  - match: {description: Updated by functional test}
