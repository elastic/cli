# Kibana security-timeline-api: install prepacked timelines.
---
requires:
  serverless: true
  stack: true
  serverless_project: security
---
"security-timeline-api install prepacked timelines":
  - do:
      security-timeline-api.install_prepacked_timelines:
        body:
          prepackagedTimelines: []
          timelinesToInstall: []
          timelinesToUpdate: []
  - is_true: ""
