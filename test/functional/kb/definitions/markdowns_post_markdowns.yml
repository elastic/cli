# Kibana markdowns API: create a markdown library item.
---
requires:
  serverless: false
  stack: false
---
teardown:
  - do:
      markdowns.delete_markdowns_id:
        id: $markdown_id
        ignore: [404]
---
"markdowns post markdowns":
  - do:
      markdowns.post_markdowns:
        body:
          title: test-markdown
          content: "# Hello"
  - set: {id: markdown_id}
  - is_true: id
