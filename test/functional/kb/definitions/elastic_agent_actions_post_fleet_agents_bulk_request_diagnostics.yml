# Kibana elastic-agent-actions API: bulk request diagnostics from enrolled agents.
---
requires:
  serverless: true
  stack: true
---
setup:
  - do:
      elastic-agents.get_fleet_agents: {}
  - set: { "items.0.id": agent_id }
---
"elastic-agent-actions post fleet agents bulk request diagnostics":
  - do:
      elastic-agent-actions.post_fleet_agents_bulk_request_diagnostics:
        body:
          agents:
            - $agent_id
  - is_true: actionId
