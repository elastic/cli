# Kibana security-exceptions-api: create an exception list.
---
requires:
  serverless: true
  stack: true
---
teardown:
  - do:
      security-exceptions-api.delete_exception_list:
        list_id: cli-ft-sec-exc-create-list
        namespace_type: single
        ignore: [404]
---
"security-exceptions-api create exception list":
  - do:
      security-exceptions-api.create_exception_list:
        body:
          name: CLI FT Exception List Create
          description: Created by functional test
          type: detection
          list_id: cli-ft-sec-exc-create-list
          namespace_type: single
  - match: { list_id: cli-ft-sec-exc-create-list }
  - match: { name: CLI FT Exception List Create }
  - is_true: id
