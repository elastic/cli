# Kibana security-detections-api: delete a detection rule by ID.
---
requires:
  serverless: true
  stack: true
  serverless_project: security
---
setup:
  - do:
      security-detections-api.create_rule:
        body:
          type: query
          name: cli-ft-sec-det-delete-rule
          description: Created by functional test
          risk_score: 21
          severity: low
          query: "*"
  - set: {id: rule_id}
---
teardown:
  - do:
      security-detections-api.delete_rule:
        id: $rule_id
        ignore: [404]
---
"security-detections-api delete rule":
  - do:
      security-detections-api.delete_rule:
        id: $rule_id
  - is_true: id
