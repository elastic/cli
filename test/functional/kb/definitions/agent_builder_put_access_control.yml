# Kibana agent-builder API: create agent / update agent access control / delete agent.
---
requires:
  serverless: true
  stack: true
---
teardown:
  - do:
      agent-builder.delete_agent_builder_agents_id:
        id: cli-ft-ab-put-acl
        ignore: [404]
---
"agent-builder update agent access control":
  - do:
      agent-builder.post_agent_builder_agents:
        body:
          id: cli-ft-ab-put-acl
          name: CLI FT Agent Put ACL
          description: Created by functional test
          configuration:
            tools: []
  - match: { id: cli-ft-ab-put-acl }

  - do:
      agent-builder.put_agent_builder_agents_id_access_control:
        id: cli-ft-ab-put-acl
        body:
          entries:
            - type: user
              name: elastic
              role: user
  - is_true: ""

  - do:
      agent-builder.delete_agent_builder_agents_id:
        id: cli-ft-ab-put-acl
