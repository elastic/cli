# Kibana apm-agent-configuration API: create a configuration then look it up via search-single-configuration.
---
requires:
  serverless: true
  stack: true
---
setup:
  - do:
      apm-agent-configuration.create_update_agent_configuration:
        body:
          service:
            name: cli-ft-apm-svc
          settings:
            transaction_sample_rate: "0.5"
---
teardown:
  - do:
      apm-agent-configuration.delete_agent_configuration:
        body:
          service:
            name: cli-ft-apm-svc
        ignore: [404]
---
"apm-agent-configuration search single configuration":
  - do:
      apm-agent-configuration.search_single_configuration:
        service:
          name: cli-ft-apm-svc
  - is_true: settings
