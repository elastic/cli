# Kibana data-views API: delete a data view.
---
requires:
  serverless: true
  stack: true
---
setup:
  - do:
      data-views.create_data_view_default:
        body:
          data_view: { title: "cli-ft-dv-delete-*", name: cli-ft-dv-delete }
  - set: { data_view.id: view_id }
---
teardown:
  - do:
      data-views.delete_data_view_default:
        viewId: $view_id
        ignore: [404]
---
"data views delete":
  - do:
      data-views.delete_data_view_default:
        viewId: $view_id
  - do:
      catch: missing
      data-views.get_data_view_default:
        viewId: $view_id
