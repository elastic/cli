# Kibana fleet-outputs API: update an output by ID.
---
requires:
  serverless: true
  stack: true
---
setup:
  - do:
      fleet-outputs.post_fleet_outputs:
        body:
          name: cli-ft-fleet-output-put
          type: kafka
          auth_type: none
          hosts:
            - "kafka:9092"
  - set: {"item.id": output_id}
---
teardown:
  - do:
      fleet-outputs.delete_fleet_outputs_outputid:
        output_id: $output_id
        ignore: [404]
---
"fleet-outputs put fleet outputs outputid":
  - do:
      fleet-outputs.put_fleet_outputs_outputid:
        output_id: $output_id
        body:
          name: cli-ft-fleet-output-put-updated
          type: kafka
          auth_type: none
          hosts:
            - "kafka:9092"
  - is_true: item.id
  - match: {item.name: cli-ft-fleet-output-put-updated}
