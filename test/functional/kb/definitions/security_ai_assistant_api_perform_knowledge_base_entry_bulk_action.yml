# Kibana security-ai-assistant-api: create a knowledge base entry via bulk action.
---
requires:
  serverless: true
  stack: true
---
teardown:
  - do:
      security-ai-assistant-api.perform_knowledge_base_entry_bulk_action:
        body:
          delete:
            ids:
              - $entry_id
        ignore: [404]
---
"security-ai-assistant-api perform knowledge base entry bulk action":
  - do:
      security-ai-assistant-api.perform_knowledge_base_entry_bulk_action:
        body:
          create:
            - name: CLI FT bulk-action knowledge base entry
              type: document
              kbResource: user
              source: test-source
              text: This is a test knowledge base entry created by the CLI functional test.
  - set: { "attributes.results.created.0.id": entry_id }
  - is_true: attributes.results.created
