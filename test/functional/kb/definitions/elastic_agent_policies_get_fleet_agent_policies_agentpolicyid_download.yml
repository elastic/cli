# Kibana elastic-agent-policies API: download a Fleet agent policy by ID.
---
requires:
  serverless: true
  stack: true
---
setup:
  - do:
      elastic-agent-policies.post_fleet_agent_policies:
        body:
          name: cli-ft-ea-policy-download
          namespace: default
  - set: {"item.id": policy_id}
---
teardown:
  - do:
      elastic-agent-policies.post_fleet_agent_policies_delete:
        body:
          agentPolicyId: $policy_id
        ignore: [404]
---
"elastic-agent-policies download fleet agent policy":
  - do:
      elastic-agent-policies.get_fleet_agent_policies_agentpolicyid_download:
        agent_policy_id: $policy_id
  - is_true: ""
