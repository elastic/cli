# Kibana fleet-server-hosts API: create a Fleet Server host.
---
requires:
  serverless: true
  stack: true
---
teardown:
  - do:
      fleet-server-hosts.delete_fleet_fleet_server_hosts_itemid:
        item_id: $host_id
        ignore: [404]
---
"fleet-server-hosts post fleet fleet-server-hosts":
  - do:
      fleet-server-hosts.post_fleet_fleet_server_hosts:
        body:
          name: cli-ft-fleet-server-host
          host_urls:
            - "https://fleet-server.example.com:8220"
  - set: { item.id: host_id }
  - is_true: item.id
  - is_true: item.name
