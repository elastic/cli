# Kibana streams API: create or update a stream by name.
---
requires:
  serverless: true
  stack: true
---
teardown:
  - do:
      streams.delete_streams_name:
        name: cli-ft-streams-put
        ignore: [404]
---
"streams put streams name":
  - do:
      streams.put_streams_name:
        name: cli-ft-streams-put
        body:
          dashboards: []
          rules: []
          stream:
            description: ""
            type: wired
            ingest:
              lifecycle: {}
              processing:
                steps: []
              settings: {}
              failure_store: {}
              wired:
                fields: {}
                routing: []
  - is_true: ""
