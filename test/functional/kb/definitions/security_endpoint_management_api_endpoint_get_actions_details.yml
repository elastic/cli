#
# Kibana security-endpoint-management-api: get response action details by ID.
# No real endpoint action can be created in a test environment, so a known-missing
# UUID is used and a 404 is expected.
---
requires:
  serverless: true
  stack: true
---
"security-endpoint-management-api get action details":
  - do:
      catch: missing
      security-endpoint-management-api.endpoint_get_actions_details:
        action_id: "00000000-0000-0000-0000-000000000000"
