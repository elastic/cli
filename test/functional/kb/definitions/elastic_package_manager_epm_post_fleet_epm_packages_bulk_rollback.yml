# Kibana elastic-package-manager-epm API: bulk rollback packages.
---
requires:
  serverless: true
  stack: true
---
"elastic-package-manager-epm post fleet epm packages bulk rollback":
  - do:
      elastic-package-manager-epm.post_fleet_epm_packages_bulk_rollback:
        body:
          packages:
            - name: system
  - is_true: taskId
