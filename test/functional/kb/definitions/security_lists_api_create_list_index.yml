# Kibana security-lists-api: create value list data streams.
---
requires:
  serverless: true
  stack: true
---
teardown:
  - do:
      security-lists-api.delete_list_index:
        ignore: [404]
---
"security-lists-api create list index":
  - do:
      security-lists-api.create_list_index:
  - match: { acknowledged: true }
