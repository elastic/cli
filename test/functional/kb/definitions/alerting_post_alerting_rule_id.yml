# Kibana alerting API: create a rule with a specific ID and verify response fields.
---
requires:
  serverless: true
  stack: true
---
teardown:
  - do:
      alerting.delete_alerting_rule_id:
        id: cli-ft-rule-post
        ignore: [404]
---
"alerting create rule by ID":
  - do:
      alerting.post_alerting_rule_id:
        id: cli-ft-rule-post
        body:
          consumer: stackAlerts
          name: CLI FT Rule Post
          rule_type_id: ".es-query"
          schedule: {interval: "1m"}
          params:
            searchType: esqlQuery
            esqlQuery: {esql: "FROM * | LIMIT 1"}
            timeWindowSize: 5
            timeWindowUnit: m
            threshold: [0]
            thresholdComparator: ">"
            size: 0
            timeField: "@timestamp"
  - match: {id: cli-ft-rule-post}
  - match: {name: CLI FT Rule Post}
  - match: {rule_type_id: ".es-query"}
  - match: {consumer: stackAlerts}
  - is_true: enabled

  - do:
      alerting.delete_alerting_rule_id:
        id: cli-ft-rule-post
