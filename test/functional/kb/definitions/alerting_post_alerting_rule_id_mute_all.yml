# Kibana alerting API: mute all alerts for a rule and verify via GET.
---
requires:
  serverless: true
  stack: true
---
teardown:
  - do:
      alerting.delete_alerting_rule_id:
        id: cli-ft-rule-mute-all
        ignore: [404]
---
"alerting mute all alerts":
  - do:
      alerting.post_alerting_rule_id:
        id: cli-ft-rule-mute-all
        body:
          consumer: stackAlerts
          name: CLI FT Rule Mute All
          rule_type_id: ".es-query"
          schedule: { interval: "1m" }
          params:
            searchType: esqlQuery
            esqlQuery: { esql: "FROM * | LIMIT 1" }
            timeWindowSize: 5
            timeWindowUnit: m
            threshold: [0]
            thresholdComparator: ">"
            size: 0
            timeField: "@timestamp"
  - match: { id: cli-ft-rule-mute-all }

  - do:
      alerting.post_alerting_rule_id_mute_all:
        id: cli-ft-rule-mute-all

  - do:
      alerting.get_alerting_rule_id:
        id: cli-ft-rule-mute-all
  - match: { id: cli-ft-rule-mute-all }
  - match: { mute_all: true }

  - do:
      alerting.delete_alerting_rule_id:
        id: cli-ft-rule-mute-all
