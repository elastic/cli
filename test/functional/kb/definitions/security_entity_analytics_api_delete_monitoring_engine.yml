#
# Kibana security-entity-analytics-api: delete monitoring engine.
# Initializes the Privilege Monitoring Engine in setup, then verifies
# delete-monitoring-engine removes it. Teardown cleans up in case the test fails.
---
requires:
  serverless: true
  stack: true
  # Missing on older stacks (404/500); x-state carries no version, so gate here.
  stack_since: 9.2.0
  serverless_project: security
---
setup:
  - do:
      security-entity-analytics-api.init_monitoring_engine: {}
---
teardown:
  - do:
      security-entity-analytics-api.delete_monitoring_engine:
        ignore: [404]
---
"security-entity-analytics-api delete monitoring engine":
  - do:
      security-entity-analytics-api.delete_monitoring_engine: {}
