# Kibana security-exceptions-api: create rule exception list items.
---
requires:
  serverless: true
  stack: true
---
setup:
  - do:
      security-detections-api.create_rule:
        body:
          type: query
          name: cli-ft-sec-exc-create-rule-items
          description: Created by functional test
          risk_score: 21
          severity: low
          query: "*"
  - set: {id: rule_id}
---
teardown:
  - do:
      security-detections-api.delete_rule:
        id: $rule_id
        ignore: [404]
---
"security-exceptions-api create rule exception list items":
  - do:
      security-exceptions-api.create_rule_exception_list_items:
        id: $rule_id
        body:
          items:
            - type: simple
              name: CLI FT Rule Exception Item
              description: Test exception item created by functional test
              entries:
                - type: match
                  field: host.name
                  value: test-host
                  operator: included
  # Response is an array of created exception list items, not an object.
  - is_true: 0.id
