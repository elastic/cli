# Kibana SLO API: create an SLO then delete its rollup and summary data in the default space.
---
requires:
  serverless: true
  stack: true
  # Missing on 9.0 (404); x-state carries no version, so gate here.
  stack_since: 9.1.0
  serverless_project: observability
---
setup:
  - do:
      slo.create_slo_op:
        space_id: default
        body:
          id: cli-ft-delete-rollup-slo
          name: CLI FT Delete Rollup Data SLO
          description: Created by functional test
          indicator:
            type: sli.kql.custom
            params:
              index: "*"
              timestampField: "@timestamp"
              good: ""
              total: ""
          timeWindow:
            duration: 7d
            type: rolling
          budgetingMethod: occurrences
          objective:
            target: 0.99
---
teardown:
  - do:
      slo.delete_slo_op:
        space_id: default
        slo_id: cli-ft-delete-rollup-slo
        ignore: [404]
---
"slo delete-rollup-data-op":
  - do:
      slo.delete_rollup_data_op:
        space_id: default
        body:
          list:
            - cli-ft-delete-rollup-slo
          purgePolicy:
            purgeType: fixed_age
            age: 7d
