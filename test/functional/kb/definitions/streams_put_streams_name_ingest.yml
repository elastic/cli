# Kibana streams API: update ingest stream settings by name.
---
requires:
  serverless: true
  stack: true
---
setup:
  - do:
      streams.put_streams_name:
        name: cli-ft-streams-put-ingest
        body:
          dashboards: []
          rules: []
          stream:
            description: ""
            type: wired
            ingest:
              lifecycle: {inherit: {}}
              processing:
                steps: []
              settings: {}
              failure_store: {inherit: {}}
              wired:
                fields: {}
                routing: []
---
teardown:
  - do:
      streams.delete_streams_name:
        name: cli-ft-streams-put-ingest
        ignore: [404]
---
"streams put streams name ingest":
  - do:
      streams.put_streams_name_ingest:
        name: cli-ft-streams-put-ingest
        body:
          ingest:
            lifecycle: {inherit: {}}
            processing:
              steps: []
            settings: {}
            failure_store: {inherit: {}}
            wired:
              fields: {}
              routing: []
  - is_true: ""
