# Kibana workflows API: get a workflow by ID.
---
requires:
  serverless: true
---
setup:
  - do:
      workflows.post_workflows_workflow:
        body:
          id: cli-ft-workflow-get-by-id
          yaml: |
            version: '1'
            name: CLI FT Workflow Get By ID
            triggers:
              - type: manual
            steps: []
---
teardown:
  - do:
      workflows.delete_workflows_workflow_id:
        id: cli-ft-workflow-get-by-id
        force: true
        ignore: [404]
---
"workflows get workflow by id":
  - do:
      workflows.get_workflows_workflow_id:
        id: cli-ft-workflow-get-by-id
  - match: {id: cli-ft-workflow-get-by-id}
