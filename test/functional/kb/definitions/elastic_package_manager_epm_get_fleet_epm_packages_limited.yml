# Kibana elastic-package-manager-epm API: get a limited package list.
---
requires:
  serverless: true
  stack: true
---
"elastic-package-manager-epm get fleet epm packages limited":
  - do:
      elastic-package-manager-epm.get_fleet_epm_packages_limited: {}
  - is_true: items
