# Kibana security-exceptions-api: create a detection exception item then delete it.
---
requires:
  serverless: true
  stack: true
---
setup:
  - do:
      security-exceptions-api.delete_exception_list:
        list_id: cli-ft-sec-exc-delete-parent
        namespace_type: single
        ignore: [404]
  - do:
      security-exceptions-api.create_exception_list:
        body:
          name: CLI FT Exception List Delete Parent
          description: Parent list for delete item test
          type: detection
          list_id: cli-ft-sec-exc-delete-parent
          namespace_type: single
  - do:
      security-exceptions-api.create_exception_list_item:
        body:
          item_id: cli-ft-sec-exc-delete-list-item
          name: CLI FT Delete Exception List Item
          description: Test item for delete test
          type: simple
          list_id: cli-ft-sec-exc-delete-parent
          namespace_type: single
          entries:
            - field: host.name
              type: match
              operator: included
              value: test-host
---
teardown:
  - do:
      security-exceptions-api.delete_exception_list_item:
        item_id: cli-ft-sec-exc-delete-list-item
        namespace_type: single
        ignore: [404]
  - do:
      security-exceptions-api.delete_exception_list:
        list_id: cli-ft-sec-exc-delete-parent
        namespace_type: single
        ignore: [404]
---
"security-exceptions-api delete exception list item":
  - do:
      security-exceptions-api.delete_exception_list_item:
        item_id: cli-ft-sec-exc-delete-list-item
        namespace_type: single
  - is_true: item_id
