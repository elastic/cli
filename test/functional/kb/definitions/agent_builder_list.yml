# Kibana agent-builder API: create agent / list agents / delete agent.
---
requires:
  serverless: true
  stack: true
---
teardown:
  - do:
      agent-builder.delete_agent_builder_agents_id:
        id: cli-ft-ab-list
        ignore: [404]
---
"agent-builder list agents":
  - do:
      agent-builder.post_agent_builder_agents:
        body:
          id: cli-ft-ab-list
          name: CLI FT Agent List
          description: Created by functional test
          configuration:
            tools: []
  - match: {id: cli-ft-ab-list}

  - do:
      agent-builder.get_agent_builder_agents: {}
  - is_true: results.0.id

  - do:
      agent-builder.delete_agent_builder_agents_id:
        id: cli-ft-ab-list
