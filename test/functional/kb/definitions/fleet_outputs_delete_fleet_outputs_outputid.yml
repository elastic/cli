# Kibana fleet-outputs API: delete an output by ID.
---
requires:
  serverless: true
  stack: true
---
setup:
  - do:
      fleet-outputs.post_fleet_outputs:
        body:
          name: cli-ft-fleet-output-delete
          type: kafka
          auth_type: none
          hosts:
            - "kafka:9092"
  - set: { "item.id": output_id }
---
teardown:
  - do:
      fleet-outputs.delete_fleet_outputs_outputid:
        output_id: $output_id
        ignore: [404]
---
"fleet-outputs delete fleet outputs outputid":
  - do:
      fleet-outputs.delete_fleet_outputs_outputid:
        output_id: $output_id
