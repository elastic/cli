# Kibana security-endpoint-exceptions-api: create an endpoint list item then read it.
---
requires:
  serverless: true
  stack: true
---
setup:
  - do:
      security-endpoint-exceptions-api.create_endpoint_list: {}
  - do:
      security-endpoint-exceptions-api.create_endpoint_list_item:
        body:
          item_id: cli-ft-endpoint-list-item-read
          name: CLI FT Endpoint List Item Read
          description: Test item for read test
          type: simple
          entries:
            - type: match
              field: process.name
              value: test.exe
              operator: included
---
teardown:
  - do:
      security-endpoint-exceptions-api.delete_endpoint_list_item:
        item_id: cli-ft-endpoint-list-item-read
        ignore: [404]
---
"security-endpoint-exceptions-api read endpoint list item":
  - do:
      security-endpoint-exceptions-api.read_endpoint_list_item:
        item_id: cli-ft-endpoint-list-item-read
  - is_true: item_id
  - match: {name: CLI FT Endpoint List Item Read}
