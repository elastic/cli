# Kibana workflows API: get logs for a workflow execution.
---
requires:
  serverless: true
---
setup:
  - do:
      workflows.post_workflows_workflow:
        body:
          id: cli-ft-workflow-exec-logs
          yaml: |
            version: '1'
            name: CLI FT Workflow Exec Logs
            triggers:
              - type: manual
            steps: []
  - do:
      workflows.post_workflows_workflow_id_run:
        id: cli-ft-workflow-exec-logs
        body:
          inputs: {}
  - set: { executionId: execution_id }
---
teardown:
  - do:
      workflows.delete_workflows_workflow_id:
        id: cli-ft-workflow-exec-logs
        force: true
        ignore: [404]
---
"workflows get workflows executions executionid logs":
  - do:
      workflows.get_workflows_executions_executionid_logs:
        execution_id: $execution_id
