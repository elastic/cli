# Kibana elastic-agents API: change the privilege level of an enrolled agent.
---
requires:
  serverless: true
  stack: true
---
setup:
  - do:
      elastic-agents.get_fleet_agents: {}
  - set: {"items.0.id": agent_id}
---
"elastic-agents post fleet agents agentid privilege level change":
  - do:
      elastic-agents.post_fleet_agents_agentid_privilege_level_change:
        agent_id: $agent_id
  - is_true: ""
