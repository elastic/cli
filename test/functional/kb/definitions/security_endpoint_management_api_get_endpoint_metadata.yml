#
# Kibana security-endpoint-management-api: get metadata for a single endpoint.
# No real endpoint exists in a test environment, so a fake UUID is used and a
# 404 is expected.
---
requires:
  serverless: true
  stack: true
---
"security-endpoint-management-api get endpoint metadata":
  - do:
      catch: missing
      security-endpoint-management-api.get_endpoint_metadata:
        id: "00000000-0000-0000-0000-000000000000"
