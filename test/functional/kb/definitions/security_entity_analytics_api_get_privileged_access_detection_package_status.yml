#
# Kibana security-entity-analytics-api: get privileged access detection package status.
# Installs the privileged access detection package in setup, then verifies
# get-privileged-access-detection-package-status returns successfully.
# No teardown: there is no uninstall endpoint for this package.
---
requires:
  serverless: true
  stack: true
  serverless_project: security
---
setup:
  - do:
      security-entity-analytics-api.install_privileged_access_detection_package: {}
---
"security-entity-analytics-api get privileged access detection package status":
  - do:
      security-entity-analytics-api.get_privileged_access_detection_package_status: {}
