#
# Kibana security-entity-analytics-api: delete asset criticality record.
# Creates a record in setup, then verifies delete-asset-criticality-record removes it.
# Teardown cleans up in case the delete step fails.
---
requires:
  serverless: true
  stack: true
  serverless_project: security
---
setup:
  - do:
      security-entity-analytics-api.create_asset_criticality_record:
        body:
          id_field: host.name
          id_value: cli-ft-delete-asset-criticality-test
          criticality_level: low_impact
---
teardown:
  - do:
      security-entity-analytics-api.delete_asset_criticality_record:
        id_value: cli-ft-delete-asset-criticality-test
        id_field: host.name
        ignore: [404]
---
"security-entity-analytics-api delete asset criticality record":
  - do:
      security-entity-analytics-api.delete_asset_criticality_record:
        id_value: cli-ft-delete-asset-criticality-test
        id_field: host.name
  - do:
      catch: missing
      security-entity-analytics-api.get_asset_criticality_record:
        id_value: cli-ft-delete-asset-criticality-test
        id_field: host.name
