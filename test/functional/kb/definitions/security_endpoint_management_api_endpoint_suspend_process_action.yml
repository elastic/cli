#
# Kibana security-endpoint-management-api: suspend a process on an endpoint.
# No real endpoint exists in a test environment, so a fake UUID is used and a
# 404 is expected.
---
requires:
  serverless: true
  stack: true
---
"security-endpoint-management-api endpoint suspend process action":
  - do:
      catch: missing
      security-endpoint-management-api.endpoint_suspend_process_action:
        body:
          endpoint_ids:
            - "00000000-0000-0000-0000-000000000000"
          parameters:
            pid: 1
