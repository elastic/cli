# Kibana streams API: get ingest stream settings by name.
---
requires:
  serverless: true
  stack: true
  # Wired-stream body (logs.otel root, failure_store) is 9.5+; older stacks 400.
  stack_since: 9.5.0
---
setup:
  - do:
      streams.put_streams_name:
        name: logs.otel.cli-ft-streams-get-ingest
        body:
          dashboards: []
          rules: []
          stream:
            description: ""
            type: wired
            ingest:
              lifecycle: {inherit: {}}
              processing:
                steps: []
              settings: {}
              failure_store: {inherit: {}}
              wired:
                fields: {}
                routing: []
---
teardown:
  - do:
      streams.delete_streams_name:
        name: logs.otel.cli-ft-streams-get-ingest
        ignore: [404]
---
"streams get streams name ingest":
  - do:
      streams.get_streams_name_ingest:
        name: logs.otel.cli-ft-streams-get-ingest
  - is_true: ingest
