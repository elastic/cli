# Kibana elastic-package-manager-epm API: delete a specific version of a package.
---
requires:
  serverless: true
  stack: true
---
setup:
  - do:
      elastic-package-manager-epm.post_fleet_epm_packages_pkgname:
        pkg_name: apache
  - do:
      elastic-package-manager-epm.get_fleet_epm_packages_pkgname:
        pkg_name: apache
  - set: {"item.version": pkg_version}
---
teardown:
  - do:
      elastic-package-manager-epm.delete_fleet_epm_packages_pkgname_pkgversion:
        pkg_name: apache
        pkg_version: $pkg_version
        ignore: [404]
---
"elastic-package-manager-epm delete fleet epm packages pkgname pkgversion":
  - do:
      elastic-package-manager-epm.delete_fleet_epm_packages_pkgname_pkgversion:
        pkg_name: apache
        pkg_version: $pkg_version
  - is_true: ""
