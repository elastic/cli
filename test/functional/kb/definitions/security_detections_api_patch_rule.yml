# Kibana security-detections-api: patch a detection rule by ID.
---
requires:
  serverless: true
  stack: true
---
setup:
  - do:
      security-detections-api.create_rule:
        body:
          type: query
          name: cli-ft-sec-det-patch-rule
          description: Created by functional test
          risk_score: 21
          severity: low
          query: "*"
  - set: { id: rule_id }
---
teardown:
  - do:
      security-detections-api.delete_rule:
        id: $rule_id
        ignore: [404]
---
"security-detections-api patch rule":
  - do:
      security-detections-api.patch_rule:
        body:
          id: $rule_id
          name: cli-ft-sec-det-patch-rule-updated
  - is_true: id
  - match: { name: cli-ft-sec-det-patch-rule-updated }
