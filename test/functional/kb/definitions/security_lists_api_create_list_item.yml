# Kibana security-lists-api: create a value list then create an item in it.
---
requires:
  serverless: true
  stack: true
---
setup:
  - do:
      security-lists-api.create_list_index:
  - do:
      security-lists-api.create_list:
        body:
          id: cli-ft-sec-lists-create-item-list
          name: CLI FT Create List Item List
          description: Created by functional test
          type: keyword
---
teardown:
  - do:
      security-lists-api.delete_list_item:
        id: cli-ft-sec-lists-create-item
        ignore: [404]
  - do:
      security-lists-api.delete_list:
        id: cli-ft-sec-lists-create-item-list
        ignore: [404]
---
"security-lists-api create list item":
  - do:
      security-lists-api.create_list_item:
        body:
          id: cli-ft-sec-lists-create-item
          list_id: cli-ft-sec-lists-create-item-list
          value: "192.0.2.1"
  - match: { id: cli-ft-sec-lists-create-item }
  - match: { list_id: cli-ft-sec-lists-create-item-list }
  - match: { value: "192.0.2.1" }
