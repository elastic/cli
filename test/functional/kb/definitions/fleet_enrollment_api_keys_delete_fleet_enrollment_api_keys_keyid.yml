# Kibana fleet-enrollment-api-keys API: delete (revoke) an enrollment API key by ID.
---
requires:
  serverless: true
  stack: true
---
setup:
  - do:
      elastic-agent-policies.post_fleet_agent_policies:
        body:
          name: cli-ft-fleet-enroll-key-delete-policy
          namespace: testprefix
  - set: { "item.id": policy_id }
  - do:
      fleet-enrollment-api-keys.post_fleet_enrollment_api_keys:
        body:
          policy_id: $policy_id
  - set: { "item.id": key_id }
---
teardown:
  - do:
      fleet-enrollment-api-keys.delete_fleet_enrollment_api_keys_keyid:
        key_id: $key_id
        ignore: [404]
  - do:
      elastic-agent-policies.post_fleet_agent_policies_delete:
        body:
          agentPolicyId: $policy_id
        ignore: [404]
---
"fleet-enrollment-api-keys delete fleet enrollment api keys keyid":
  - do:
      fleet-enrollment-api-keys.delete_fleet_enrollment_api_keys_keyid:
        key_id: $key_id
  - is_true: action
