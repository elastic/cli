# Kibana agent-builder API: get tool by ID.
---
requires:
  serverless: true
  stack: true
---
teardown:
  - do:
      agent-builder.delete_agent_builder_tools_toolid:
        tool_id: cli-ft-ab-get-toolid
        force: true
        ignore: [404]
---
"agent-builder get tool by ID":
  - do:
      agent-builder.post_agent_builder_tools:
        body:
          id: cli-ft-ab-get-toolid
          type: esql
          description: Created by functional test
          configuration:
            query: "FROM .kibana | LIMIT 1"
            params: {}
  - match: { id: cli-ft-ab-get-toolid }

  - do:
      agent-builder.get_agent_builder_tools_toolid:
        tool_id: cli-ft-ab-get-toolid
  - match: { id: cli-ft-ab-get-toolid }
  - match: { type: esql }

  - do:
      agent-builder.delete_agent_builder_tools_toolid:
        tool_id: cli-ft-ab-get-toolid
        force: true
