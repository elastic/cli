# Kibana maintenance-window API: create a maintenance window then archive it by ID.
---
requires:
  serverless: true
  stack: true
---
setup:
  - do:
      maintenance-window.post_maintenance_window:
        body:
          title: CLI FT Archive Maintenance Window
          schedule:
            custom:
              start: "2030-01-01T00:00:00.000Z"
              duration: 1h
  - set: { id: mw_id }
---
teardown:
  - do:
      maintenance-window.delete_maintenance_window_id:
        id: $mw_id
        ignore: [404]
---
"maintenance-window archive by id":
  - do:
      maintenance-window.post_maintenance_window_id_archive:
        id: $mw_id
  - is_true: ""
