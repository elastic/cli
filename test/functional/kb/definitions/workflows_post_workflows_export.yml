# Kibana workflows API: export a workflow by ID.
---
requires:
  serverless: true
---
setup:
  - do:
      workflows.post_workflows_workflow:
        body:
          id: cli-ft-workflow-export
          yaml: |
            version: '1'
            name: CLI FT Workflow Export
            triggers:
              - type: manual
            steps: []
---
teardown:
  - do:
      workflows.delete_workflows_workflow_id:
        id: cli-ft-workflow-export
        force: true
        ignore: [404]
---
"workflows post workflows export":
  - do:
      workflows.post_workflows_export:
        body:
          ids:
            - cli-ft-workflow-export
  - is_true: ""
