#
# Kibana security-entity-analytics-api: configure risk engine saved object.
# Verifies that configure-risk-engine-saved-object patches the saved object without error.
---
requires:
  serverless: true
  stack: true
  serverless_project: security
---
"security-entity-analytics-api configure risk engine saved object":
  - do:
      security-entity-analytics-api.configure_risk_engine_saved_object:
        body:
          page_size: 500
  - is_true: ""
