# Kibana elastic-package-manager-epm API: review a pending policy upgrade for a package with deprecations.
---
requires:
  serverless: true
  stack: true
---
setup:
  - do:
      elastic-package-manager-epm.get_fleet_epm_packages_pkgname:
        pkg_name: apache
  - set: { "item.version": pkg_version }
  - do:
      elastic-package-manager-epm.post_fleet_epm_packages_pkgname_pkgversion:
        pkg_name: apache
        pkg_version: $pkg_version
---
teardown:
  - do:
      elastic-package-manager-epm.delete_fleet_epm_packages_pkgname_pkgversion:
        pkg_name: apache
        pkg_version: $pkg_version
        ignore: [404]
---
"elastic-package-manager-epm post fleet epm packages pkgname review upgrade":
  - do:
      catch: bad_request
      elastic-package-manager-epm.post_fleet_epm_packages_pkgname_review_upgrade:
        pkg_name: apache
        body:
          action: pending
          target_version: $pkg_version
