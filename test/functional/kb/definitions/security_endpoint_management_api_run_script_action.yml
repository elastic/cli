#
# Kibana security-endpoint-management-api: run a script on an endpoint.
# No real endpoint exists in a test environment, so a fake UUID is used and a
# 404 is expected.
---
requires:
  serverless: true
  stack: true
---
"security-endpoint-management-api run script action":
  - do:
      catch: missing
      security-endpoint-management-api.run_script_action:
        body:
          endpoint_ids:
            - "00000000-0000-0000-0000-000000000000"
          parameters:
            scriptId: "dummy-script-id"
