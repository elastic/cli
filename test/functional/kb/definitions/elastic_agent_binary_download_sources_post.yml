# Kibana elastic-agent-binary-download-sources API: create an agent binary download source.
---
requires:
  serverless: true
  stack: true
---
teardown:
  - do:
      elastic-agent-binary-download-sources.delete_fleet_agent_download_sources_sourceid:
        source_id: $source_id
        ignore: [404]
---
"elastic-agent-binary-download-sources post fleet agent download sources":
  - do:
      elastic-agent-binary-download-sources.post_fleet_agent_download_sources:
        body:
          name: cli-ft-download-source
          host: https://artifacts.elastic.co/downloads/
  - set: { item.id: source_id }
  - is_true: item.id
  - match: { item.name: cli-ft-download-source }
