# Kibana fleet-proxies API: create a proxy.
---
requires:
  serverless: true
  stack: true
---
teardown:
  - do:
      fleet-proxies.delete_fleet_proxies_itemid:
        item_id: $proxy_id
        ignore: [404]
---
"fleet-proxies post fleet proxies":
  - do:
      fleet-proxies.post_fleet_proxies:
        body:
          name: cli-ft-fleet-proxy
          url: "https://proxy.example.com:8080"
  - set: {item.id: proxy_id}
  - is_true: item.id
  - is_true: item.name
