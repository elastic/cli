# Kibana SLO API: create an SLO then bulk-delete it in the default space.
---
requires:
  serverless: true
  stack: true
---
teardown:
  - do:
      slo.delete_slo_op:
        space_id: default
        slo_id: cli-ft-bulk-delete-slo
        ignore: [404]
---
"slo bulk-delete-op":
  - do:
      slo.create_slo_op:
        space_id: default
        body:
          id: cli-ft-bulk-delete-slo
          name: CLI FT Bulk Delete SLO
          description: Created by functional test
          indicator:
            type: sli.kql.custom
            params:
              index: "*"
              timestampField: "@timestamp"
              good: ""
              total: ""
          timeWindow:
            duration: 7d
            type: rolling
          budgetingMethod: occurrences
          objective:
            target: 0.99
  - match: {id: cli-ft-bulk-delete-slo}

  - do:
      slo.bulk_delete_op:
        space_id: default
        body:
          list:
            - cli-ft-bulk-delete-slo
