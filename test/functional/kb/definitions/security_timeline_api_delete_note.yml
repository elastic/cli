#
# Kibana security-timeline-api: delete note.
# Creates a standalone note in setup, then verifies delete-note removes it.
# Teardown cleans up in case the delete step fails.
---
requires:
  serverless: true
  stack: true
---
setup:
  - do:
      security-timeline-api.persist_note_route:
        body:
          note:
            timelineId: ""
            note: CLI FT delete-note test
  - set: { "note.noteId": note_id }
---
teardown:
  - do:
      security-timeline-api.delete_note:
        note_id: $note_id
        ignore: [404]
---
"security-timeline-api delete note":
  - do:
      security-timeline-api.delete_note:
        note_id: $note_id
