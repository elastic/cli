#
# Kibana security-attack-discovery-api: bulk enable Attack Discovery schedules.
# Creates a .gen-ai connector and a disabled schedule as prerequisites, then bulk-enables the schedule.
---
requires:
  serverless: true
  stack: true
---
setup:
  - do:
      connectors.post_actions_connector_id:
        id: cli-ft-attack-discovery-bulk-en-connector
        body:
          connector_type_id: ".gen-ai"
          name: CLI FT Attack Discovery Bulk En Connector
          config:
            apiProvider: OpenAI
            apiUrl: "https://api.openai.com/v1"
          secrets:
            apiKey: "placeholder-key"
  - match: { id: cli-ft-attack-discovery-bulk-en-connector }
  - do:
      security-attack-discovery-api.create_attack_discovery_schedules:
        body:
          name: cli-ft-attack-discovery-bulk-en-schedule
          enabled: false
          schedule:
            interval: "24h"
          params:
            alerts_index_pattern: ".alerts-security.alerts-default"
            api_config:
              connectorId: cli-ft-attack-discovery-bulk-en-connector
              actionTypeId: ".gen-ai"
              name: CLI FT Attack Discovery Bulk En Connector
            size: 20
  - set: { id: schedule_id }
---
teardown:
  - do:
      security-attack-discovery-api.delete_attack_discovery_schedules:
        id: $schedule_id
        ignore: [404]
  - do:
      connectors.delete_actions_connector_id:
        id: cli-ft-attack-discovery-bulk-en-connector
        ignore: [404]
---
"security-attack-discovery-api bulk enable attack discovery schedules":
  - do:
      security-attack-discovery-api.bulk_enable_attack_discovery_schedules:
        body:
          ids:
            - $schedule_id
