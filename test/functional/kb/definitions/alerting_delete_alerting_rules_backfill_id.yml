# Kibana alerting API: schedule a backfill then delete it by ID.
---
requires:
  serverless: true
  stack: true
---
teardown:
  - do:
      alerting.delete_alerting_rules_backfill_id:
        id: $backfill_id
        ignore: [404]
  - do:
      alerting.delete_alerting_rule_id:
        id: cli-ft-rule-backfill-delete
        ignore: [404]
---
"alerting delete backfill by ID":
  - do:
      alerting.post_alerting_rule_id:
        id: cli-ft-rule-backfill-delete
        body:
          consumer: stackAlerts
          name: CLI FT Rule Backfill Delete
          rule_type_id: ".es-query"
          schedule: {interval: "1m"}
          params:
            searchType: esqlQuery
            esqlQuery: {esql: "FROM * | LIMIT 1"}
            timeWindowSize: 5
            timeWindowUnit: m
            threshold: [0]
            thresholdComparator: ">"
            size: 0
            timeField: "@timestamp"
  - match: {id: cli-ft-rule-backfill-delete}

  - do:
      alerting.post_alerting_rules_backfill_schedule:
        body:
          - rule_id: cli-ft-rule-backfill-delete
            ranges:
              - start: "2024-01-01T00:00:00.000Z"
                end: "2024-01-02T00:00:00.000Z"
  - set: {"0.id": backfill_id}
  - is_true: "0.id"

  - do:
      alerting.delete_alerting_rules_backfill_id:
        id: $backfill_id

  - do:
      alerting.delete_alerting_rule_id:
        id: cli-ft-rule-backfill-delete
