# Kibana security-exceptions-api: create an exception list then delete it.
---
requires:
  serverless: true
  stack: true
  serverless_project: security
---
teardown:
  - do:
      security-exceptions-api.delete_exception_list:
        list_id: cli-ft-sec-exc-del-list
        namespace_type: single
        ignore: [404]
---
"security-exceptions-api delete exception list":
  - do:
      security-exceptions-api.create_exception_list:
        body:
          name: CLI FT Exception List Delete
          description: Created by functional test
          type: detection
          list_id: cli-ft-sec-exc-del-list
          namespace_type: single
  - match: {list_id: cli-ft-sec-exc-del-list}

  - do:
      security-exceptions-api.delete_exception_list:
        list_id: cli-ft-sec-exc-del-list
        namespace_type: single
  - match: {list_id: cli-ft-sec-exc-del-list}
