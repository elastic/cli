#
# Kibana security-detections-api: list all detection rule tags.
# Creates a rule with a known tag, verifies it appears in read-tags output, then deletes.
---
requires:
  serverless: true
  stack: true
  serverless_project: security
---
setup:
  - do:
      security-detections-api.create_rule:
        body:
          type: query
          name: cli-ft-sec-det-read-tags
          description: Created by functional test
          risk_score: 21
          severity: low
          query: "*"
          tags:
            - cli-ft-read-tags
  - set: {id: rule_id}
---
teardown:
  - do:
      security-detections-api.delete_rule:
        id: $rule_id
        ignore: [404]
---
"security-detections-api read tags":
  - do:
      security-detections-api.read_tags:
  - contains: {"": "cli-ft-read-tags"}
