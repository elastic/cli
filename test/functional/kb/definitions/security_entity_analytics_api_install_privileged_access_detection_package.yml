#
# Kibana security-entity-analytics-api: install privileged access detection package.
# Verifies that install-privileged-access-detection-package completes successfully.
# No teardown: there is no uninstall endpoint for this package.
---
requires:
  serverless: true
  stack: true
  # Missing on older stacks (404/500); x-state carries no version, so gate here.
  stack_since: 9.2.0
  serverless_project: security
---
"security-entity-analytics-api install privileged access detection package":
  - do:
      security-entity-analytics-api.install_privileged_access_detection_package: {}
