# Kibana data-views API: delete a runtime field from a data view.
---
requires:
  serverless: true
  stack: true
---
setup:
  - do:
      data-views.create_data_view_default:
        body:
          data_view: { title: "cli-ft-dv-del-rt-field-*", name: cli-ft-dv-del-rt-field }
  - set: { data_view.id: view_id }
  - do:
      data-views.create_runtime_field_default:
        viewId: $view_id
        body:
          name: cli_ft_del_rt_field
          runtimeField:
            type: keyword
---
teardown:
  - do:
      data-views.delete_data_view_default:
        viewId: $view_id
        ignore: [404]
---
"data views delete runtime field":
  - do:
      data-views.delete_runtime_field_default:
        viewId: $view_id
        fieldName: cli_ft_del_rt_field
  - do:
      catch: missing
      data-views.get_runtime_field_default:
        viewId: $view_id
        fieldName: cli_ft_del_rt_field
