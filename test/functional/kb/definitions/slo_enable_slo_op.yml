# Kibana SLO API: create an SLO, disable it, then re-enable it in the default space.
---
requires:
  serverless: true
  stack: true
  serverless_project: observability
---
setup:
  - do:
      slo.create_slo_op:
        space_id: default
        body:
          id: cli-ft-enable-slo
          name: CLI FT Enable SLO
          description: Created by functional test
          indicator:
            type: sli.kql.custom
            params:
              index: "*"
              timestampField: "@timestamp"
              good: ""
              total: ""
          timeWindow:
            duration: 7d
            type: rolling
          budgetingMethod: occurrences
          objective:
            target: 0.99
  - do:
      slo.disable_slo_op:
        space_id: default
        slo_id: cli-ft-enable-slo
---
teardown:
  - do:
      slo.delete_slo_op:
        space_id: default
        slo_id: cli-ft-enable-slo
        ignore: [404]
---
"slo enable-slo-op":
  - do:
      slo.enable_slo_op:
        space_id: default
        slo_id: cli-ft-enable-slo
