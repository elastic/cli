#
# Kibana security-osquery-api: update a saved query.
# Creates a saved query in setup, updates it in the test, and verifies the change.
---
requires:
  serverless: true
  stack: true
---
setup:
  - do:
      security-osquery-api.osquery_create_saved_query:
        body:
          id: cli-ft-osquery-update-saved-query
          query: SELECT * FROM uptime LIMIT 1
          interval: "3600"
          description: Created by elastic-cli functional test
  - set: {"data.id": saved_query_id}
---
teardown:
  - do:
      security-osquery-api.osquery_delete_saved_query:
        id: $saved_query_id
        ignore: [404]
---
"security-osquery-api update saved query":
  - do:
      security-osquery-api.osquery_update_saved_query:
        id: $saved_query_id
        body:
          id: cli-ft-osquery-update-saved-query
          query: SELECT * FROM uptime LIMIT 1
          interval: "7200"
          description: Updated by elastic-cli functional test
  - match: {data.interval: "7200"}
  - match: {data.description: "Updated by elastic-cli functional test"}
