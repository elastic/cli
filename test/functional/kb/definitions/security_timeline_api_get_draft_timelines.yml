# Kibana security-timeline-api: get draft timelines.
---
requires:
  serverless: true
  stack: true
  serverless_project: security
---
"security-timeline-api get draft timelines":
  - do:
      security-timeline-api.get_draft_timelines:
        timeline_type: default
  - is_true: ""
