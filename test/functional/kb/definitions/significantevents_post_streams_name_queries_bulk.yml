# Kibana significantevents API: bulk upsert a query on a stream.
---
requires:
  serverless: true
  stack: true
  serverless_project: observability
---
setup:
  - do:
      streams.put_streams_name:
        name: logs.otel.cli-ft-se-bulk
        body:
          dashboards: []
          rules: []
          stream:
            description: ""
            type: wired
            ingest:
              lifecycle: {inherit: {}}
              processing:
                steps: []
              settings: {}
              failure_store: {inherit: {}}
              wired:
                fields: {}
                routing: []
---
teardown:
  - do:
      significantevents.delete_streams_name_queries_queryid:
        name: logs.otel.cli-ft-se-bulk
        query_id: cli-ft-se-bulk-query
        ignore: [404]
  - do:
      streams.delete_streams_name:
        name: logs.otel.cli-ft-se-bulk
        ignore: [404]
---
"significantevents post streams name queries bulk":
  - do:
      significantevents.post_streams_name_queries_bulk:
        name: logs.otel.cli-ft-se-bulk
        body:
          operations:
            - index:
                id: cli-ft-se-bulk-query
                title: CLI FT Bulk Query
                esql:
                  query: "FROM logs.otel.cli-ft-se-bulk | LIMIT 10"
  - is_true: ""
