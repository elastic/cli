# Kibana elastic-agent-policies API: delete an agent policy.
---
requires:
  serverless: true
  stack: true
---
setup:
  - do:
      elastic-agent-policies.post_fleet_agent_policies:
        body:
          name: cli-ft-ea-policy-delete
          namespace: testprefix
  - set: {"item.id": policy_id}
---
teardown:
  - do:
      elastic-agent-policies.post_fleet_agent_policies_delete:
        body:
          agentPolicyId: $policy_id
        ignore: [404]
---
"elastic-agent-policies delete an agent policy":
  - do:
      elastic-agent-policies.post_fleet_agent_policies_delete:
        body:
          agentPolicyId: $policy_id
  - is_true: id
