#
# Kibana security-detections-api: set assignees on attack discovery alerts (no-op).
# Uses a nonexistent alert ID with empty add/remove arrays. The bulk assignment
# returns successfully with zero updates rather than an error, so no setup or
# teardown is required.
---
requires:
  serverless: false
  stack: false
---
"security-detections-api set attacks assignees":
  - do:
      security-detections-api.set_attacks_assignees:
        body:
          ids:
            - nonexistent-alert-id
          assignees:
            add: []
            remove: []
  - is_true: ""
