#
# Kibana security-attack-discovery-api: create an Attack Discovery schedule.
# Creates a .gen-ai connector as a prerequisite, then creates the schedule.
---
requires:
  serverless: true
  stack: true
---
setup:
  - do:
      connectors.post_actions_connector_id:
        id: cli-ft-attack-discovery-sched-connector
        body:
          connector_type_id: ".gen-ai"
          name: CLI FT Attack Discovery Sched Connector
          config:
            apiProvider: OpenAI
            apiUrl: "https://api.openai.com/v1"
          secrets:
            apiKey: "placeholder-key"
  - match: { id: cli-ft-attack-discovery-sched-connector }
---
teardown:
  - do:
      security-attack-discovery-api.delete_attack_discovery_schedules:
        id: $schedule_id
        ignore: [404]
  - do:
      connectors.delete_actions_connector_id:
        id: cli-ft-attack-discovery-sched-connector
        ignore: [404]
---
"security-attack-discovery-api create attack discovery schedules":
  - do:
      security-attack-discovery-api.create_attack_discovery_schedules:
        body:
          name: cli-ft-attack-discovery-schedule
          schedule:
            interval: "24h"
          params:
            alerts_index_pattern: ".alerts-security.alerts-default"
            api_config:
              connectorId: cli-ft-attack-discovery-sched-connector
              actionTypeId: ".gen-ai"
              name: CLI FT Attack Discovery Sched Connector
            size: 20
  - set: { id: schedule_id }
  - is_true: id
