# Kibana security-exceptions-api: create an exception list item.
---
requires:
  serverless: true
  stack: true
  serverless_project: security
---
setup:
  - do:
      security-exceptions-api.delete_exception_list:
        list_id: cli-ft-sec-exc-parent-list
        namespace_type: single
        ignore: [404]
  - do:
      security-exceptions-api.create_exception_list:
        body:
          name: CLI FT Exception List Parent
          description: Parent list for create item test
          type: detection
          list_id: cli-ft-sec-exc-parent-list
          namespace_type: single
---
teardown:
  - do:
      security-exceptions-api.delete_exception_list_item:
        item_id: cli-ft-sec-exc-create-list-item
        namespace_type: single
        ignore: [404]
  - do:
      security-exceptions-api.delete_exception_list:
        list_id: cli-ft-sec-exc-parent-list
        namespace_type: single
        ignore: [404]
---
"security-exceptions-api create exception list item":
  - do:
      security-exceptions-api.create_exception_list_item:
        body:
          item_id: cli-ft-sec-exc-create-list-item
          name: CLI FT Create Exception List Item
          description: Created by functional test
          type: simple
          list_id: cli-ft-sec-exc-parent-list
          namespace_type: single
          entries:
            - field: host.name
              type: match
              operator: included
              value: test-host
  - is_true: item_id
  - match: {item_id: cli-ft-sec-exc-create-list-item}
  - match: {name: CLI FT Create Exception List Item}
