# Kibana agent-builder API: create agent / get access control list / delete agent.
---
requires:
  serverless: true
  stack: true
---
teardown:
  - do:
      agent-builder.delete_agent_builder_agents_id:
        id: cli-ft-ab-acl
        ignore: [404]
---
"agent-builder get agent access control":
  - do:
      agent-builder.post_agent_builder_agents:
        body:
          id: cli-ft-ab-acl
          name: CLI FT Agent ACL
          description: Created by functional test
          configuration:
            tools: []
  - match: {id: cli-ft-ab-acl}

  - do:
      agent-builder.get_agent_builder_agents_id_access_control:
        id: cli-ft-ab-acl
  - is_true: ""

  - do:
      agent-builder.delete_agent_builder_agents_id:
        id: cli-ft-ab-acl
