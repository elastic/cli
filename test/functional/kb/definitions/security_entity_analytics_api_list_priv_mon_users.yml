#
# Kibana security-entity-analytics-api: list priv-mon users.
# Initializes the Privilege Monitoring Engine in setup, then verifies
# list-priv-mon-users returns a response. Teardown deletes the engine to clean up.
---
requires:
  serverless: true
  stack: true
  serverless_project: security
---
setup:
  - do:
      security-entity-analytics-api.init_monitoring_engine: {}
---
teardown:
  - do:
      security-entity-analytics-api.delete_monitoring_engine:
        ignore: [404]
---
"security-entity-analytics-api list priv-mon users":
  - do:
      security-entity-analytics-api.list_priv_mon_users: {}
  - is_true: ""
