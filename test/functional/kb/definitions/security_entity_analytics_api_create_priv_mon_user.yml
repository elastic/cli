#
# Kibana security-entity-analytics-api: create priv-mon user.
# Initializes the Privilege Monitoring Engine in setup, then verifies
# create-priv-mon-user creates a monitored user. Teardown deletes the engine to clean up.
---
requires:
  serverless: true
  stack: true
  serverless_project: security
---
setup:
  - do:
      security-entity-analytics-api.init_monitoring_engine: {}
---
teardown:
  - do:
      security-entity-analytics-api.delete_monitoring_engine:
        ignore: [404]
---
"security-entity-analytics-api create priv-mon user":
  - do:
      security-entity-analytics-api.create_priv_mon_user:
        body:
          user:
            name: cli-ft-priv-mon-user
  - is_true: user.name
