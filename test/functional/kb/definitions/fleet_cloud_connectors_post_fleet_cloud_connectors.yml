# Kibana fleet-cloud-connectors API: create a cloud connector.
---
requires:
  serverless: true
---
teardown:
  - do:
      fleet-cloud-connectors.delete_fleet_cloud_connectors_cloudconnectorid:
        cloud_connector_id: $connector_id
        ignore: [404]
---
"fleet-cloud-connectors post fleet cloud connectors":
  - do:
      fleet-cloud-connectors.post_fleet_cloud_connectors:
        body:
          name: cli-ft-cloud-connector
          cloudProvider: aws
          vars:
            role_arn:
              type: text
              value: arn:aws:iam::123456789012:role/cli-ft
            external_id:
              type: text
              value: cli-ft-external-id-1234567890
  - set: { "item.id": connector_id }
  - is_true: item.id
  - is_true: item.name
