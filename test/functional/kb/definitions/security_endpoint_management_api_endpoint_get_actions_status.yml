# Kibana security-endpoint-management-api: get response actions status for a list of agents.
---
requires:
  serverless: true
  stack: true
  serverless_project: security
---
"security-endpoint-management-api get response actions status":
  - do:
      security-endpoint-management-api.endpoint_get_actions_status:
        agent_ids: "00000000-0000-0000-0000-000000000000"
  - is_true: data
