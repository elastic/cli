# Kibana markdowns API: delete a markdown library item by ID.
---
requires:
  serverless: false
  stack: false
---
teardown:
  - do:
      markdowns.delete_markdowns_id:
        id: $markdown_id
        ignore: [404]
---
"markdowns delete markdowns id":
  - do:
      markdowns.post_markdowns:
        body:
          title: test-markdown-delete
          content: "# Hello"
  - set: {id: markdown_id}
  - is_true: id

  - do:
      markdowns.delete_markdowns_id:
        id: $markdown_id
