#
# Kibana security-entity-store API: install the Entity Store.
# Verifies that post-security-entity-store-install succeeds without error.
---
requires:
  serverless: true
  stack: true
---
teardown:
  - do:
      security-entity-store.post_security_entity_store_uninstall:
        body:
          entityTypes: [user, host, service, generic]
        ignore: [404]
---
"security-entity-store install":
  - do:
      security-entity-store.post_security_entity_store_install:
        body:
          entityTypes: [user, host, service, generic]
  - is_true: ""
