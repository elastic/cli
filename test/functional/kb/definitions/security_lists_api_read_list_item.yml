# Kibana security-lists-api: create a value list + item then read the item.
---
requires:
  serverless: true
  stack: true
---
setup:
  - do:
      security-lists-api.create_list_index:
  - do:
      security-lists-api.create_list:
        body:
          id: cli-ft-sec-lists-read-item-list
          name: CLI FT Read List Item List
          description: Created by functional test
          type: keyword
  - do:
      security-lists-api.create_list_item:
        body:
          id: cli-ft-sec-lists-read-item
          list_id: cli-ft-sec-lists-read-item-list
          value: "192.0.2.1"
---
teardown:
  - do:
      security-lists-api.delete_list_item:
        id: cli-ft-sec-lists-read-item
        ignore: [404]
  - do:
      security-lists-api.delete_list:
        id: cli-ft-sec-lists-read-item-list
        ignore: [404]
---
"security-lists-api read list item":
  - do:
      security-lists-api.read_list_item:
        id: cli-ft-sec-lists-read-item
  - match: {id: cli-ft-sec-lists-read-item}
  - match: {list_id: cli-ft-sec-lists-read-item-list}
  - match: {value: "192.0.2.1"}
