#
# Kibana security-endpoint-management-api: create a script in the endpoint script library.
# Writes a minimal bash script to a temp file in setup, uploads it in the test,
# and deletes the created entry in teardown using the returned ID.
---
requires:
  serverless: true
  stack: true
---
setup:
  - write_temp:
      variable: script_file
      content: "#!/bin/bash\necho hello\n"
      suffix: .sh
---
teardown:
  - do:
      security-endpoint-management-api.endpoint_script_library_delete_script:
        script_id: $script_id
        ignore: [404]
---
"security-endpoint-management-api create endpoint script library script":
  - do:
      security-endpoint-management-api.endpoint_script_library_create_script:
        body:
          file: $script_file
          fileType: script
          name: cli-ft-ep-script-lib-create
          platform: linux
  - is_true: id
  - is_true: name
  - set: { id: script_id }
