# Kibana dashboards API: create a dashboard.
---
requires:
  serverless: true
  stack: true
---
teardown:
  - do:
      dashboards.delete_dashboard:
        id: $dashboard_id
        ignore: [404]
---
"dashboards create":
  - do:
      dashboards.create_dashboard:
        body:
          title: cli-ft-dashboard-create
  - set: {id: dashboard_id}
  - is_true: id
