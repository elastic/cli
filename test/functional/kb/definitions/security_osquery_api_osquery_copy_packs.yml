#
# Kibana security-osquery-api: copy a pack.
# Creates a source pack in setup, copies it in the test, and deletes both in teardown.
---
requires:
  serverless: true
  stack: true
---
setup:
  - do:
      security-osquery-api.osquery_create_packs:
        body:
          name: cli-ft-osquery-copy-packs-source
          enabled: true
          interval: 3600
          queries:
            uptime:
              query: SELECT * FROM uptime LIMIT 1
  - set: {"data.id": source_pack_id}
---
teardown:
  - do:
      security-osquery-api.osquery_delete_packs:
        id: $source_pack_id
        ignore: [404]
  - do:
      security-osquery-api.osquery_delete_packs:
        id: $copy_pack_id
        ignore: [404]
---
"security-osquery-api copy pack":
  - do:
      security-osquery-api.osquery_copy_packs:
        id: $source_pack_id
  - set: {"data.id": copy_pack_id}
  - is_true: data.id
  - is_true: data.name
