#
# Kibana security-entity-analytics-api: priv-mon health.
# Initializes the Privilege Monitoring Engine in setup, then verifies
# priv-mon-health returns successfully. Teardown deletes the engine to clean up.
---
requires:
  serverless: true
  stack: true
  serverless_project: security
---
setup:
  - do:
      security-entity-analytics-api.init_monitoring_engine: {}
---
teardown:
  - do:
      security-entity-analytics-api.delete_monitoring_engine:
        ignore: [404]
---
"security-entity-analytics-api priv-mon health":
  - do:
      security-entity-analytics-api.priv_mon_health: {}
