# Kibana streams API: get a stream by name.
---
requires:
  serverless: true
  stack: true
---
setup:
  - do:
      streams.put_streams_name:
        name: logs.otel.cli-ft-streams-get-name
        body:
          dashboards: []
          rules: []
          stream:
            description: ""
            type: wired
            ingest:
              lifecycle: {inherit: {}}
              processing:
                steps: []
              settings: {}
              failure_store: {inherit: {}}
              wired:
                fields: {}
                routing: []
---
teardown:
  - do:
      streams.delete_streams_name:
        name: logs.otel.cli-ft-streams-get-name
        ignore: [404]
---
"streams get streams name":
  - do:
      streams.get_streams_name:
        name: logs.otel.cli-ft-streams-get-name
  - is_true: stream
