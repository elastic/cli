# Kibana workflows API: list executions across all workflows.
---
requires:
  serverless: true
---
setup:
  - do:
      workflows.post_workflows_workflow:
        body:
          id: cli-ft-workflow-executions-all
          yaml: |
            version: '1'
            name: CLI FT Workflow Executions All
            triggers:
              - type: manual
            steps: []
  - do:
      workflows.post_workflows_workflow_id_run:
        id: cli-ft-workflow-executions-all
        body:
          inputs: {}
---
teardown:
  - do:
      workflows.delete_workflows_workflow_id:
        id: cli-ft-workflow-executions-all
        force: true
        ignore: [404]
---
"workflows get workflows workflow executions":
  - do:
      workflows.get_workflows_workflow_executions: {}
  - is_true: 0.executionId
