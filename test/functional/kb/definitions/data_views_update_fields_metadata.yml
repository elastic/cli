# Kibana data-views API: update field metadata on a data view.
---
requires:
  serverless: true
  stack: true
---
setup:
  - do:
      data-views.create_data_view_default:
        body:
          data_view: {title: "cli-ft-dv-fields-*", name: cli-ft-dv-fields}
  - set: {data_view.id: view_id}
---
teardown:
  - do:
      data-views.delete_data_view_default:
        viewId: $view_id
        ignore: [404]
---
"data views update fields metadata":
  - do:
      data-views.update_fields_metadata_default:
        viewId: $view_id
        fields:
          _id:
            customLabel: Document ID
  - is_true: data_view.id
  - match: {data_view.title: "cli-ft-dv-fields-*"}
