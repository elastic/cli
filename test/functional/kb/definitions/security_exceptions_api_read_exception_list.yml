# Kibana security-exceptions-api: create an exception list then read it.
---
requires:
  serverless: true
  stack: true
---
setup:
  - do:
      security-exceptions-api.create_exception_list:
        body:
          name: CLI FT Exception List Read
          description: Created by functional test
          type: detection
          list_id: cli-ft-sec-exc-read-list
          namespace_type: single
---
teardown:
  - do:
      security-exceptions-api.delete_exception_list:
        list_id: cli-ft-sec-exc-read-list
        namespace_type: single
        ignore: [404]
---
"security-exceptions-api read exception list":
  - do:
      security-exceptions-api.read_exception_list:
        list_id: cli-ft-sec-exc-read-list
        namespace_type: single
  - match: { list_id: cli-ft-sec-exc-read-list }
  - match: { name: CLI FT Exception List Read }
