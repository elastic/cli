# Kibana data-views API: get a data view by ID.
---
requires:
  serverless: true
  stack: true
---
setup:
  - do:
      data-views.create_data_view_default:
        body:
          data_view: { title: "cli-ft-dv-get-*", name: cli-ft-dv-get }
  - set: { data_view.id: view_id }
---
teardown:
  - do:
      data-views.delete_data_view_default:
        viewId: $view_id
        ignore: [404]
---
"data views get":
  - do:
      data-views.get_data_view_default:
        viewId: $view_id
  - is_true: data_view.id
  - match: { data_view.title: "cli-ft-dv-get-*" }
  - match: { data_view.name: cli-ft-dv-get }
