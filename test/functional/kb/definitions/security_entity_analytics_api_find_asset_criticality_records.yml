#
# Kibana security-entity-analytics-api: find asset criticality records.
# Creates a record in setup, then verifies find-asset-criticality-records returns it.
---
requires:
  serverless: true
  stack: true
  serverless_project: security
---
setup:
  - do:
      security-entity-analytics-api.create_asset_criticality_record:
        body:
          id_field: host.name
          id_value: cli-ft-find-asset-criticality-test
          criticality_level: low_impact
---
teardown:
  - do:
      security-entity-analytics-api.delete_asset_criticality_record:
        id_value: cli-ft-find-asset-criticality-test
        id_field: host.name
        ignore: [404]
---
"security-entity-analytics-api find asset criticality records":
  - do:
      security-entity-analytics-api.find_asset_criticality_records: {}
  - is_true: ""
