# Kibana agent-builder API: create conversation via converse / delete conversation by ID.
---
requires:
  serverless: true
  stack: true
---
teardown:
  - do:
      agent-builder.delete_agent_builder_conversations_conversation_id:
        conversation_id: $conv_id
        ignore: [404]
---
"agent-builder delete conversation by ID":
  - do:
      agent-builder.post_agent_builder_converse:
        body:
          input: ping
  - set: {conversation_id: conv_id}
  - is_true: conversation_id

  - do:
      agent-builder.delete_agent_builder_conversations_conversation_id:
        conversation_id: $conv_id
