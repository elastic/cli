# Kibana elastic-agent-actions API: bulk reassign agents to a different policy.
---
requires:
  serverless: true
  stack: true
---
setup:
  - do:
      elastic-agents.get_fleet_agents: {}
  - set: {"items.0.id": agent_id}
  - set: {"items.0.policy_id": original_policy_id}
  - do:
      elastic-agent-policies.post_fleet_agent_policies:
        body:
          name: cli-ft-ea-bulk-reassign
          namespace: default
  - set: {"item.id": new_policy_id}
---
teardown:
  - do:
      elastic-agent-actions.post_fleet_agents_bulk_reassign:
        body:
          agents:
            - $agent_id
          policy_id: $original_policy_id
        ignore: [404]
  - do:
      elastic-agent-policies.post_fleet_agent_policies_delete:
        body:
          agentPolicyId: $new_policy_id
        ignore: [404]
---
"elastic-agent-actions post fleet agents bulk reassign":
  - do:
      elastic-agent-actions.post_fleet_agents_bulk_reassign:
        body:
          agents:
            - $agent_id
          policy_id: $new_policy_id
  - is_true: actionId
