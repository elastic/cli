# Kibana elastic-agent-actions API: bulk rollback enrolled agents.
---
requires:
  serverless: true
  stack: true
---
setup:
  - do:
      elastic-agents.get_fleet_agents: {}
  - set: { "items.0.id": agent_id }
---
"elastic-agent-actions post fleet agents bulk rollback":
  - do:
      elastic-agent-actions.post_fleet_agents_bulk_rollback:
        body:
          agents:
            - $agent_id
  - is_true: actionId
