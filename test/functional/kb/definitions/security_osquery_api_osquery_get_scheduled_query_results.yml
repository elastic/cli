#
# Kibana security-osquery-api: get scheduled query results.
# No real scheduled query execution exists in a test environment, so a fake
# UUID is used for schedule_id and a 404 is expected.
---
requires:
  serverless: true
  stack: true
---
"security-osquery-api get scheduled query results":
  - do:
      catch: missing
      security-osquery-api.osquery_get_scheduled_query_results:
        schedule_id: "00000000-0000-0000-0000-000000000000"
        execution_count: "0"
