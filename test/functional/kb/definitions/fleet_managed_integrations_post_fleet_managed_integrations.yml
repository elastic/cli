# Kibana fleet-managed-integrations API: create a managed integration.
---
requires:
  serverless: true
  stack: true
---
setup:
  - do:
      elastic-package-manager-epm.get_fleet_epm_packages_pkgname:
        pkg_name: system
  - set: {"item.version": pkg_version}
---
teardown:
  - do:
      fleet-managed-integrations.delete_fleet_managed_integrations_policyid:
        policy_id: $policy_id
        ignore: [404]
---
"fleet-managed-integrations post fleet managed integrations":
  - do:
      fleet-managed-integrations.post_fleet_managed_integrations:
        body:
          name: cli-ft-managed-integration-create
          package:
            name: system
            version: $pkg_version
  - set: {"item.id": policy_id}
  - is_true: item.id
  - is_true: item.name
