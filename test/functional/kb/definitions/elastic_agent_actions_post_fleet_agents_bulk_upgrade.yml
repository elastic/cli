# Kibana elastic-agent-actions API: bulk upgrade enrolled agents.
---
requires:
  serverless: true
  stack: true
---
setup:
  - do:
      elastic-agents.get_fleet_agents: {}
  - set: {"items.0.id": agent_id}
---
"elastic-agent-actions post fleet agents bulk upgrade":
  - do:
      elastic-agent-actions.post_fleet_agents_bulk_upgrade:
        body:
          agents:
            - $agent_id
          version: "8.18.0"
  - is_true: actionId
