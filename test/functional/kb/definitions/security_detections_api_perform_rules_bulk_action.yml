# Kibana security-detections-api: perform a bulk edit action on a detection rule.
---
requires:
  serverless: true
  stack: true
---
setup:
  - do:
      security-detections-api.create_rule:
        body:
          type: query
          name: cli-ft-sec-det-bulk-action-rule
          description: Created by functional test
          risk_score: 21
          severity: low
          query: "*"
  - set: { id: rule_id }
---
teardown:
  - do:
      security-detections-api.delete_rule:
        id: $rule_id
        ignore: [404]
---
"security-detections-api perform rules bulk action":
  - do:
      security-detections-api.perform_rules_bulk_action:
        body:
          action: edit
          ids:
            - $rule_id
          edit:
            - type: add_tags
              value:
                - cli-ft-bulk-tag
  - is_true: attributes.results.updated
