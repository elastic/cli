# Kibana security-lists-api: get value list privileges for the current user.
# GET /api/lists/privileges — no parameters required.
# Returns a privileges object; no setup or teardown needed.
---
requires:
  serverless: true
  stack: true
---
"security-lists-api read list privileges":
  - do:
      security-lists-api.read_list_privileges: {}
  - is_true: ""
