#
# Kibana security-osquery-api: create a live query targeting all agents.
# No delete endpoint exists for live queries; no teardown required.
---
requires:
  serverless: true
  stack: true
  serverless_project: security
---
"security-osquery-api create live query":
  - do:
      security-osquery-api.osquery_create_live_query:
        body:
          query: SELECT * FROM uptime LIMIT 1
          agent_all: true
  - is_true: ""
