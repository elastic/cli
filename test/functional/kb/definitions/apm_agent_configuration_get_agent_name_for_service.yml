# Kibana apm-agent-configuration API: get agent name for a service.
---
requires:
  serverless: true
  stack: true
---
teardown:
  - do:
      apm-agent-configuration.delete_agent_configuration:
        body:
          service:
            name: cli-ft-apm-svc
        ignore: [404]
---
"apm-agent-configuration get agent name for service":
  - do:
      apm-agent-configuration.create_update_agent_configuration:
        body:
          service:
            name: cli-ft-apm-svc
          settings:
            transaction_sample_rate: "0.5"

  - do:
      apm-agent-configuration.get_agent_name_for_service:
        service_name: cli-ft-apm-svc
  - is_true: ""
