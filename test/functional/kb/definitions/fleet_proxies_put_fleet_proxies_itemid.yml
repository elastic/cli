# Kibana fleet-proxies API: update a proxy by ID.
---
requires:
  serverless: true
  stack: true
---
teardown:
  - do:
      fleet-proxies.delete_fleet_proxies_itemid:
        item_id: $proxy_id
        ignore: [404]
---
"fleet-proxies put fleet proxies by ID":
  - do:
      fleet-proxies.post_fleet_proxies:
        body:
          name: cli-ft-proxy-put
          url: "http://proxy.example.com:8080"
  - set: { "item.id": proxy_id }
  - is_true: item.id

  - do:
      fleet-proxies.put_fleet_proxies_itemid:
        item_id: $proxy_id
        body:
          name: cli-ft-proxy-put-updated
          url: "http://proxy.example.com:9090"
  - match: { item.name: cli-ft-proxy-put-updated }
  - match: { item.url: "http://proxy.example.com:9090" }
