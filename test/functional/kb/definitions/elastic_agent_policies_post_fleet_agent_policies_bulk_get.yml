# Kibana elastic-agent-policies API: bulk-get agent policies by ID.
---
requires:
  serverless: true
  stack: true
---
setup:
  - do:
      elastic-agent-policies.post_fleet_agent_policies:
        body:
          name: cli-ft-ea-policy-bulk-get
          namespace: testprefix
  - set: {"item.id": policy_id}
---
teardown:
  - do:
      elastic-agent-policies.post_fleet_agent_policies_delete:
        body:
          agentPolicyId: $policy_id
        ignore: [404]
---
"elastic-agent-policies post fleet agent policies bulk get":
  - do:
      elastic-agent-policies.post_fleet_agent_policies_bulk_get:
        body:
          ids:
            - $policy_id
  - is_true: items
