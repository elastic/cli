# Kibana elastic-agent-policies API: copy an agent policy.
---
requires:
  serverless: true
  stack: true
---
setup:
  - do:
      elastic-agent-policies.post_fleet_agent_policies:
        body:
          name: cli-ft-ea-policy-copy-source
          namespace: testprefix
  - set: { "item.id": source_policy_id }
---
teardown:
  - do:
      elastic-agent-policies.post_fleet_agent_policies_delete:
        body:
          agentPolicyId: $source_policy_id
        ignore: [404]
  - do:
      elastic-agent-policies.post_fleet_agent_policies_delete:
        body:
          agentPolicyId: $copy_policy_id
        ignore: [404]
---
"elastic-agent-policies post fleet agent policies copy":
  - do:
      elastic-agent-policies.post_fleet_agent_policies_agentpolicyid_copy:
        agent_policy_id: $source_policy_id
        body:
          name: cli-ft-ea-policy-copy-dest
  - set: { "item.id": copy_policy_id }
  - is_true: item.id
  - is_true: item.name
