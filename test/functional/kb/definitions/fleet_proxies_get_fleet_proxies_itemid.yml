# Kibana fleet-proxies API: get a proxy by ID.
---
requires:
  serverless: true
  stack: true
---
teardown:
  - do:
      fleet-proxies.delete_fleet_proxies_itemid:
        item_id: $proxy_id
        ignore: [404]
---
"fleet-proxies get fleet proxies by ID":
  - do:
      fleet-proxies.post_fleet_proxies:
        body:
          name: cli-ft-proxy-get-itemid
          url: "http://proxy.example.com:8080"
  - set: { "item.id": proxy_id }
  - is_true: item.id

  - do:
      fleet-proxies.get_fleet_proxies_itemid:
        item_id: $proxy_id
  - is_true: item.id
  - is_true: item.name
