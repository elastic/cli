# Kibana elastic-package-manager-epm API: delete data stream assets for a package version.
---
requires:
  serverless: true
  stack: true
---
setup:
  - do:
      elastic-package-manager-epm.get_fleet_epm_packages_pkgname:
        pkg_name: apache
  - set: { "item.version": pkg_version }
  - do:
      elastic-package-manager-epm.post_fleet_epm_packages_pkgname_pkgversion:
        pkg_name: apache
        pkg_version: $pkg_version
  - do:
      elastic-agent-policies.post_fleet_agent_policies:
        body:
          name: cli-ft-epm-ds-assets-policy
          namespace: testprefix
  - set: { "item.id": agent_policy_id }
  - do:
      fleet-package-policies.post_fleet_package_policies:
        body:
          name: cli-ft-epm-ds-assets-pkg-policy
          policy_ids:
            - $agent_policy_id
          package:
            name: apache
            version: $pkg_version
  - set: { "item.id": package_policy_id }
---
teardown:
  - do:
      fleet-package-policies.delete_fleet_package_policies_packagepolicyid:
        package_policy_id: $package_policy_id
        ignore: [404]
  - do:
      elastic-agent-policies.post_fleet_agent_policies_delete:
        body:
          agentPolicyId: $agent_policy_id
        ignore: [404]
  - do:
      elastic-package-manager-epm.delete_fleet_epm_packages_pkgname_pkgversion:
        pkg_name: apache
        pkg_version: $pkg_version
        ignore: [404]
---
"elastic-package-manager-epm delete fleet epm packages pkgname pkgversion datastream assets":
  - do:
      elastic-package-manager-epm.delete_fleet_epm_packages_pkgname_pkgversion_datastream_assets:
        pkg_name: apache
        pkg_version: $pkg_version
        package_policy_id: $package_policy_id
  - is_true: ""
