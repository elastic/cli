# Kibana fleet-outputs API: get health for a fleet output.
---
requires:
  serverless: true
  stack: true
---
setup:
  - do:
      fleet-outputs.post_fleet_outputs:
        body:
          name: cli-ft-fleet-output-health
          type: kafka
          auth_type: none
          hosts:
            - "kafka:9092"
  - set: {"item.id": output_id}
---
teardown:
  - do:
      fleet-outputs.delete_fleet_outputs_outputid:
        output_id: $output_id
        ignore: [404]
---
"fleet-outputs get fleet outputs outputid health":
  - do:
      fleet-outputs.get_fleet_outputs_outputid_health:
        output_id: $output_id
  - is_true: state
