# Kibana fleet-package-policies API: dry run a package policy upgrade.
---
requires:
  serverless: true
  stack: true
---
"fleet-package-policies post fleet package policies upgrade dryrun":
  - do:
      fleet-package-policies.post_fleet_package_policies_upgrade_dryrun:
        body:
          packagePolicyIds: []
  - is_true: ""
