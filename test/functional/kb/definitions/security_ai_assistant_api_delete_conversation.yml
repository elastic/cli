#
# Kibana security-ai-assistant-api: delete conversation.
# Creates a conversation in setup, then verifies delete-conversation removes it.
# Teardown cleans up in case the delete step fails.
---
requires:
  serverless: true
  stack: true
---
setup:
  - do:
      security-ai-assistant-api.create_conversation:
        body:
          title: CLI FT delete-conversation test
  - set: { id: conv_id }
---
teardown:
  - do:
      security-ai-assistant-api.delete_conversation:
        id: $conv_id
        ignore: [404]
---
"security-ai-assistant-api delete conversation":
  - do:
      security-ai-assistant-api.delete_conversation:
        id: $conv_id
  - do:
      catch: missing
      security-ai-assistant-api.read_conversation:
        id: $conv_id
