# Kibana elastic-agent-policies API: create an agent policy.
---
requires:
  serverless: true
  stack: true
---
teardown:
  - do:
      elastic-agent-policies.post_fleet_agent_policies_delete:
        body:
          agentPolicyId: $policy_id
        ignore: [404]
---
"elastic-agent-policies post fleet agent policies":
  - do:
      elastic-agent-policies.post_fleet_agent_policies:
        body:
          name: cli-ft-ea-policy-create
          namespace: testprefix
  - set: {"item.id": policy_id}
  - is_true: item.id
  - is_true: item.name
