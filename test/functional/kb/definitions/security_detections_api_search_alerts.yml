#
# Kibana security-detections-api: search detection alerts (no body, all fields optional).
# An empty POST returns successfully with a hits envelope; no setup or teardown required.
---
requires:
  serverless: true
  stack: true
  serverless_project: security
---
"security-detections-api search alerts":
  - do:
      security-detections-api.search_alerts: {}
  - is_true: ""
