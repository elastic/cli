# Kibana alerting API: create a rule then delete it by ID.
---
requires:
  serverless: true
  stack: true
---
teardown:
  - do:
      alerting.delete_alerting_rule_id:
        id: cli-ft-rule-delete
        ignore: [404]
---
"alerting delete rule by ID":
  - do:
      alerting.post_alerting_rule_id:
        id: cli-ft-rule-delete
        body:
          consumer: stackAlerts
          name: CLI FT Rule Delete
          rule_type_id: ".es-query"
          schedule: {interval: "1m"}
          params:
            searchType: esqlQuery
            esqlQuery: {esql: "FROM * | LIMIT 1"}
            timeWindowSize: 5
            timeWindowUnit: m
            threshold: [0]
            thresholdComparator: ">"
            size: 0
            timeField: "@timestamp"
  - match: {id: cli-ft-rule-delete}

  - do:
      alerting.delete_alerting_rule_id:
        id: cli-ft-rule-delete
