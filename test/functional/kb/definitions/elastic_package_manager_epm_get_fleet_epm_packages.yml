# Kibana elastic-package-manager-epm API: list EPM packages.
---
requires:
  serverless: true
  stack: true
---
"elastic-package-manager-epm get fleet epm packages":
  - do:
      elastic-package-manager-epm.get_fleet_epm_packages: {}
  - is_true: items
