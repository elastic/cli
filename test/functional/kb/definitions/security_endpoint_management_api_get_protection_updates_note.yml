#
# Kibana security-endpoint-management-api: get protection updates note for a package policy.
# No real package policy exists in a test environment, so a fake UUID is used and a
# 404 is expected.
---
requires:
  serverless: true
  stack: true
---
"security-endpoint-management-api get protection updates note":
  - do:
      catch: missing
      security-endpoint-management-api.get_protection_updates_note:
        package_policy_id: "00000000-0000-0000-0000-000000000000"
