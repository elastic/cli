# Kibana agent-builder API: create agent / delete agent.
---
requires:
  serverless: true
  stack: true
  # Agent Builder APIs 404 on 9.2 (not enabled by default).
  stack_since: 9.3.0
---
teardown:
  - do:
      agent-builder.delete_agent_builder_agents_id:
        id: cli-ft-ab-delete
        ignore: [404]
---
"agent-builder delete agent":
  - do:
      agent-builder.post_agent_builder_agents:
        body:
          id: cli-ft-ab-delete
          name: CLI FT Agent Delete
          description: Created by functional test
          configuration:
            tools: []
  - match: {id: cli-ft-ab-delete}

  - do:
      agent-builder.delete_agent_builder_agents_id:
        id: cli-ft-ab-delete
