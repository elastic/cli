# Kibana elastic-agent-policies API: get a single Fleet agent policy by ID.
---
requires:
  serverless: true
  stack: true
---
setup:
  - do:
      elastic-agent-policies.post_fleet_agent_policies:
        body:
          name: cli-ft-ea-policy-get-by-id
          namespace: testprefix
  - set: {"item.id": policy_id}
---
teardown:
  - do:
      elastic-agent-policies.post_fleet_agent_policies_delete:
        body:
          agentPolicyId: $policy_id
        ignore: [404]
---
"elastic-agent-policies get fleet agent policy by id":
  - do:
      elastic-agent-policies.get_fleet_agent_policies_agentpolicyid:
        agent_policy_id: $policy_id
  - is_true: item.id
  - is_true: item.name
