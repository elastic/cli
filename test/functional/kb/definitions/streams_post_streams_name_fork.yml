# Kibana streams API: fork a stream into a child stream.
---
requires:
  serverless: true
  stack: true
---
setup:
  - do:
      streams.put_streams_name:
        name: cli-ft-streams-fork-parent
        body:
          dashboards: []
          rules: []
          stream:
            description: ""
            type: wired
            ingest:
              lifecycle: { inherit: {} }
              processing:
                steps: []
              settings: {}
              failure_store: { inherit: {} }
              wired:
                fields: {}
                routing: []
---
teardown:
  - do:
      streams.delete_streams_name:
        name: cli-ft-streams-fork-parent.child
        ignore: [404]
  - do:
      streams.delete_streams_name:
        name: cli-ft-streams-fork-parent
        ignore: [404]
---
"streams post streams name fork":
  - do:
      streams.post_streams_name_fork:
        name: cli-ft-streams-fork-parent
        body:
          stream:
            name: cli-ft-streams-fork-parent.child
          where:
            always: {}
  - is_true: ""
