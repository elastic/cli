# Kibana streams API: fork a stream into a child stream.
---
requires:
  serverless: true
  stack: true
  # Wired-stream body (logs.otel root, failure_store) is 9.5+; older stacks 400.
  stack_since: 9.5.0
---
setup:
  - do:
      streams.put_streams_name:
        name: logs.otel.cli-ft-streams-fork-parent
        body:
          dashboards: []
          rules: []
          stream:
            description: ""
            type: wired
            ingest:
              lifecycle: {inherit: {}}
              processing:
                steps: []
              settings: {}
              failure_store: {inherit: {}}
              wired:
                fields: {}
                routing: []
---
teardown:
  - do:
      streams.delete_streams_name:
        name: logs.otel.cli-ft-streams-fork-parent.child
        ignore: [404]
  - do:
      streams.delete_streams_name:
        name: logs.otel.cli-ft-streams-fork-parent
        ignore: [404]
---
"streams post streams name fork":
  - do:
      streams.post_streams_name_fork:
        name: logs.otel.cli-ft-streams-fork-parent
        body:
          stream:
            name: logs.otel.cli-ft-streams-fork-parent.child
          where:
            always: {}
  - is_true: ""
