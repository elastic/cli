# Kibana elastic-agent-actions API: unenroll an enrolled agent.
---
requires:
  serverless: true
  stack: true
---
setup:
  - do:
      elastic-agents.get_fleet_agents: {}
  - set: { "items.0.id": agent_id }
---
"elastic-agent-actions post fleet agents agentid unenroll":
  - do:
      elastic-agent-actions.post_fleet_agents_agentid_unenroll:
        agent_id: $agent_id
