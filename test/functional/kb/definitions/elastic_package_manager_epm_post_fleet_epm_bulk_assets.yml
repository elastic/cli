# Kibana elastic-package-manager-epm API: bulk get assets.
---
requires:
  serverless: true
  stack: true
---
"elastic-package-manager-epm post fleet epm bulk assets":
  - do:
      elastic-package-manager-epm.post_fleet_epm_bulk_assets:
        body:
          assetIds: []
  - is_true: items
