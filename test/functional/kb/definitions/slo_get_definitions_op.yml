# Kibana SLO API: create an SLO then retrieve definitions in the default space.
---
requires:
  serverless: true
  stack: true
---
setup:
  - do:
      slo.create_slo_op:
        space_id: default
        body:
          id: cli-ft-get-definitions
          name: CLI FT Get Definitions SLO
          description: Created by functional test
          indicator:
            type: sli.kql.custom
            params:
              index: "*"
              timestampField: "@timestamp"
              good: ""
              total: ""
          timeWindow:
            duration: 7d
            type: rolling
          budgetingMethod: occurrences
          objective:
            target: 0.99
---
teardown:
  - do:
      slo.delete_slo_op:
        space_id: default
        slo_id: cli-ft-get-definitions
        ignore: [404]
---
"slo get-definitions-op":
  - do:
      slo.get_definitions_op:
        space_id: default
  - is_true: results
