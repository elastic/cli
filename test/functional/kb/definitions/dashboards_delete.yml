# Kibana dashboards API: delete a dashboard by id.
---
requires:
  serverless: false
  stack: false
---
teardown:
  - do:
      dashboards.delete_dashboard:
        id: cli-ft-dashboard-delete
        ignore: [404]
---
"dashboards delete":
  - do:
      dashboards.upsert_dashboard:
        id: cli-ft-dashboard-delete

  - do:
      dashboards.delete_dashboard:
        id: cli-ft-dashboard-delete
