# Kibana elastic-package-manager-epm API: get package dependencies for a specific version.
---
requires:
  serverless: true
  stack: true
---
"elastic-package-manager-epm get fleet epm packages pkgname pkgversion dependencies":
  - do:
      elastic-package-manager-epm.get_fleet_epm_packages_pkgname:
        pkg_name: system
  - set: {"item.version": pkg_version}

  - do:
      elastic-package-manager-epm.get_fleet_epm_packages_pkgname_pkgversion_dependencies:
        pkg_name: system
        pkg_version: $pkg_version
  - is_true: items
