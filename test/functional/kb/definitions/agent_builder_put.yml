# Kibana agent-builder API: create agent / update agent / delete agent.
---
requires:
  serverless: true
  stack: true
---
teardown:
  - do:
      agent-builder.delete_agent_builder_agents_id:
        id: cli-ft-ab-put
        ignore: [404]
---
"agent-builder update agent":
  - do:
      agent-builder.post_agent_builder_agents:
        body:
          id: cli-ft-ab-put
          name: CLI FT Agent Put
          description: Created by functional test
          configuration:
            tools: []
  - match: {id: cli-ft-ab-put}

  - do:
      agent-builder.put_agent_builder_agents_id:
        id: cli-ft-ab-put
        body:
          name: CLI FT Agent Put Updated
          description: Updated by functional test
  - match: {id: cli-ft-ab-put}
  - match: {name: CLI FT Agent Put Updated}
  - match: {description: Updated by functional test}

  - do:
      agent-builder.delete_agent_builder_agents_id:
        id: cli-ft-ab-put
