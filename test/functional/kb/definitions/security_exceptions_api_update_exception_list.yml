# Kibana security-exceptions-api: create an exception list then update it.
---
requires:
  serverless: true
  stack: true
---
setup:
  - do:
      security-exceptions-api.create_exception_list:
        body:
          name: CLI FT Exception List Update
          description: Created by functional test
          type: detection
          list_id: cli-ft-sec-exc-update-list
          namespace_type: single
---
teardown:
  - do:
      security-exceptions-api.delete_exception_list:
        list_id: cli-ft-sec-exc-update-list
        namespace_type: single
        ignore: [404]
---
"security-exceptions-api update exception list":
  - do:
      security-exceptions-api.update_exception_list:
        body:
          name: CLI FT Exception List Updated
          description: Updated by functional test
          type: detection
          list_id: cli-ft-sec-exc-update-list
          namespace_type: single
  - match: { list_id: cli-ft-sec-exc-update-list }
  - match: { name: CLI FT Exception List Updated }
  - match: { description: Updated by functional test }
