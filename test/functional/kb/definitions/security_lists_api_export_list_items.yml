# Kibana security-lists-api: create a value list with one item, then export the items.
---
requires:
  serverless: true
  stack: true
---
setup:
  - do:
      security-lists-api.create_list_index:
  - do:
      security-lists-api.create_list:
        body:
          id: cli-ft-sec-lists-export-items-list
          name: CLI FT Export List Items List
          description: Created by functional test
          type: keyword
  - do:
      security-lists-api.create_list_item:
        body:
          list_id: cli-ft-sec-lists-export-items-list
          value: "192.0.2.1"
---
teardown:
  - do:
      security-lists-api.delete_list:
        id: cli-ft-sec-lists-export-items-list
        ignore: [404]
---
"security-lists-api export list items":
  - do:
      security-lists-api.export_list_items:
        list_id: cli-ft-sec-lists-export-items-list
  - is_true: 0.list_id
  - match: {0.list_id: cli-ft-sec-lists-export-items-list}
  - match: {0.value: "192.0.2.1"}
