# Kibana data-views API: create / get / list / delete.
---
requires:
  serverless: true
  stack: true
---
teardown:
  - do:
      data-views.delete_data_view_default:
        viewId: $view_id
        ignore: [404]
---
"data view CRUD":
  - do:
      data-views.create_data_view_default:
        body:
          data_view: { title: "cli-ft-dv-*", name: cli-ft-dv }
  - set: { data_view.id: view_id }
  - is_true: data_view.id
  - match: { data_view.name: cli-ft-dv }
  - match: { data_view.title: "cli-ft-dv-*" }

  - do:
      data-views.get_data_view_default:
        viewId: $view_id
  - match: { data_view.name: cli-ft-dv }

  - do:
      data-views.get_all_data_views_default: {}
  - is_true: data_view.0.id

  - do:
      data-views.delete_data_view_default:
        viewId: $view_id
