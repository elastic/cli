# Kibana significantevents API: upsert a query on a stream.
---
requires:
  serverless: true
  stack: true
  serverless_project: observability
---
setup:
  - do:
      streams.put_streams_name:
        name: logs.otel.cli-ft-se-put
        body:
          dashboards: []
          rules: []
          stream:
            description: ""
            type: wired
            ingest:
              lifecycle: {inherit: {}}
              processing:
                steps: []
              settings: {}
              failure_store: {inherit: {}}
              wired:
                fields: {}
                routing: []
---
teardown:
  - do:
      significantevents.delete_streams_name_queries_queryid:
        name: logs.otel.cli-ft-se-put
        query_id: cli-ft-se-put-query
        ignore: [404]
  - do:
      streams.delete_streams_name:
        name: logs.otel.cli-ft-se-put
        ignore: [404]
---
"significantevents put streams name queries queryid":
  - do:
      significantevents.put_streams_name_queries_queryid:
        name: logs.otel.cli-ft-se-put
        query_id: cli-ft-se-put-query
        body:
          title: CLI FT Put Query Test
          esql:
            query: "FROM logs.otel.cli-ft-se-put | LIMIT 10"
  - is_true: ""
