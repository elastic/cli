# Kibana dashboards API: get a dashboard by id.
---
requires:
  serverless: false
  stack: false
---
teardown:
  - do:
      dashboards.delete_dashboard:
        id: cli-ft-dashboard-get
        ignore: [404]
---
"dashboards get":
  - do:
      dashboards.upsert_dashboard:
        id: cli-ft-dashboard-get

  - do:
      dashboards.get_dashboard:
        id: cli-ft-dashboard-get
  - is_true: item.id

  - do:
      dashboards.delete_dashboard:
        id: cli-ft-dashboard-get
