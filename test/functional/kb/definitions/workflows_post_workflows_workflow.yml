# Kibana workflows API: create a single workflow.
---
requires:
  serverless: true
---
teardown:
  - do:
      workflows.delete_workflows_workflow_id:
        id: cli-ft-workflow-create
        force: true
        ignore: [404]
---
"workflows post workflows workflow":
  - do:
      workflows.post_workflows_workflow:
        body:
          id: cli-ft-workflow-create
          yaml: |
            version: '1'
            name: CLI FT Workflow Create
            triggers:
              - type: manual
            steps: []

  - is_true: id
