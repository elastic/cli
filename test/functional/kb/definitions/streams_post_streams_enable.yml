# Kibana streams API: enable streams.
---
requires:
  serverless: true
  stack: true
---
setup:
  - do:
      streams.post_streams_disable: {}
---
teardown:
  - do:
      streams.post_streams_disable: {}
---
"streams post streams enable":
  - do:
      streams.post_streams_enable: {}
  - is_true: acknowledged
