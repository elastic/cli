# Kibana fleet-uninstall-tokens API: get a decrypted uninstall token by ID.
---
requires:
  serverless: true
  stack: true
---
setup:
  - do:
      elastic-agent-policies.post_fleet_agent_policies:
        body:
          name: cli-ft-fleet-uninstall-token-get-id
          namespace: testprefix
  - set: { "item.id": policy_id }
  - do:
      fleet-uninstall-tokens.get_fleet_uninstall_tokens:
        policy_id: $policy_id
  - set: { "items.0.id": token_id }
---
teardown:
  - do:
      elastic-agent-policies.post_fleet_agent_policies_delete:
        body:
          agentPolicyId: $policy_id
        ignore: [404]
---
"fleet-uninstall-tokens get fleet uninstall tokens uninstalltokenid":
  - do:
      fleet-uninstall-tokens.get_fleet_uninstall_tokens_uninstalltokenid:
        uninstall_token_id: $token_id
  - is_true: item.id
  - is_true: item.token
