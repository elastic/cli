# Kibana alerting API: create a rule then update it by ID.
---
requires:
  serverless: true
  stack: true
---
teardown:
  - do:
      alerting.delete_alerting_rule_id:
        id: cli-ft-rule-put
        ignore: [404]
---
"alerting update rule by ID":
  - do:
      alerting.post_alerting_rule_id:
        id: cli-ft-rule-put
        body:
          consumer: stackAlerts
          name: CLI FT Rule Put
          rule_type_id: ".es-query"
          schedule: { interval: "1m" }
          params:
            searchType: esqlQuery
            esqlQuery: { esql: "FROM * | LIMIT 1" }
            timeWindowSize: 5
            timeWindowUnit: m
            threshold: [0]
            thresholdComparator: ">"
            size: 0
            timeField: "@timestamp"
  - match: { id: cli-ft-rule-put }

  - do:
      alerting.put_alerting_rule_id:
        id: cli-ft-rule-put
        name: CLI FT Rule Put Updated
        schedule: { interval: "5m" }
        # es-query rule type revalidates params on update; the full params body must be resent
        params:
          searchType: esqlQuery
          esqlQuery: { esql: "FROM * | LIMIT 1" }
          timeWindowSize: 5
          timeWindowUnit: m
          threshold: [0]
          thresholdComparator: ">"
          size: 0
          timeField: "@timestamp"
  - match: { id: cli-ft-rule-put }
  - match: { name: CLI FT Rule Put Updated }
  - match: { schedule: { interval: "5m" } }
  - is_true: enabled

  - do:
      alerting.delete_alerting_rule_id:
        id: cli-ft-rule-put
