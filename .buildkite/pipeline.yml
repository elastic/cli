# Functional test pipeline for the Elastic CLI.
#
# Runs ES functional tests (Docker Elasticsearch + codegen'd bash scripts)
# and Cloud functional tests (against the QA Cloud API).
#
# Vault paths must be registered before Cloud tests work:
#   secret/ci/elastic-cli/cloud-access
#
# Need to register this pipeline by contacting Platform team.

env:
  CLOUD_CREDENTIALS_PATH: "secret/ci/elastic-cli/cloud-access"
  NODE_VERSION: "22"

steps:
  - label: "Skill memory PR"
    if: build.branch == "ai/review-memory"
    command: echo "skip functional tests on ai/review-memory"

  - group: "ES Functional Tests"
    if: build.branch != "ai/review-memory"
    steps:
      - label: ":elasticsearch: ES functional tests — ES {{matrix.stack_version}}"
        key: "es-functional"
        matrix:
          setup:
            stack_version:
              - "9.5.3"
        agents:
          provider: gcp
          image: family/core-ubuntu-2204
        env:
          NODE_VERSION: 26
          STACK_VERSION: "{{ matrix.stack_version }}"
        command: ".buildkite/run-es-tests.sh"

  - group: "KB Functional Tests"
    if: build.branch != "ai/review-memory"
    steps:
      - label: ":kibana: KB functional tests — Kibana {{matrix.stack_version}}"
        key: "kb-functional"
        matrix:
          setup:
            stack_version:
              - "9.5.3"
        agents:
          provider: gcp
          image: family/kibana-ubuntu-2404
          machineType: n2-standard-4
          diskSizeGb: 130
        env:
          NODE_VERSION: 26
          STACK_VERSION: "{{matrix.stack_version}}"
        command: ".buildkite/run-kb-tests.sh"

  - group: "Cloud Functional Tests"
    if: build.branch != "ai/review-memory"
    steps:
      - label: ":cloud: Cloud functional tests"
        key: "cloud-functional"
        agents:
          provider: gcp
          image: family/core-ubuntu-2204
        env:
          NODE_VERSION: 26
        command: ".buildkite/run-cloud-tests.sh"
        artifact_paths:
          - "test/functional/cloud/*.log"

  - wait: ~
    continue_on_failure: true
    if: build.branch != "ai/review-memory"

  - label: "First failure summary"
    key: first-failure
    soft_fail: true
    if: build.branch != "ai/review-memory"
    agents:
      provider: gcp
      image: family/core-ubuntu-2204
    command: ".buildkite/print-first-failure.sh"
