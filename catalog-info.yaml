---
# yaml-language-server: $schema=https://json.schemastore.org/catalog-info.json
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: elastic-cli
spec:
  type: library
  owner: group:devtools-team
  lifecycle: production

---
# yaml-language-server: $schema=https://gist.githubusercontent.com/elasticmachine/988b80dae436cafea07d9a4a460a011d/raw/e57ee3bed7a6f73077a3f55a38e76e40ec87a7cf/rre.schema.json
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: buildkite-pipeline-elastic-cli
  description: Buildkite Pipeline for elastic-cli
  links:
    - title: Pipeline
      url: https://buildkite.com/elastic/elastic-cli
spec:
  type: buildkite-pipeline
  owner: group:devtools-team
  system: buildkite
  implementation:
    apiVersion: buildkite.elastic.dev/v1
    kind: Pipeline
    metadata:
      description: Elastic CLI
      name: elastic-cli
    spec:
      repository: elastic/cli
      pipeline_file: ".buildkite/pipeline.yml"
      teams:
        devtools-team:
          access_level: MANAGE_BUILD_AND_READ
        everyone:
          access_level: READ_ONLY
      provider_settings:
        build_pull_requests: true
        build_branches: false
        separate_pull_request_statuses: true
      cancel_intermediate_builds: true

---
# yaml-language-server: $schema=https://json.schemastore.org/catalog-info.json
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: buildkite-pipeline-elastic-cli-release
  description: Buildkite pipeline that signs elastic cli macOS and Windows release binaries.
  links:
    - title: Pipeline
      url: https://buildkite.com/elastic/elastic-cli-release
spec:
  type: buildkite-pipeline
  owner: group:devtools-team
  system: buildkite
  implementation:
    apiVersion: buildkite.elastic.dev/v1
    kind: Pipeline
    metadata:
      name: elastic-cli-release
      description: Signs elastic cli macOS and Windows release binaries.
    spec:
      repository: elastic/cli
      pipeline_file: ".buildkite/release.yml"
      provider_settings:
        build_branches: true
        build_pull_requests: false
        build_tags: true
        filter_enabled: true
        filter_condition: |
          build.branch =~ /^ci\// || build.tag =~ /^v/
      cancel_intermediate_builds: false
      skip_intermediate_builds: false
      teams:
        devtools-team:
          access_level: MANAGE_BUILD_AND_READ
        everyone:
          access_level: READ_ONLY
