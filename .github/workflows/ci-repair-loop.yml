name: CI repair loop

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: Failed CI run id
        required: true

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: ci-repair-loop-${{ github.event.workflow_run.head_sha || github.event.inputs.run_id }}
  cancel-in-progress: true

jobs:
  repair:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'failure' &&
       github.event.workflow_run.path == '.github/workflows/ci.yml' &&
       (github.event.workflow_run.event == 'pull_request' ||
        github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: write
    outputs:
      apply: ${{ steps.propose.outputs.apply }}
      pr: ${{ steps.diag.outputs.pr }}
      head_sha: ${{ steps.diag.outputs.head_sha }}
    steps:
      - name: Checkout default branch tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Copy repair-loop script
        run: |
          set -euo pipefail
          if [ -f scripts/repair-loop.mjs ]; then
            cp scripts/repair-loop.mjs /tmp/repair-loop.mjs
            exit 0
          fi
          echo "scripts/repair-loop.mjs missing on default branch"
          exit 0

      - name: Diagnose first failure
        id: diag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_ID: ${{ github.event.inputs.run_id || github.event.workflow_run.id }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail
          {
            echo "pr="
            echo "head_sha="
            echo "job_name="
            echo "job_url="
            echo "run_url="
            echo "fix=0"
            echo "triage=0"
            echo "pin_stop=0"
          } >> "$GITHUB_OUTPUT"
          if [ ! -s /tmp/repair-loop.mjs ]; then
            echo "repair-loop.mjs unavailable"
            exit 0
          fi
          if [ -z "${RUN_ID:-}" ]; then
            echo "No run id"
            exit 0
          fi
          if [ "${EVENT_NAME}" = workflow_dispatch ]; then
            RUN_JSON=$(gh api "repos/${GH_REPO}/actions/runs/${RUN_ID}")
            PATH_NAME=$(printf '%s' "$RUN_JSON" | jq -r '.path // empty')
            CONCLUSION=$(printf '%s' "$RUN_JSON" | jq -r '.conclusion // empty')
            EVENT=$(printf '%s' "$RUN_JSON" | jq -r '.event // empty')
            if [ "$PATH_NAME" != '.github/workflows/ci.yml' ] || [ "$CONCLUSION" != failure ]; then
              echo "Dispatch run is not a failed CI workflow"
              exit 0
            fi
            if [ "$EVENT" != pull_request ] && [ "$EVENT" != push ]; then
              echo "Dispatch run event is ${EVENT}"
              exit 0
            fi
            HEAD_SHA=$(printf '%s' "$RUN_JSON" | jq -r '.head_sha // empty')
            HEAD_REPO=$(printf '%s' "$RUN_JSON" | jq -r '.head_repository.full_name // empty')
            RUN_URL=$(printf '%s' "$RUN_JSON" | jq -r '.html_url // empty')
          fi
          gh api "repos/${GH_REPO}/actions/runs/${RUN_ID}/jobs" \
            --jq '{jobs: (.jobs // [])}' > /tmp/jobs.json
          if ! node /tmp/repair-loop.mjs first-failure /tmp/jobs.json > /tmp/job.json; then
            echo "No failed job in run ${RUN_ID}"
            echo "pr=" >> "$GITHUB_OUTPUT"
            echo "fix=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          JOB_ID=$(jq -r '.id' /tmp/job.json)
          JOB_NAME=$(jq -r '.name // "unknown"' /tmp/job.json)
          JOB_URL=$(jq -r '.html_url // ""' /tmp/job.json)
          : > /tmp/job.log
          # gh api drops logs that contain ANSI (##[group]). fetch keeps them.
          for _ in 1 2 3; do
            if node /tmp/repair-loop.mjs fetch-job-log "$JOB_ID" /tmp/job.log && [ -s /tmp/job.log ]; then
              break
            fi
            sleep 2
          done
          node /tmp/repair-loop.mjs gha-excerpt /tmp/job.log /tmp/excerpt.txt
          node /tmp/repair-loop.mjs gha-context /tmp/job.log /tmp/context.txt
          node /tmp/repair-loop.mjs cited-paths /tmp/context.txt > /tmp/cited.json
          PR=$(gh api -H "Accept: application/vnd.github+json" \
            "repos/${GH_REPO}/commits/${HEAD_SHA}/pulls" \
            --jq "[.[]? | select(.state == \"open\" and .head.sha == \"${HEAD_SHA}\") | .number][0] // empty")
          SAME_REPO=0
          if [ "$HEAD_REPO" = "$GH_REPO" ]; then SAME_REPO=1; fi
          SKIP_LOOP=0
          STOP_REPAIR=0
          AUTO_LOOP=0
          BOT_COMMITS=0
          if [ -n "$PR" ]; then
            LABELS=$(gh pr view "$PR" --json labels --jq '[.labels[].name] | join(",")')
            case ",$LABELS," in *,skip-auto-loop,*) SKIP_LOOP=1 ;; esac
            case ",$LABELS," in *,auto-loop,*) AUTO_LOOP=1 ;; esac
            gh api --paginate "repos/${GH_REPO}/issues/${PR}/comments" \
              --jq '.[] | select(.author_association == "OWNER" or .author_association == "MEMBER") | .body // empty' > /tmp/pr-comments.txt || true
            if node /tmp/repair-loop.mjs has-stop /tmp/pr-comments.txt; then STOP_REPAIR=1; fi
            gh api --paginate "repos/${GH_REPO}/pulls/${PR}/commits" \
              --jq '.[] | {author:{login:(.author.login // "")},commit:{author:{name:(.commit.author.name // "")}}}' \
              > /tmp/commits.ndjson || true
            BOT_COMMITS=$(node /tmp/repair-loop.mjs bot-commits /tmp/commits.ndjson)
          fi
          SAME_REPO="$SAME_REPO" SKIP_LOOP="$SKIP_LOOP" STOP_REPAIR="$STOP_REPAIR" AUTO_LOOP="$AUTO_LOOP" BOT_COMMITS="$BOT_COMMITS" \
            node /tmp/repair-loop.mjs should-fix > /tmp/decision.json || true
          FIX=0
          PIN_STOP=0
          if jq -e '.ok == true' /tmp/decision.json >/dev/null; then FIX=1; fi
          if [ ! -s /tmp/job.log ]; then
            echo "Job log empty"
            FIX=0
          fi
          TRIAGE=0
          if [ -n "$PR" ] && [ "$SAME_REPO" = 1 ] && [ "$STOP_REPAIR" != 1 ] && [ "$SKIP_LOOP" != 1 ] && [ -s /tmp/job.log ]; then
            TRIAGE=1
          fi
          if [ "$STOP_REPAIR" = 1 ] && [ "$SKIP_LOOP" = 0 ]; then PIN_STOP=1; fi
          {
            echo "pr=${PR}"
            echo "head_sha=${HEAD_SHA}"
            echo "job_id=${JOB_ID}"
            echo "job_name=${JOB_NAME}"
            echo "job_url=${JOB_URL}"
            echo "run_url=${RUN_URL}"
            echo "fix=${FIX}"
            echo "triage=${TRIAGE}"
            echo "pin_stop=${PIN_STOP}"
          } >> "$GITHUB_OUTPUT"

      - name: Comment diagnosis
        if: steps.diag.outputs.job_name != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ steps.diag.outputs.pr }}
          JOB_NAME: ${{ steps.diag.outputs.job_name }}
          JOB_URL: ${{ steps.diag.outputs.job_url }}
          RUN_URL: ${{ steps.diag.outputs.run_url }}
          PIN_STOP: ${{ steps.diag.outputs.pin_stop }}
        run: |
          set -euo pipefail
          COMMENT_TAG='<!-- ci-repair-loop -->'
          EXCERPT=$(cat /tmp/excerpt.txt 2>/dev/null || true)
          BODY=$(printf '%s\n' \
            "$COMMENT_TAG" \
            "**${JOB_NAME}** failed." \
            "" \
            "$EXCERPT" \
            "" \
            "Job: ${JOB_URL}")
          if [ -n "$PR" ]; then
            EXISTING=$(gh api --paginate "repos/${GH_REPO}/issues/${PR}/comments" \
              --jq ".[] | select((.user.login == \"github-actions[bot]\") and (.body | startswith(\"${COMMENT_TAG}\"))) | .id" \
              | head -n 1 || true)
            if [ -n "$EXISTING" ]; then
              gh api -X PATCH "repos/${GH_REPO}/issues/comments/${EXISTING}" -f body="$BODY"
            else
              gh pr comment "$PR" --body "$BODY"
            fi
          else
            EXISTING=$(gh issue list --search "CI failed on main in:title" --state open \
              --json number --jq '.[0].number // empty')
            if [ -n "$EXISTING" ]; then
              gh issue comment "$EXISTING" --body "$BODY"
            else
              gh issue create \
                --title "CI failed on main: ${JOB_NAME}" \
                --body "$BODY"
            fi
          fi
          if [ "${PIN_STOP:-0}" = "1" ] && [ -n "$PR" ]; then
            gh pr edit "$PR" --add-label skip-auto-loop || true
            gh pr comment "$PR" --body "Repair loop stopped (\`/stop\`). Added \`skip-auto-loop\`."
          fi

      - name: Propose in-repo fix
        id: propose
        if: steps.diag.outputs.triage == '1' && steps.diag.outputs.pr != ''
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_BASE_URL: ${{ secrets.OPENROUTER_BASE_URL }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ steps.diag.outputs.pr }}
          JOB_NAME: ${{ steps.diag.outputs.job_name }}
          JOB_URL: ${{ steps.diag.outputs.job_url }}
          HEAD_SHA: ${{ steps.diag.outputs.head_sha }}
          CAN_FIX: ${{ steps.diag.outputs.fix }}
        run: |
          set -euo pipefail
          echo "apply=0" >> "$GITHUB_OUTPUT"
          if [ -z "${OPENROUTER_API_KEY:-}" ]; then
            echo "OPENROUTER_API_KEY missing"
            exit 0
          fi
          BASE_URL="${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}"
          case "$BASE_URL" in
            https://*) ;;
            *)
              echo "OPENROUTER_BASE_URL must be https://, refusing to send the API key to it"
              exit 0
              ;;
          esac
          CONTEXT=$(cat /tmp/context.txt 2>/dev/null || true)
          PR_FILES=$(gh api --paginate "repos/${GH_REPO}/pulls/${PR}/files" --jq '.[] | .filename' | head -n 80 || true)
          PATHS=$(jq -r '.[]' /tmp/cited.json)
          if [ -z "$PATHS" ]; then
            PATHS=$(printf '%s\n' "$PR_FILES" | grep -E '^(src/|test/|packages/)' | grep -vE 'src/es/apis/|src/kb/apis|api-manifest' | head -n 6 || true)
          fi
          FILES=""
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            CONTENT=$(gh api "repos/${GH_REPO}/contents/${path}?ref=${HEAD_SHA}" \
              --jq '.content // empty' | tr -d '\n' | base64 -d 2>/dev/null || true)
            [ -n "$CONTENT" ] || continue
            BYTES=$(printf '%s' "$CONTENT" | wc -c | tr -d ' ')
            if [ "$BYTES" -gt 12000 ]; then
              FILES="${FILES}
          === ${path} ===
          OMITTED (${BYTES} bytes). Do not replace this file.
          "
              continue
            fi
            FILES="${FILES}
          === ${path} ===
          ${CONTENT}
          "
          done < <(printf '%s\n' "$PATHS")
          printf '%s\n' \
            "You triage one GitHub Actions failure in elastic/cli." \
            "Write a short comment that says what to change. Do not paste logs." \
            "fix: in-repo change that addresses this failure. Return full file replacements." \
            "stop: cannot fix in this repo (spec, generator, CI infra, flake)." \
            "Do not skip tests or weaken assertions." \
            "Do not edit generated API files or .github/." \
            "Respond with ONLY a JSON object:" \
            '{"action":"fix","comment":"one or two sentences naming the files and the change","commit_message":"fix: short","changes":[{"file":"src/foo.ts","content":"full file"}]}' \
            "" \
            "FAILED JOB: ${JOB_NAME}" \
            "$CONTEXT" \
            "" \
            "PR FILES:" \
            "$PR_FILES" \
            "" \
            "FILE CONTENTS:" \
            "$FILES" \
            > /tmp/prompt.txt
          curl -s -o /tmp/response.json \
            -H "Authorization: Bearer ${OPENROUTER_API_KEY}" \
            -H "Content-Type: application/json" \
            "${BASE_URL%/}/chat/completions" \
            -d "$(jq -n --rawfile prompt /tmp/prompt.txt '{
              model: "anthropic/claude-sonnet-4.6",
              max_tokens: 16384,
              messages: [{role: "user", content: $prompt}]
            }')"
          CONTENT=$(jq -r '.choices[0].message.content // empty' /tmp/response.json)
          if [ -z "$CONTENT" ]; then
            echo "Empty model response"
            exit 0
          fi
          printf '%s' "$CONTENT" > /tmp/model-raw.txt
          node /tmp/repair-loop.mjs parse-changes /tmp/model-raw.txt > /tmp/parsed.json
          COMMENT=$(jq -r '.comment // empty' /tmp/parsed.json)
          ACTION=$(jq -r '.action // empty' /tmp/parsed.json)
          if [ -n "$COMMENT" ]; then
            COMMENT_TAG='<!-- ci-repair-loop -->'
            BODY=$(printf '%s\n' "$COMMENT_TAG" "$COMMENT" "" "Job: ${JOB_URL}")
            EXISTING=$(gh api --paginate "repos/${GH_REPO}/issues/${PR}/comments" \
              --jq ".[] | select((.user.login == \"github-actions[bot]\") and (.body | startswith(\"${COMMENT_TAG}\"))) | .id" \
              | head -n 1 || true)
            if [ -n "$EXISTING" ]; then
              gh api -X PATCH "repos/${GH_REPO}/issues/comments/${EXISTING}" -f body="$BODY"
            else
              gh pr comment "$PR" --body "$BODY"
            fi
          fi
          if [ "$ACTION" = "fix" ] && [ "$CAN_FIX" = "1" ] && jq -e '(.changes | length) > 0' /tmp/parsed.json >/dev/null; then
            echo "apply=1" >> "$GITHUB_OUTPUT"
            mkdir -p .repair-loop
            cp /tmp/parsed.json .repair-loop/
          fi

      - name: Upload parsed patch
        if: steps.propose.outputs.apply == '1'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: repair-loop-patch
          path: .repair-loop
          if-no-files-found: error

  apply:
    needs: repair
    if: needs.repair.outputs.apply == '1' && needs.repair.outputs.pr != ''
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    steps:
      - name: Fetch ephemeral Github token
        id: fetch-token
        uses: elastic/ci-gh-actions/fetch-github-token@2feb1c6f5086cf8e06f61ef35e275abed3456f7b # v1.5.3
        with:
          vault-instance: "ci-prod"

      - name: Checkout default branch tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download parsed patch
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: repair-loop-patch
          path: /tmp/repair-loop

      - name: Apply patch
        env:
          GH_TOKEN: ${{ steps.fetch-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ needs.repair.outputs.pr }}
          EXPECTED_SHA: ${{ needs.repair.outputs.head_sha }}
        run: |
          set -euo pipefail
          if [ ! -f scripts/repair-loop.mjs ]; then
            echo "scripts/repair-loop.mjs missing on default branch"
            exit 0
          fi
          BRANCH=$(gh pr view "$PR" --json headRefName --jq '.headRefName')
          BRANCH="$BRANCH" node scripts/repair-loop.mjs apply-github /tmp/repair-loop/parsed.json
