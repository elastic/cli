name: Repair loop welcome

on:
  pull_request:
    types: [opened, ready_for_review, synchronize]

permissions:
  pull-requests: write

concurrency:
  group: repair-loop-welcome-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  comment:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Post one-time welcome
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          COMMENT_TAG='<!-- repair-loop-welcome -->'
          EXISTING=$(gh api --paginate "repos/${GH_REPO}/issues/${PR}/comments" \
            --jq ".[] | select((.body // \"\") | startswith(\"${COMMENT_TAG}\")) | .id" \
            | head -n 1 || true)
          BODY=$(printf '%s\n' \
            "$COMMENT_TAG" \
            "👋 This PR can use the first-failure repair loop on GitHub Actions and Buildkite." \
            "" \
            "**Repair loop**" \
            "- Add the \`auto-loop\` label and the bot will patch the first same-repo failure (up to 2 commits)" \
            "- Comment \`/stop\` to halt and pin \`skip-auto-loop\`" \
            "" \
            "**Review bot**" \
            "- Reply \`/bad\` on a finding to record it in \`.github/skills/ai-review-memory.md\`" \
            "- Add \`skip-ai-review\` to silence the review bot")
          if [ -n "$EXISTING" ]; then
            CURRENT=$(gh api "repos/${GH_REPO}/issues/comments/${EXISTING}" --jq '.body')
            if [ "$CURRENT" = "$BODY" ]; then
              echo "Welcome already posted"
              exit 0
            fi
            jq -n --arg body "$BODY" '{body: $body}' \
              | gh api -X PATCH "repos/${GH_REPO}/issues/comments/${EXISTING}" --input -
            echo "Welcome updated"
            exit 0
          fi
          gh pr comment "$PR" --body "$BODY"
