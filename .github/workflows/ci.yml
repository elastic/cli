name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  test-node:
    name: Test Node.js
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [22.x, 24.x, 25.x]
    runs-on: ${{ matrix.os }}
    # Baseline job time is 1-3 min; cap at 15 to fail fast on a hang instead
    # of burning hours and losing logs to blob storage expiry.
    timeout-minutes: 15
    # Per-endpoint Zod schemas (#171) that once bloated .d.ts emit are gone,
    # but tsc build still peaks around 3.7 GB locally; keep headroom above
    # the 2 GB Node default for slower/smaller CI runners.
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install
        run: npm ci
      - name: Run unit tests
        run: npm test
        shell: bash

  license-header:
    name: Check SPDX license header
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      - name: Install
        run: npm ci
      - name: License header check
        run: npm run test:spdx

  notice-file:
    name: Check NOTICE.txt is up to date
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      - name: Install
        run: npm ci
      - name: Verify NOTICE.txt
        run: npm run test:notice

  test-bun:
    name: Test Bun
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # `bun run build` shells out to Node-hosted tsc; same heap constraint as
    # the Node job above.
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Install
        run: bun install
      - name: Build
        run: bun run build
      - name: Run unit tests
        # 30 s per test: Windows runners are slower, and building 500+ Commander
        # stubs for the full ES manifest takes longer than bun's 5 s default.
        run: bun test --timeout 30000

  binary-smoke:
    name: Binary smoke
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Install
        run: bun install
      - name: Build config-resolver
        run: bunx tsc -b packages/config-resolver
      - name: Generate schema loaders
        run: node scripts/generate-schema-loaders.mjs
      - name: Compile
        run: bun build src/bun-entry.ts --compile --minify --bytecode --format esm --outfile elastic --target bun-linux-x64
      - name: Smoke
        run: bash scripts/smoke-binary.sh ./elastic

  megalinter:
    name: MegaLinter
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: MegaLinter
        uses: oxsecurity/megalinter/flavors/javascript@ef3e84b8b836d76db562d0f3ed7da61e8fd538bc # v9.6.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_ALL_CODEBASE: ${{ github.event_name == 'push' }}

  cli-schema:
    name: Check CLI schema is up to date
    permissions:
      contents: write
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # PR head, not the merge ref, so a schema commit can fast-forward the branch.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.x
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Regenerate CLI schema
        run: npm run build:schema
      - name: Commit schema or fail
        env:
          BRANCH: ${{ github.head_ref }}
          SHA: ${{ github.event.pull_request.head.sha }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          if git diff --quiet docs/cli/schema.json; then
            exit 0
          fi
          if [ "$SAME_REPO" = "true" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add docs/cli/schema.json
            git commit -m "chore: regenerate CLI schema"
            git push origin "HEAD:refs/heads/$BRANCH" --force-with-lease="refs/heads/$BRANCH:$SHA"
            exit 0
          fi
          echo "docs/cli/schema.json is out of date. Run 'npm run build:schema' and commit the result."
          exit 1

  ci:
    name: CI Result
    if: always()
    runs-on: ubuntu-latest
    needs:
      - test-node
      - license-header
      - test-bun
      - binary-smoke
      - megalinter
      - cli-schema
    steps:
      - run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more required jobs failed or were cancelled."
            exit 1
          fi
