name: Release Artifacts

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }} binary
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - os: linux
            runner: ubuntu-latest
            target: node24-linuxstatic-x64
            artifact: elastic-linux-x64

          - os: macos
            runner: macos-latest
            target: node24-macos-x64
            artifact: elastic-macos-x64

          - os: windows
            runner: windows-latest
            target: node24-win-x64
            artifact: elastic-windows-x64

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Bundle to single file
        run: npm run build:bundle

      - name: Package binary with pkg
        run: npm run build:binary -- --targets ${{ matrix.target }} --output ${{ matrix.artifact }}

      - name: Upload binary to release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3
        with:
          files: ${{ matrix.artifact }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
