name: Release Artifacts

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }} binary
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: Linux (x64)
            target: bun-linux-x64
            artifact: elastic-linux-x64
          - os: Linux (arm64)
            target: bun-linux-arm64
            artifact: elastic-linux-arm64
          - os: macOS (x64)
            target: bun-darwin-x64
            artifact: elastic-macos-x64
          - os: macOS (arm64)
            target: bun-darwin-arm64
            artifact: elastic-macos-arm64
          - os: Windows (x64)
            target: bun-windows-x64
            artifact: elastic-windows-x64.exe
          - os: Windows (arm64)
            target: bun-windows-arm64
            artifact: elastic-windows-arm64.exe

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install dependencies
        run: bun install

      - name: Build config-resolver
        run: bunx tsc -b packages/config-resolver

      - name: Generate schema loaders
        run: node scripts/generate-schema-loaders.mjs

      - name: Build binary
        shell: bash
        run: |
          bun build src/bun-entry.ts \
            --compile \
            --minify \
            --bytecode \
            --format esm \
            --outfile ${{ matrix.artifact }} \
            --target ${{ matrix.target }}

      - name: Smoke test linux x64 binary
        if: matrix.artifact == 'elastic-linux-x64'
        run: bash scripts/smoke-binary.sh ./${{ matrix.artifact }}

      - name: Upload binary to release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3
        with:
          files: ${{ matrix.artifact }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
