name: Release Artifacts

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }} binary
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - os: linux
            runner: ubuntu-latest
            target: node20-linux-x64
            artifact: elastic-linux-x64
          - os: macos
            runner: macos-latest
            target: node20-macos-x64
            artifact: elastic-macos-x64

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Bundle to CJS (required for pkg + ESM)
        run: |
          npx esbuild dist/cli.js \
            --bundle \
            --platform=node \
            --format=cjs \
            --outfile=dist/cli.cjs

      - name: Package binary with pkg
        run: |
          npx @yao-pkg/pkg dist/cli.cjs \
            --targets ${{ matrix.target }} \
            --output ${{ matrix.artifact }}

      - name: Upload binary to release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: ${{ matrix.artifact }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
