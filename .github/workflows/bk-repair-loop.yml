name: BK repair loop

on:
  status:
  issue_comment:
    types: [created, edited]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: bk-repair-loop-${{ github.event.issue.number || github.event.sha }}
  cancel-in-progress: true

jobs:
  repair:
    if: >-
      (github.event_name == 'status' &&
       github.event.state == 'failure' &&
       github.event.context == 'buildkite/elastic-cli/pr') ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       contains(github.event.comment.body, '<!-- bk-repair-loop -->') &&
       (github.event.comment.user.login == 'github-actions[bot]' ||
        github.event.comment.user.login == 'elastic-vault-github-plugin-prod[bot]'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    outputs:
      apply: ${{ steps.propose.outputs.apply }}
      rerun: ${{ steps.propose.outputs.rerun }}
      pr: ${{ steps.diag.outputs.pr }}
      head_sha: ${{ steps.diag.outputs.head_sha }}
      build_url: ${{ steps.diag.outputs.build_url }}
    steps:
      - name: Checkout default branch tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Copy repair-loop script
        run: |
          set -euo pipefail
          if [ -f scripts/repair-loop.mjs ]; then
            cp scripts/repair-loop.mjs /tmp/repair-loop.mjs
            exit 0
          fi
          echo "scripts/repair-loop.mjs missing on default branch"
          exit 0

      - name: Diagnose first failure
        id: diag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PR: ${{ github.event.issue.number }}
          COMMENT: ${{ github.event.comment.body }}
          STATUS_SHA: ${{ github.event.sha }}
          STATUS_URL: ${{ github.event.target_url }}
          BUILDKITE_API_TOKEN: ${{ secrets.BUILDKITE_API_TOKEN }}
        run: |
          set -euo pipefail
          {
            echo "pr="
            echo "head_sha="
            echo "job_name="
            echo "build_url="
            echo "fix=0"
            echo "triage=0"
            echo "pin_stop=0"
          } >> "$GITHUB_OUTPUT"
          if [ ! -s /tmp/repair-loop.mjs ]; then
            echo "repair-loop.mjs unavailable"
            exit 0
          fi
          BUILD_URL=""
          if [ "${EVENT_NAME:-}" = "status" ]; then
            BUILD_URL="${STATUS_URL:-}"
            case "$BUILD_URL" in
              https://buildkite.com/elastic/elastic-cli/builds/*) ;;
              "")
                echo "No build url"
                exit 0
                ;;
              *)
                echo "Unexpected target_url"
                exit 0
                ;;
            esac
            PR=$(gh api -H "Accept: application/vnd.github+json" \
              "repos/${GH_REPO}/commits/${STATUS_SHA}/pulls" \
              --jq "[.[]? | select(.state == \"open\") | .number][0] // empty")
            if [ -z "$PR" ]; then
              echo "No open PR for ${STATUS_SHA}"
              exit 0
            fi
          else
            if [ -z "${PR:-}" ]; then
              echo "No PR"
              exit 0
            fi
            printf '%s\n' "${COMMENT:-}" > /tmp/comment.txt
            if ! node /tmp/repair-loop.mjs has-bk-tag /tmp/comment.txt; then
              echo "No bk-repair-loop tag"
              exit 0
            fi
            if grep -q '^Resolution:' /tmp/comment.txt && ! grep -q 'Resolution: triaging' /tmp/comment.txt; then
              echo "Already diagnosed"
              exit 0
            fi
            BUILD_URL=$(grep -oE 'https://buildkite.com/elastic/elastic-cli/builds/[0-9]+' /tmp/comment.txt | head -n 1 || true)
          fi
          gh pr view "$PR" --json isCrossRepository,headRefName,labels > /tmp/pr-meta.json
          if [ "$(jq -r '.isCrossRepository' /tmp/pr-meta.json)" = true ]; then
            echo "Fork PR"
            exit 0
          fi
          if node /tmp/repair-loop.mjs is-memory-pr /tmp/pr-meta.json; then
            echo "Memory skill PR"
            exit 0
          fi
          : > /tmp/excerpt.txt
          : > /tmp/context.txt
          JOB_NAME='functional'
          if [ -n "$BUILD_URL" ] && [ -n "${BUILDKITE_API_TOKEN:-}" ]; then
            if node /tmp/repair-loop.mjs fetch-bk-failure "$BUILD_URL" /tmp/bk-fail.json; then
              JOB_NAME=$(jq -r '.jobName // "functional"' /tmp/bk-fail.json)
              jq -r '.summary // empty' /tmp/bk-fail.json > /tmp/excerpt.txt
              jq -r '.context // .summary // empty' /tmp/bk-fail.json > /tmp/context.txt
            fi
          fi
          if [ ! -s /tmp/context.txt ] && [ -s /tmp/comment.txt ]; then
            cp /tmp/comment.txt /tmp/context.txt
          fi
          node /tmp/repair-loop.mjs cited-paths /tmp/context.txt > /tmp/cited.json
          META=$(gh pr view "$PR" --json isDraft,headRefOid,headRepository,headRepositoryOwner,isCrossRepository)
          DRAFT=$(printf '%s' "$META" | jq -r '.isDraft')
          HEAD_SHA=$(printf '%s' "$META" | jq -r '.headRefOid // empty')
          CROSS=$(printf '%s' "$META" | jq -r '.isCrossRepository')
          if [ "$DRAFT" = true ]; then
            echo "Draft PR"
            exit 0
          fi
          SAME_REPO=1
          if [ "$CROSS" = true ]; then SAME_REPO=0; fi
          LABELS=$(gh pr view "$PR" --json labels --jq '[.labels[].name] | join(",")')
          SKIP_LOOP=0
          STOP_REPAIR=0
          AUTO_LOOP=0
          case ",$LABELS," in *,skip-auto-loop,*) SKIP_LOOP=1 ;; esac
          case ",$LABELS," in *,auto-loop,*) AUTO_LOOP=1 ;; esac
          gh api --paginate "repos/${GH_REPO}/issues/${PR}/comments" \
            --jq '.[] | select(.author_association == "OWNER" or .author_association == "MEMBER") | .body // empty' > /tmp/pr-comments.txt || true
          if node /tmp/repair-loop.mjs has-stop /tmp/pr-comments.txt; then STOP_REPAIR=1; fi
          gh api --paginate "repos/${GH_REPO}/pulls/${PR}/commits" \
            --jq '.[] | {author:{login:(.author.login // "")},commit:{author:{name:(.commit.author.name // "")}}}' \
            > /tmp/commits.ndjson || true
          BOT_COMMITS=$(node /tmp/repair-loop.mjs bot-commits /tmp/commits.ndjson)
          SAME_REPO="$SAME_REPO" SKIP_LOOP="$SKIP_LOOP" STOP_REPAIR="$STOP_REPAIR" AUTO_LOOP="$AUTO_LOOP" BOT_COMMITS="$BOT_COMMITS" \
            node /tmp/repair-loop.mjs should-fix > /tmp/decision.json || true
          FIX=0
          PIN_STOP=0
          if jq -e '.ok == true' /tmp/decision.json >/dev/null; then FIX=1; fi
          TRIAGE=0
          if [ "$SAME_REPO" = 1 ] && [ "$STOP_REPAIR" != 1 ] && [ "$SKIP_LOOP" != 1 ]; then
            TRIAGE=1
          fi
          if [ "$STOP_REPAIR" = 1 ] && [ "$SKIP_LOOP" = 0 ]; then PIN_STOP=1; fi
          {
            echo "pr=${PR}"
            echo "head_sha=${HEAD_SHA}"
            echo "job_name=${JOB_NAME}"
            echo "build_url=${BUILD_URL}"
            echo "fix=${FIX}"
            echo "triage=${TRIAGE}"
            echo "pin_stop=${PIN_STOP}"
          } >> "$GITHUB_OUTPUT"

      - name: Pin stop
        if: steps.diag.outputs.pin_stop == '1' && steps.diag.outputs.pr != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ steps.diag.outputs.pr }}
        run: |
          set -euo pipefail
          gh pr edit "$PR" --add-label skip-auto-loop || true
          gh pr comment "$PR" --body "Repair loop stopped (\`/stop\`). Added \`skip-auto-loop\`."

      - name: Propose in-repo fix
        id: propose
        if: steps.diag.outputs.triage == '1' && steps.diag.outputs.pr != ''
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_BASE_URL: ${{ secrets.OPENROUTER_BASE_URL }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ steps.diag.outputs.pr }}
          JOB_NAME: ${{ steps.diag.outputs.job_name }}
          BUILD_URL: ${{ steps.diag.outputs.build_url }}
          HEAD_SHA: ${{ steps.diag.outputs.head_sha }}
          CAN_FIX: ${{ steps.diag.outputs.fix }}
        run: |
          set -euo pipefail
          echo "apply=0" >> "$GITHUB_OUTPUT"
          echo "rerun=0" >> "$GITHUB_OUTPUT"
          COMMENT_TAG='<!-- bk-repair-loop -->'
          upsert_sticky() {
            local body="$1"
            EXISTING=$(gh api --paginate "repos/${GH_REPO}/issues/${PR}/comments" \
              --jq ".[] | select((.user.login == \"github-actions[bot]\" or .user.login == \"elastic-vault-github-plugin-prod[bot]\") and (.body | startswith(\"${COMMENT_TAG}\"))) | .id" \
              | head -n 1 || true)
            if [ -n "$EXISTING" ]; then
              gh api -X PATCH "repos/${GH_REPO}/issues/comments/${EXISTING}" -f body="$body"
            else
              gh pr comment "$PR" --body "$body"
            fi
          }
          fallback_sticky() {
            local excerpt
            excerpt=$(cat /tmp/excerpt.txt 2>/dev/null || true)
            upsert_sticky "$(printf '%s\n' "$COMMENT_TAG" "**${JOB_NAME}** failed." "" "$excerpt" "" "Build: ${BUILD_URL}")"
          }
          if [ -z "${OPENROUTER_API_KEY:-}" ]; then
            echo "OPENROUTER_API_KEY missing"
            fallback_sticky
            exit 0
          fi
          BASE_URL="${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}"
          case "$BASE_URL" in
            https://*) ;;
            *)
              echo "OPENROUTER_BASE_URL must be https://, refusing to send the API key to it"
              fallback_sticky
              exit 0
              ;;
          esac
          CONTEXT=$(cat /tmp/context.txt 2>/dev/null || true)
          PR_FILES=$(gh api --paginate "repos/${GH_REPO}/pulls/${PR}/files" --jq '.[] | .filename' | head -n 80 || true)
          PATHS=$(jq -r '.[]' /tmp/cited.json)
          if [ -z "$PATHS" ]; then
            PATHS=$(printf '%s\n' "$PR_FILES" | grep -E '^(src/|test/|packages/)' | grep -vE 'src/es/apis/|src/kb/apis|api-manifest' | head -n 6 || true)
          fi
          FILES=""
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            CONTENT=$(gh api "repos/${GH_REPO}/contents/${path}?ref=${HEAD_SHA}" \
              --jq '.content // empty' | tr -d '\n' | base64 -d 2>/dev/null || true)
            [ -n "$CONTENT" ] || continue
            BYTES=$(printf '%s' "$CONTENT" | wc -c | tr -d ' ')
            if [ "$BYTES" -gt 12000 ]; then
              FILES="${FILES}
          === ${path} ===
          OMITTED (${BYTES} bytes). Do not replace this file.
          "
              continue
            fi
            FILES="${FILES}
          === ${path} ===
          ${CONTENT}
          "
          done < <(printf '%s\n' "$PATHS")
          JOB_DEF=$(jq -c '{jobName,summary}' /tmp/bk-fail.json 2>/dev/null || true)
          printf '%s\n' \
            "Please find a solution for failing job ${JOB_NAME}. Use the logs, job definition, and any referenced files where the failure occurred. Keep your response focused on the solution and include code suggestions when appropriate." \
            "Do not paste logs into the comment." \
            "fix: in-repo change. Return full file replacements." \
            "rerun: flake or infra. Do not change tests to hide it." \
            "stop: cannot fix and a rerun will not help." \
            "Do not skip tests or weaken assertions." \
            "Do not edit generated API files, .github/, or .buildkite/." \
            "Respond with ONLY a JSON object:" \
            '{"action":"fix","comment":"What failed: ...\\nResolution: change FILE to ...","commit_message":"fix: short","changes":[{"file":"src/foo.ts","content":"full file"}]}' \
            "" \
            "JOB: ${BUILD_URL}" \
            "LOGS:" \
            "$CONTEXT" \
            "" \
            "JOB DEFINITION:" \
            "$JOB_DEF" \
            "" \
            "PR FILES:" \
            "$PR_FILES" \
            "" \
            "FILE CONTENTS:" \
            "$FILES" \
            > /tmp/prompt.txt
          curl -s -o /tmp/response.json \
            -H "Authorization: Bearer ${OPENROUTER_API_KEY}" \
            -H "Content-Type: application/json" \
            "${BASE_URL%/}/chat/completions" \
            -d "$(jq -n --rawfile prompt /tmp/prompt.txt '{
              model: "anthropic/claude-sonnet-4.6",
              max_tokens: 16384,
              messages: [{role: "user", content: $prompt}]
            }')"
          CONTENT=$(jq -r '.choices[0].message.content // empty' /tmp/response.json)
          if [ -z "$CONTENT" ]; then
            echo "Empty model response"
            fallback_sticky
            exit 0
          fi
          printf '%s' "$CONTENT" > /tmp/model-raw.txt
          node /tmp/repair-loop.mjs parse-changes /tmp/model-raw.txt > /tmp/parsed.json
          COMMENT=$(jq -r '.comment // empty' /tmp/parsed.json)
          ACTION=$(jq -r '.action // empty' /tmp/parsed.json)
          if [ -n "$COMMENT" ]; then
            upsert_sticky "$(printf '%s\n' "$COMMENT_TAG" "$COMMENT" "" "Build: ${BUILD_URL}")"
          else
            fallback_sticky
          fi
          if [ "$ACTION" = "fix" ] && [ "$CAN_FIX" = "1" ] && jq -e '(.changes | length) > 0' /tmp/parsed.json >/dev/null; then
            echo "apply=1" >> "$GITHUB_OUTPUT"
            mkdir -p .repair-loop
            cp /tmp/parsed.json .repair-loop/
            exit 0
          fi
          if [ "$ACTION" != "rerun" ]; then
            echo "No apply or rerun"
            exit 0
          fi
          gh api --paginate "repos/${GH_REPO}/issues/${PR}/comments" \
            --jq '.[] | .body // empty' > /tmp/all-comments.txt || true
          if grep -q '<!-- bk-rerun -->' /tmp/all-comments.txt; then
            echo "Already rebuilt once"
            exit 0
          fi
          echo "rerun=1" >> "$GITHUB_OUTPUT"

      - name: Upload parsed patch
        if: steps.propose.outputs.apply == '1'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bk-repair-loop-patch
          path: .repair-loop
          if-no-files-found: error

  apply:
    needs: repair
    if: needs.repair.outputs.apply == '1' && needs.repair.outputs.pr != ''
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    steps:
      - name: Fetch ephemeral Github token
        id: fetch-token
        uses: elastic/ci-gh-actions/fetch-github-token@2feb1c6f5086cf8e06f61ef35e275abed3456f7b # v1.5.3
        with:
          vault-instance: "ci-prod"

      - name: Checkout default branch tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download parsed patch
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bk-repair-loop-patch
          path: /tmp/repair-loop

      - name: Apply patch
        env:
          GH_TOKEN: ${{ steps.fetch-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ needs.repair.outputs.pr }}
          EXPECTED_SHA: ${{ needs.repair.outputs.head_sha }}
        run: |
          set -euo pipefail
          if [ ! -f scripts/repair-loop.mjs ]; then
            echo "scripts/repair-loop.mjs missing on default branch"
            exit 0
          fi
          BRANCH=$(gh pr view "$PR" --json headRefName --jq '.headRefName')
          BRANCH="$BRANCH" node scripts/repair-loop.mjs apply-github /tmp/repair-loop/parsed.json

  rerun:
    needs: repair
    if: needs.repair.outputs.rerun == '1' && needs.repair.outputs.pr != '' && needs.repair.outputs.build_url != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout default branch tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Rebuild Buildkite
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ needs.repair.outputs.pr }}
          BUILD_URL: ${{ needs.repair.outputs.build_url }}
          BUILDKITE_API_TOKEN: ${{ secrets.BUILDKITE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ ! -f scripts/repair-loop.mjs ]; then
            echo "scripts/repair-loop.mjs missing on default branch"
            exit 0
          fi
          COMMENT_TAG='<!-- bk-repair-loop -->'
          RERUN_TAG='<!-- bk-rerun -->'
          if node scripts/repair-loop.mjs rebuild-bk "$BUILD_URL"; then
            LINE='Resolution: rebuilt the failed Buildkite jobs.'
          else
            LINE='Resolution: Buildkite rebuild failed.'
          fi
          EXISTING=$(gh api --paginate "repos/${GH_REPO}/issues/${PR}/comments" \
            --jq ".[] | select((.user.login == \"github-actions[bot]\" or .user.login == \"elastic-vault-github-plugin-prod[bot]\") and (.body | startswith(\"${COMMENT_TAG}\"))) | .id" \
            | head -n 1 || true)
          if [ -n "$EXISTING" ]; then
            CURRENT=$(gh api "repos/${GH_REPO}/issues/comments/${EXISTING}" --jq '.body // empty')
            gh api -X PATCH "repos/${GH_REPO}/issues/comments/${EXISTING}" \
              -f body="$(printf '%s\n' "$CURRENT" "" "$RERUN_TAG" "$LINE")"
          else
            gh pr comment "$PR" --body "$(printf '%s\n' "$COMMENT_TAG" "$RERUN_TAG" "$LINE")"
          fi
