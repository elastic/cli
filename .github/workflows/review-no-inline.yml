name: Review no inline

on:
  workflow_run:
    workflows: ["Review no dispatch"]
    types: [completed]

permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  group: review-memory
  cancel-in-progress: false

jobs:
  remember:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request_review_comment' &&
      github.event.workflow_run.path == '.github/workflows/review-no-dispatch.yml'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      pull-requests: write
    steps:
      - name: Checkout default branch tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ github.token }}
          fetch-depth: 0
          persist-credentials: true

      - name: Download comment id
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: review-no-event
          path: /tmp/review-no-event
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Record rejected bot finding
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [ ! -s /tmp/review-no-event/event.json ]; then
            echo "No /bad artifact"
            exit 0
          fi
          EVENT_JSON=/tmp/review-no-event/event.json bash scripts/review-no-record.sh
