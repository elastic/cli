name: Review no

on:
  issue_comment:
    types: [created]

permissions:
  issues: write
  pull-requests: write

jobs:
  remember:
    if: >-
      github.event.comment.user.login != 'github-actions[bot]' &&
      (github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'MEMBER' ||
       github.event.comment.author_association == 'COLLABORATOR') &&
      github.event.issue.pull_request
    runs-on: ubuntu-latest
    steps:
      - name: Checkout default branch tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Record rejected bot finding
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
          COMMENT: ${{ github.event.comment.body }}
          IN_REPLY_TO: ${{ github.event.comment.in_reply_to || '' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          printf '%s\n' "$COMMENT" > /tmp/comment.txt
          if ! node scripts/repair-loop.mjs has-review-no /tmp/comment.txt; then
            echo "No /review-no"
            exit 0
          fi
          FINDING=""
          RID=""
          if [ -n "$IN_REPLY_TO" ]; then
            FINDING=$(gh api -X GET "repos/${GH_REPO}/pulls/comments/${IN_REPLY_TO}" \
              --jq '.body // empty')
          else
            REVIEW=$(gh api -X GET "repos/${GH_REPO}/pulls/${PR}/reviews" \
              --jq '[.[] | select(.user.login == "github-actions[bot]")] | last | {id, body}')
            RID=$(printf '%s' "$REVIEW" | jq -r '.id // empty')
            FINDING=$(printf '%s' "$REVIEW" | jq -r '.body // empty')
          fi
          if [ "$EVENT_NAME" = "issue_comment" ] && [ -n "$RID" ]; then
            gh api -X PUT "repos/${GH_REPO}/pulls/${PR}/reviews/${RID}/dismissals" \
              -f message="Maintainer rejected this review (/review-no)" \
              -f event=DISMISS || true
          fi
          ENTRY=$(node scripts/repair-loop.mjs memory-entry "$COMMENT" "$FINDING")
          if [ -z "$ENTRY" ]; then
            echo "Empty memory entry"
            exit 0
          fi
          MEM=$(gh issue list --label ai-review-memory --state open --json number \
            --jq '.[0].number // empty')
          if [ -z "$MEM" ]; then
            printf '%s\n' \
              'Rejected bot review findings. The AI review reads .github/skills/ai-review-memory.md. New comments here are folded into that file.' \
              '' \
              '<!-- processed-through: 0 -->' > /tmp/memory-issue-body.txt
            MEM=$(gh issue create --title "AI review memory" --label ai-review-memory \
              --body-file /tmp/memory-issue-body.txt)
            MEM="${MEM##*/}"
          fi
          gh issue comment "$MEM" --body "$ENTRY"
          gh pr comment "$PR" --body "Noted \`/review-no\`. Stored on #${MEM}. A standing PR folds it into \`.github/skills/ai-review-memory.md\`. Add \`skip-ai-review\` to silence the bot on this PR."
