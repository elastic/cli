name: Review no

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: review-memory
  cancel-in-progress: false

jobs:
  remember:
    if: >-
      github.event.comment.user.login != 'github-actions[bot]' &&
      (github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'MEMBER') &&
      github.event.issue.pull_request
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout default branch tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ github.token }}
          fetch-depth: 0
          persist-credentials: true

      - name: Record rejected bot finding
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          COMMENT_ID: ${{ github.event.comment.id }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_BASE_URL: ${{ secrets.OPENROUTER_BASE_URL }}
        run: |
          set -euo pipefail
          jq -n --arg source issue_comment --arg id "${COMMENT_ID}" \
            '{source:$source, comment_id:($id|tonumber)}' > /tmp/review-no-event.json
          EVENT_JSON=/tmp/review-no-event.json bash scripts/review-no-record.sh
