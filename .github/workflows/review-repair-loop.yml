name: Review repair loop

on:
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: review-repair-loop-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  repair:
    outputs:
      apply: ${{ steps.propose.outputs.apply }}
      pr: ${{ github.event.pull_request.number }}
    if: >-
      !github.event.pull_request.draft &&
      github.event.review.user.login != 'github-actions[bot]' &&
      (github.event.review.author_association == 'OWNER' ||
       github.event.review.author_association == 'MEMBER' ||
       github.event.review.author_association == 'COLLABORATOR') &&
      (github.event.review.state == 'changes_requested' || github.event.review.state == 'commented') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout default branch tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Copy repair-loop script
        run: cp scripts/repair-loop.mjs /tmp/repair-loop.mjs

      - name: Decide whether to patch
        id: diag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          REVIEW_ID: ${{ github.event.review.id }}
          REVIEW_BODY: ${{ github.event.review.body }}
        run: |
          set -euo pipefail
          LABELS=$(gh pr view "$PR" --json labels --jq '[.labels[].name] | join(",")')
          SKIP_LOOP=0
          STOP_REPAIR=0
          AUTO_LOOP=0
          case ",$LABELS," in *,skip-auto-loop,*) SKIP_LOOP=1 ;; esac
          case ",$LABELS," in *,auto-loop,*|*,auto-pr,*) AUTO_LOOP=1 ;; esac
          gh api "repos/${GH_REPO}/issues/${PR}/comments" \
            --jq '[.[].body // empty] | join("\n")' > /tmp/pr-comments.txt || true
          if node /tmp/repair-loop.mjs has-stop /tmp/pr-comments.txt; then STOP_REPAIR=1; fi
          if gh pr view "$PR" --json files --jq '.files[].path' | grep -qx '.github/workflows/review-repair-loop.yml'; then
            echo "PR edits this workflow, refusing to run it"
            echo "fix=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BOT_COMMITS=$(gh api "repos/${GH_REPO}/pulls/${PR}/commits" --paginate \
            --jq '[.[]? | select(.author.login == "github-actions[bot]" or .commit.author.name == "github-actions[bot]")] | length' \
            | awk '{s+=$1} END {print s+0}')
          SAME_REPO=1 SKIP_LOOP="$SKIP_LOOP" STOP_REPAIR="$STOP_REPAIR" AUTO_LOOP="$AUTO_LOOP" BOT_COMMITS="$BOT_COMMITS" \
            node /tmp/repair-loop.mjs should-fix > /tmp/decision.json || true
          FIX=0
          if jq -e '.ok == true' /tmp/decision.json >/dev/null; then FIX=1; fi
          echo "fix=${FIX}" >> "$GITHUB_OUTPUT"
          gh api "repos/${GH_REPO}/pulls/${PR}/reviews/${REVIEW_ID}/comments" \
            --jq '[.[]? | select(.author_association == "OWNER" or .author_association == "MEMBER" or .author_association == "COLLABORATOR") | {path, line, body}]' \
            > /tmp/review-comments.json
          printf '%s\n' "${REVIEW_BODY:-}" > /tmp/review-body.txt

      - name: Propose review patch
        id: propose
        if: steps.diag.outputs.fix == '1'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_BASE_URL: ${{ secrets.OPENROUTER_BASE_URL }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ -z "${OPENROUTER_API_KEY:-}" ]; then
            echo "OPENROUTER_API_KEY missing"
            exit 0
          fi
          BASE_URL="${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}"
          case "$BASE_URL" in
            https://*) ;;
            *)
              echo "OPENROUTER_BASE_URL must be https://, refusing to send the API key to it"
              exit 0
              ;;
          esac
          REVIEW_BODY=$(cat /tmp/review-body.txt)
          REVIEW_COMMENTS=$(cat /tmp/review-comments.json)
          cat /tmp/review-body.txt /tmp/review-comments.json > /tmp/review-all.txt
          node /tmp/repair-loop.mjs cited-paths /tmp/review-all.txt > /tmp/cited.json
          FILES=""
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            CONTENT=$(gh api "repos/${GH_REPO}/contents/${path}?ref=${HEAD_SHA}" \
              --jq '.content // empty' | tr -d '\n' | base64 -d 2>/dev/null || true)
            [ -n "$CONTENT" ] || continue
            BYTES=$(printf '%s' "$CONTENT" | wc -c | tr -d ' ')
            if [ "$BYTES" -gt 12000 ]; then
              FILES="${FILES}
          === ${path} ===
          OMITTED (${BYTES} bytes). Do not replace this file.
          "
              continue
            fi
            FILES="${FILES}
          === ${path} ===
          ${CONTENT}
          "
          done < <(jq -r '.[]' /tmp/cited.json)
          printf '%s\n' \
            "You iterate on review comments for an elastic/cli PR." \
            "Do not repeat an approach a reviewer already rejected." \
            "If the request is out of repo (spec, generator, infra), set stop=true and changes=[]." \
            "Do not edit generated API files or .github/workflows/." \
            "Respond with ONLY a JSON object:" \
            '{"stop":false,"comment":"short","commit_message":"fix: short","changes":[{"file":"src/foo.ts","content":"full file"}]}' \
            "" \
            "REVIEW BODY:" \
            "$REVIEW_BODY" \
            "" \
            "INLINE COMMENTS:" \
            "$REVIEW_COMMENTS" \
            "" \
            "CITED FILES:" \
            "$FILES" \
            > /tmp/prompt.txt
          curl -s -o /tmp/response.json \
            -H "Authorization: Bearer ${OPENROUTER_API_KEY}" \
            -H "Content-Type: application/json" \
            "${BASE_URL%/}/chat/completions" \
            -d "$(jq -n --rawfile prompt /tmp/prompt.txt '{
              model: "anthropic/claude-sonnet-4.6",
              max_tokens: 16384,
              messages: [{role: "user", content: $prompt}]
            }')"
          CONTENT=$(jq -r '.choices[0].message.content // empty' /tmp/response.json)
          if [ -z "$CONTENT" ]; then
            echo "Empty model response"
            exit 0
          fi
          printf '%s' "$CONTENT" > /tmp/model-raw.txt
          node /tmp/repair-loop.mjs parse-changes /tmp/model-raw.txt > /tmp/parsed.json
          COMMENT=$(jq -r '.comment // empty' /tmp/parsed.json)
          if [ -n "$COMMENT" ]; then
            gh pr comment "$PR" --body "$COMMENT"
          fi
          if jq -e '.stop == true or (.changes | length) == 0' /tmp/parsed.json >/dev/null; then
            echo "Model stopped or proposed no changes"
            echo "apply=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "apply=1" >> "$GITHUB_OUTPUT"
          mkdir -p .repair-loop
          cp /tmp/parsed.json /tmp/repair-loop.mjs .repair-loop/

      - name: Upload parsed patch
        if: steps.propose.outputs.apply == '1'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: review-repair-loop-patch
          path: .repair-loop
          if-no-files-found: error

  apply:
    needs: repair
    if: needs.repair.outputs.apply == '1'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Download parsed patch
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: review-repair-loop-patch
          path: /tmp/repair-loop

      - name: Apply patch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          BRANCH=$(gh pr view "$PR" --json headRefName --jq '.headRefName')
          BRANCH="$BRANCH" node /tmp/repair-loop/repair-loop.mjs apply-github /tmp/repair-loop/parsed.json
