name: Review repair loop

on:
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  pull-requests: read

jobs:
  dispatch:
    if: >-
      !github.event.pull_request.draft &&
      github.event.review.user.login != 'github-actions[bot]' &&
      (github.event.review.author_association == 'OWNER' ||
       github.event.review.author_association == 'MEMBER' ||
       github.event.review.user.login == 'github-advanced-security[bot]') &&
      (github.event.review.state == 'changes_requested' || github.event.review.state == 'commented') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout default branch tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Save review id
        env:
          PR: ${{ github.event.pull_request.number }}
          REVIEW_ID: ${{ github.event.review.id }}
          REVIEW_BODY: ${{ github.event.review.body }}
        run: |
          set -euo pipefail
          printf '%s\n' "${REVIEW_BODY:-}" > /tmp/review-body.txt
          if [ ! -f scripts/repair-loop.mjs ]; then
            echo "scripts/repair-loop.mjs missing on default branch"
            exit 0
          fi
          if node scripts/repair-loop.mjs has-bad /tmp/review-body.txt; then
            echo "Review is /bad, not iterating"
            exit 0
          fi
          mkdir -p .review-loop-event
          jq -n --arg pr "${PR}" --arg id "${REVIEW_ID}" \
            '{pr:($pr|tonumber), review_id:($id|tonumber)}' > .review-loop-event/event.json

      - name: Upload review id
        if: hashFiles('.review-loop-event/event.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: review-loop-event
          path: .review-loop-event/event.json
          if-no-files-found: error
