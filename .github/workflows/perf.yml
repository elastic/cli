name: Performance

on:
  pull_request:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # PR gate: A/B this build against the merge-base on the same runner. Relative
  # comparison cancels cross-machine and cross-run drift, the root cause of
  # noise-driven false positives on shared CI hardware. Results are posted as a
  # single sticky PR comment, refreshed on every push.
  compare:
    name: Startup A/B vs merge-base
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.x

      - name: Build PR
        run: npm ci && npm run build

      - name: Build merge-base
        run: |
          base=$(git merge-base origin/${{ github.base_ref }} HEAD)
          git worktree add /tmp/base "$base"
          cd /tmp/base && npm ci && npm run build

      - name: Install hyperfine
        run: sudo apt-get install -y hyperfine

      - name: Compare
        run: scripts/perf-check --compare /tmp/base --md perf.md

      # Always post the table, pass or fail, so the comment reflects the latest push.
      - name: Post sticky comment
        if: always() && hashFiles('perf.md') != ''
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('node:fs')
            const marker = '<!-- perf-report -->'
            const body = marker + '\n' + fs.readFileSync('perf.md', 'utf8')
            const { owner, repo } = context.repo
            const issue_number = context.issue.number
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number })
            const existing = comments.find((c) => c.body.startsWith(marker))
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body })
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body })
            }

  # Trend signal on push-to-main: runs the absolute baseline check.
  baseline:
    name: Startup baseline (trend)
    if: github.event_name == 'push'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.x

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install hyperfine
        run: sudo apt-get install -y hyperfine

      - name: Run perf check
        run: scripts/perf-check
