name: Performance comment

# Posts the A/B perf table produced by the Performance workflow. It runs from
# the default branch (never from PR code) via workflow_run, so it can safely
# hold pull-requests: write and can comment on pull requests from forks, which
# only receive a read-only token in the originating workflow.
#
# The artifact comes from a job that runs untrusted PR code, so it is treated as
# data: the PR number is resolved from the trigger commit SHA (not read from the
# artifact), and the comment markdown is rendered here from coerced numbers
# rather than posting any PR-authored text verbatim.
on:
  workflow_run:
    workflows: ["Performance"]
    types:
      - completed

permissions: {}

jobs:
  comment:
    name: Post perf comment
    if: github.event.workflow_run.event == 'pull_request'
    permissions:
      actions: read
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Download perf report
        id: download
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: perf-report
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Render and post sticky comment
        if: steps.download.outcome == 'success' && hashFiles('perf.json') != ''
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        with:
          script: |
            const fs = require('node:fs')
            const { owner, repo } = context.repo

            // Resolve the PR from the commit the run was triggered for, not from
            // the artifact, so a malicious PR cannot retarget another issue.
            const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner, repo, commit_sha: process.env.HEAD_SHA,
            })
            const pr = prs.find((p) => p.state === 'open')
            if (!pr) return
            const issue_number = pr.number

            // Treat the artifact as untrusted data: coerce every field to its
            // expected type and render the markdown here. Never post PR text verbatim.
            const parsed = JSON.parse(fs.readFileSync('perf.json', 'utf8'))
            const rows = Array.isArray(parsed.rows) ? parsed.rows : []
            const failed = parsed.failed === true
            const esc = (s) => String(s).replace(/[`|\r\n]/g, '')
            const num = (n) => Number(n).toFixed(1)
            const title = `### Startup perf: PR vs merge-base${failed ? ' \u2014 \u26a0\ufe0f regression' : ' \u2705'}`
            const table = [
              '| command | PR | base | delta |',
              '| --- | --: | --: | --: |',
              ...rows.map((r) => {
                const pct = Number(r.pct)
                const sign = pct >= 0 ? '+' : ''
                const warn = r.ok === false ? '\u26a0\ufe0f ' : ''
                return `| \`${esc(r.label)}\` | ${num(r.prMs)} ms | ${num(r.baseMs)} ms | ${warn}${sign}${pct.toFixed(1)}% |`
              }),
            ]
            const marker = '<!-- perf-report -->'
            const body = [marker, title, '', ...table, ''].join('\n') + '\n'

            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number })
            const existing = comments.find((c) => c.body.startsWith(marker))
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body })
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body })
            }
