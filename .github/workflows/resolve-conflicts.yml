name: AI Backport Resolver
on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: read

jobs:
  resolve:
    if: |
      (github.event.comment.user.login == 'github-actions[bot]' ||
       github.event.comment.user.login == 'elastic-vault-github-plugin-prod[bot]') &&
      contains(github.event.comment.body, 'To backport manually, run these commands')
    uses: elastic/clients-team-automations/.github/workflows/ai-backport-resolver.yml@e1f9f004bf69bc295529417b002270216be143e9
    with:
      comment_body: ${{ github.event.comment.body }}
      comment_user: ${{ github.event.comment.user.login }}
      pr_number: ${{ github.event.issue.number }}
    secrets:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_BASE_URL: ${{ secrets.OPENROUTER_BASE_URL }}
