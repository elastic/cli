name: Promote review memory

on:
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: promote-review-memory
  cancel-in-progress: false

jobs:
  promote:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (contains(github.event.issue.labels.*.name, 'ai-review-memory') &&
       (github.event.comment.user.login == 'github-actions[bot]' ||
        github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'COLLABORATOR'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout default branch tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ github.token }}
          fetch-depth: 0
          persist-credentials: true

      - name: Fold new memory comments into the skills file
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          MEM=$(gh issue list --label ai-review-memory --state open --json number \
            --jq '.[0].number // empty')
          if [ -z "$MEM" ]; then
            echo "No ai-review-memory issue"
            exit 0
          fi
          gh api --paginate "repos/${GH_REPO}/issues/${MEM}/comments" \
            --jq '.[] | {id, body, author_association, user: {login: .user.login}}' \
            | jq -s '.' > /tmp/comments.json
          gh api -X GET "repos/${GH_REPO}/issues/${MEM}" --jq '.body // empty' \
            > /tmp/issue-body.txt
          cp scripts/repair-loop.mjs /tmp/repair-loop.mjs
          git fetch origin ai/review-memory:ai/review-memory 2>/dev/null || true
          if git show-ref --verify --quiet refs/heads/ai/review-memory; then
            git checkout ai/review-memory
          else
            git checkout -B ai/review-memory
          fi
          SKILL=".github/skills/ai-review-memory.md"
          if [ ! -f "$SKILL" ]; then
            mkdir -p .github/skills
            : > "$SKILL"
          fi
          node /tmp/repair-loop.mjs memory-merge "$SKILL" /tmp/comments.json /tmp/issue-body.txt \
            > /tmp/skill-out.md
          if cmp -s "$SKILL" /tmp/skill-out.md; then
            echo "No new memory comments"
            exit 0
          fi
          cp /tmp/skill-out.md "$SKILL"
          NEW_CURSOR=$(node /tmp/repair-loop.mjs memory-cursor /tmp/skill-out.md)
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$SKILL"
          git commit -m "chore: update ai review memory"
          git push -u origin ai/review-memory
          node /tmp/repair-loop.mjs memory-set-cursor /tmp/issue-body.txt "$NEW_CURSOR" \
            > /tmp/issue-body-out.txt
          jq -n --rawfile body /tmp/issue-body-out.txt '{body: $body}' \
            | gh api -X PATCH "repos/${GH_REPO}/issues/${MEM}" --input -
          EXISTING=$(gh pr list --head ai/review-memory --base "$DEFAULT_BRANCH" --json number \
            --jq '.[0].number // empty')
          if [ -z "$EXISTING" ]; then
            gh pr create --base "$DEFAULT_BRANCH" --head ai/review-memory \
              --title "chore: update ai review memory" \
              --body "Folds new \`ai-review-memory\` comments into \`.github/skills/ai-review-memory.md\`. Relates to #${MEM}."
          fi
