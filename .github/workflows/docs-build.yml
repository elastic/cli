---
name: docs-build

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
  merge_group: ~

permissions:
  contents: read
  pull-requests: read

jobs:
  build:
    uses: elastic/docs-actions/.github/workflows/docs-build.yml@b90052dbe6a4cdbc6e8c8ef17049a11e7d70ccf9 # v1
    with:
      enable-vale-linting: true
