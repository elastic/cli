name: Regenerate NOTICE.txt
# Trusted main only. PRs must run `npm run generate:notice` locally; CI
# `notice-file` (contents: read) fails the PR if NOTICE.txt is stale.
# Do not re-add a pull_request trigger that runs npm under contents: write.
on:
  push:
    branches:
      - main
    paths:
      - package.json
      - package-lock.json

permissions: {}

jobs:
  regenerate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ github.token }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Regenerate NOTICE.txt
        run: node scripts/generate-notice.mjs

      - name: Commit if changed
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          if git diff --quiet NOTICE.txt; then
            echo "NOTICE.txt is already up to date."
          else
            git add NOTICE.txt
            git commit -m "chore: regenerate NOTICE.txt"
            git push
          fi
