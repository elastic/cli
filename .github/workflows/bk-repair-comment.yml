name: BK repair comment

on:
  status:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: bk-repair-comment-${{ github.event.sha }}
  cancel-in-progress: true

jobs:
  comment:
    if: >-
      github.event.state == 'failure' &&
      github.event.context == 'buildkite/elastic-cli/pr'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout default branch tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Copy repair-loop script
        run: |
          set -euo pipefail
          if [ -f scripts/repair-loop.mjs ]; then
            cp scripts/repair-loop.mjs /tmp/repair-loop.mjs
            exit 0
          fi
          echo "scripts/repair-loop.mjs missing on default branch"

      - name: Post first-failure comment
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.sha }}
          BUILD_URL: ${{ github.event.target_url }}
          DESCRIPTION: ${{ github.event.description }}
          BUILDKITE_API_TOKEN: ${{ secrets.BUILDKITE_API_TOKEN }}
        run: |
          set -euo pipefail
          case "${BUILD_URL:-}" in
            https://buildkite.com/elastic/elastic-cli/builds/*) ;;
            "") ;;
            *)
              echo "Unexpected target_url"
              exit 0
              ;;
          esac
          PR=$(gh api -H "Accept: application/vnd.github+json" \
            "repos/${GH_REPO}/commits/${HEAD_SHA}/pulls" \
            --jq "[.[]? | select(.state == \"open\" and .head.sha == \"${HEAD_SHA}\") | .number][0] // empty")
          if [ -z "$PR" ]; then
            echo "No open PR for ${HEAD_SHA}"
            exit 0
          fi
          CROSS=$(gh pr view "$PR" --json isCrossRepository --jq '.isCrossRepository')
          if [ "$CROSS" = true ]; then
            echo "Fork PR"
            exit 0
          fi
          COMMENT_TAG='<!-- bk-repair-loop -->'
          JOB_NAME='functional'
          SUMMARY="${DESCRIPTION:-Buildkite failed}"
          if [ -s /tmp/repair-loop.mjs ] && [ -n "${BUILDKITE_API_TOKEN:-}" ]; then
            if node /tmp/repair-loop.mjs fetch-bk-failure "$BUILD_URL" /tmp/bk-fail.json; then
              JOB_NAME=$(jq -r '.jobName // "functional"' /tmp/bk-fail.json)
              SUMMARY=$(jq -r '.summary // empty' /tmp/bk-fail.json)
              LOG=$(jq -r '.log // empty' /tmp/bk-fail.json)
              if [ -n "$LOG" ]; then
                SUMMARY=$(printf '%s\n%s' "$SUMMARY" "$LOG")
              fi
            fi
          fi
          BODY=$(printf '%s\n' \
            "$COMMENT_TAG" \
            "First Buildkite failure: **${JOB_NAME}**" \
            "" \
            "Build: ${BUILD_URL:-}" \
            "" \
            '```' \
            "$SUMMARY" \
            '```')
          EXISTING=$(gh api --paginate "repos/${GH_REPO}/issues/${PR}/comments" \
            --jq ".[] | select((.user.login == \"github-actions[bot]\" or .user.login == \"elastic-vault-github-plugin-prod[bot]\") and (.body | startswith(\"${COMMENT_TAG}\"))) | .id" \
            | head -n 1 || true)
          if [ -n "$EXISTING" ]; then
            gh api -X PATCH "repos/${GH_REPO}/issues/comments/${EXISTING}" -f body="$BODY"
          else
            gh pr comment "$PR" --body "$BODY"
          fi
