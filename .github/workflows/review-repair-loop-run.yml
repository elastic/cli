name: Review repair loop run

on:
  workflow_run:
    workflows: ["Review repair loop"]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number
        required: true

permissions:
  actions: read
  contents: read
  pull-requests: write

concurrency:
  group: review-repair-loop-${{ github.event.inputs.pr || github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  repair:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'pull_request_review' &&
       github.event.workflow_run.path == '.github/workflows/review-repair-loop.yml')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: write
    outputs:
      apply: ${{ steps.propose.outputs.apply }}
      pr: ${{ steps.diag.outputs.pr }}
      head_sha: ${{ steps.diag.outputs.head_sha }}
    steps:
      - name: Checkout default branch tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download review id
        if: github.event_name == 'workflow_run'
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: review-loop-event
          path: /tmp/review-loop-event
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Copy repair-loop script
        run: |
          set -euo pipefail
          if [ -f scripts/repair-loop.mjs ]; then
            cp scripts/repair-loop.mjs /tmp/repair-loop.mjs
            exit 0
          fi
          echo "scripts/repair-loop.mjs missing on default branch"
          exit 0

      - name: Decide whether to patch
        id: diag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PR: ${{ github.event.inputs.pr }}
          RUN_PR: ${{ github.event.workflow_run.pull_requests[0].number }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          if [ ! -s /tmp/repair-loop.mjs ]; then
            echo "repair-loop.mjs unavailable"
            exit 0
          fi
          if [ "${EVENT_NAME}" = workflow_dispatch ]; then
            if ! jq -n --arg pr "${INPUT_PR}" --arg id "1" \
              '{pr:($pr|tonumber),review_id:($id|tonumber)}' > /tmp/pr-check.json; then
              echo "Invalid PR"
              exit 0
            fi
            if ! node /tmp/repair-loop.mjs review-loop-event /tmp/pr-check.json > /tmp/pr-check-parsed.json; then
              echo "Invalid PR"
              exit 0
            fi
            PR=$(jq -r '.pr' /tmp/pr-check-parsed.json)
            gh api --paginate "repos/${GH_REPO}/pulls/${PR}/reviews" --jq '.[]' \
              | jq -s '.' > /tmp/reviews.json || true
            if ! node /tmp/repair-loop.mjs latest-trusted-review /tmp/reviews.json > /tmp/latest-review.json; then
              echo "No trusted review"
              exit 0
            fi
            REVIEW_ID=$(jq -r '.reviewId' /tmp/latest-review.json)
          else
            if [ ! -s /tmp/review-loop-event/event.json ]; then
              echo "No review artifact"
              exit 0
            fi
            if ! node /tmp/repair-loop.mjs review-loop-event /tmp/review-loop-event/event.json > /tmp/review-loop-parsed.json; then
              echo "Invalid review-loop event"
              exit 0
            fi
            RESOLVED_PR="${RUN_PR:-}"
            if [ -z "$RESOLVED_PR" ] && [ -n "${HEAD_BRANCH:-}" ]; then
              RESOLVED_PR=$(gh pr list --head "$HEAD_BRANCH" --state open --json number --jq '.[0].number // empty')
            fi
            if ! node /tmp/repair-loop.mjs review-loop-pr /tmp/review-loop-parsed.json "$RESOLVED_PR" > /tmp/review-loop-pr.json; then
              echo "Artifact PR does not match workflow_run"
              exit 0
            fi
            PR=$(jq -r '.pr' /tmp/review-loop-pr.json)
            REVIEW_ID=$(jq -r '.reviewId' /tmp/review-loop-parsed.json)
          fi
          REVIEW=$(gh api "repos/${GH_REPO}/pulls/${PR}/reviews/${REVIEW_ID}")
          LOGIN=$(printf '%s' "$REVIEW" | jq -r '.user.login // empty')
          ASSOC=$(printf '%s' "$REVIEW" | jq -r '.author_association // empty')
          STATE=$(printf '%s' "$REVIEW" | jq -r '.state // empty')
          BODY=$(printf '%s' "$REVIEW" | jq -r '.body // empty')
          if ! node /tmp/repair-loop.mjs trusted-reviewer "$LOGIN" "$ASSOC"; then
            echo "Ignoring untrusted review"
            exit 0
          fi
          case "$STATE" in
            COMMENTED|CHANGES_REQUESTED|commented|changes_requested) ;;
            *)
              echo "Ignoring review state ${STATE}"
              exit 0
              ;;
          esac
          printf '%s\n' "$BODY" > /tmp/review-body.txt
          if node /tmp/repair-loop.mjs has-bad /tmp/review-body.txt; then
            echo "Review is /bad, not iterating"
            exit 0
          fi
          META=$(gh pr view "$PR" --json isDraft,headRefOid,headRepository,headRepositoryOwner)
          DRAFT=$(printf '%s' "$META" | jq -r '.isDraft')
          HEAD_SHA=$(printf '%s' "$META" | jq -r '.headRefOid // empty')
          HEAD_OWNER=$(printf '%s' "$META" | jq -r '.headRepositoryOwner.login // empty')
          HEAD_NAME=$(printf '%s' "$META" | jq -r '.headRepository.name // empty')
          HEAD_REPO="${HEAD_OWNER}/${HEAD_NAME}"
          if [ "$DRAFT" = true ]; then
            echo "Draft PR"
            exit 0
          fi
          if [ "$HEAD_REPO" != "$GH_REPO" ]; then
            echo "Fork PR"
            exit 0
          fi
          LABELS=$(gh pr view "$PR" --json labels --jq '[.labels[].name] | join(",")')
          SKIP_LOOP=0
          STOP_REPAIR=0
          AUTO_LOOP=0
          case ",$LABELS," in *,skip-auto-loop,*) SKIP_LOOP=1 ;; esac
          case ",$LABELS," in *,auto-loop,*|*,auto-pr,*) AUTO_LOOP=1 ;; esac
          gh api --paginate "repos/${GH_REPO}/issues/${PR}/comments" \
            --jq '.[] | select(.author_association == "OWNER" or .author_association == "MEMBER") | .body // empty' > /tmp/pr-comments.txt || true
          if node /tmp/repair-loop.mjs has-stop /tmp/pr-comments.txt; then STOP_REPAIR=1; fi
          gh api --paginate "repos/${GH_REPO}/pulls/${PR}/commits" \
            --jq '.[] | {author:{login:(.author.login // "")},commit:{author:{name:(.commit.author.name // "")}}}' \
            > /tmp/commits.ndjson || true
          BOT_COMMITS=$(node /tmp/repair-loop.mjs bot-commits /tmp/commits.ndjson)
          SAME_REPO=1 SKIP_LOOP="$SKIP_LOOP" STOP_REPAIR="$STOP_REPAIR" AUTO_LOOP="$AUTO_LOOP" BOT_COMMITS="$BOT_COMMITS" \
            node /tmp/repair-loop.mjs should-fix > /tmp/decision.json || true
          FIX=0
          if jq -e '.ok == true' /tmp/decision.json >/dev/null; then FIX=1; fi
          {
            echo "pr=${PR}"
            echo "head_sha=${HEAD_SHA}"
            echo "fix=${FIX}"
          } >> "$GITHUB_OUTPUT"
          if [ "$STOP_REPAIR" = 1 ] && [ "$SKIP_LOOP" = 0 ]; then
            gh pr edit "$PR" --add-label skip-auto-loop || true
            gh pr comment "$PR" --body "Repair loop stopped (\`/stop\`). Added \`skip-auto-loop\`."
          fi
          gh api --paginate "repos/${GH_REPO}/pulls/${PR}/reviews/${REVIEW_ID}/comments" \
            --jq '.[]' | jq -s '.' > /tmp/review-comments-raw.json
          node /tmp/repair-loop.mjs trusted-review-comments /tmp/review-comments-raw.json \
            > /tmp/review-comments.json

      - name: Propose review patch
        id: propose
        if: steps.diag.outputs.fix == '1'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_BASE_URL: ${{ secrets.OPENROUTER_BASE_URL }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ steps.diag.outputs.pr }}
          HEAD_SHA: ${{ steps.diag.outputs.head_sha }}
        run: |
          set -euo pipefail
          if [ -z "${OPENROUTER_API_KEY:-}" ]; then
            echo "OPENROUTER_API_KEY missing"
            exit 0
          fi
          BASE_URL="${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}"
          case "$BASE_URL" in
            https://*) ;;
            *)
              echo "OPENROUTER_BASE_URL must be https://, refusing to send the API key to it"
              exit 0
              ;;
          esac
          REVIEW_BODY=$(cat /tmp/review-body.txt)
          REVIEW_COMMENTS=$(cat /tmp/review-comments.json)
          cat /tmp/review-body.txt /tmp/review-comments.json > /tmp/review-all.txt
          node /tmp/repair-loop.mjs cited-paths /tmp/review-all.txt > /tmp/cited.json
          FILES=""
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            CONTENT=$(gh api "repos/${GH_REPO}/contents/${path}?ref=${HEAD_SHA}" \
              --jq '.content // empty' | tr -d '\n' | base64 -d 2>/dev/null || true)
            [ -n "$CONTENT" ] || continue
            BYTES=$(printf '%s' "$CONTENT" | wc -c | tr -d ' ')
            if [ "$BYTES" -gt 12000 ]; then
              FILES="${FILES}
          === ${path} ===
          OMITTED (${BYTES} bytes). Do not replace this file.
          "
              continue
            fi
            FILES="${FILES}
          === ${path} ===
          ${CONTENT}
          "
          done < <(jq -r '.[]' /tmp/cited.json)
          printf '%s\n' \
            "You iterate on review comments for an elastic/cli PR." \
            "Do not repeat an approach a reviewer already rejected." \
            "If the request is out of repo (spec, generator, infra), set stop=true and changes=[]." \
            "Do not edit generated API files or .github/workflows/." \
            "Respond with ONLY a JSON object:" \
            '{"stop":false,"comment":"short","commit_message":"fix: short","changes":[{"file":"src/foo.ts","content":"full file"}]}' \
            "" \
            "REVIEW BODY:" \
            "$REVIEW_BODY" \
            "" \
            "INLINE COMMENTS:" \
            "$REVIEW_COMMENTS" \
            "" \
            "CITED FILES:" \
            "$FILES" \
            > /tmp/prompt.txt
          curl -s -o /tmp/response.json \
            -H "Authorization: Bearer ${OPENROUTER_API_KEY}" \
            -H "Content-Type: application/json" \
            "${BASE_URL%/}/chat/completions" \
            -d "$(jq -n --rawfile prompt /tmp/prompt.txt '{
              model: "anthropic/claude-sonnet-4.6",
              max_tokens: 16384,
              messages: [{role: "user", content: $prompt}]
            }')"
          CONTENT=$(jq -r '.choices[0].message.content // empty' /tmp/response.json)
          if [ -z "$CONTENT" ]; then
            echo "Empty model response"
            exit 0
          fi
          printf '%s' "$CONTENT" > /tmp/model-raw.txt
          node /tmp/repair-loop.mjs parse-changes /tmp/model-raw.txt > /tmp/parsed.json
          COMMENT=$(jq -r '.comment // empty' /tmp/parsed.json)
          if [ -n "$COMMENT" ]; then
            gh pr comment "$PR" --body "$COMMENT"
          fi
          if jq -e '.stop == true or (.changes | length) == 0' /tmp/parsed.json >/dev/null; then
            echo "Model stopped or proposed no changes"
            echo "apply=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "apply=1" >> "$GITHUB_OUTPUT"
          mkdir -p "$GITHUB_WORKSPACE/repair-loop-patch"
          cp /tmp/parsed.json "$GITHUB_WORKSPACE/repair-loop-patch/"

      - name: Upload parsed patch
        if: steps.propose.outputs.apply == '1'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: review-repair-loop-patch
          path: repair-loop-patch
          if-no-files-found: error

  apply:
    needs: repair
    if: needs.repair.outputs.apply == '1' && needs.repair.outputs.pr != ''
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    steps:
      - name: Fetch ephemeral Github token
        id: fetch-token
        uses: elastic/ci-gh-actions/fetch-github-token@2feb1c6f5086cf8e06f61ef35e275abed3456f7b # v1.5.3
        with:
          vault-instance: "ci-prod"

      - name: Checkout default branch tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download parsed patch
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: review-repair-loop-patch
          path: /tmp/repair-loop

      - name: Apply patch
        env:
          GH_TOKEN: ${{ steps.fetch-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ needs.repair.outputs.pr }}
          EXPECTED_SHA: ${{ needs.repair.outputs.head_sha }}
        run: |
          set -euo pipefail
          if [ ! -f scripts/repair-loop.mjs ]; then
            echo "scripts/repair-loop.mjs missing on default branch"
            exit 0
          fi
          BRANCH=$(gh pr view "$PR" --json headRefName --jq '.headRefName')
          BRANCH="$BRANCH" node scripts/repair-loop.mjs apply-github /tmp/repair-loop/parsed.json
