ENABLE_LINTERS:
  - TYPESCRIPT_ES
  - YAML_YAMLLINT
  - ACTION_ACTIONLINT
  - DOCKERFILE_HADOLINT
  - BASH_SHELLCHECK
  - COPYPASTE_JSCPD
  - REPOSITORY_GIT_DIFF
  - REPOSITORY_GITLEAKS
  - REPOSITORY_SECRETLINT
  - REPOSITORY_TRIVY

SHOW_ELAPSED_TIME: true
FILEIO_REPORTER: false
SARIF_REPORTER: false
FLAVOR_SUGGESTIONS: false
REPORTERS_MARKDOWN_TYPE: simple

# Install project deps (eslint, typescript-eslint) so eslint.config.js resolves.
# NODE_ENV=production in the container skips devDependencies by default.
PRE_COMMANDS:
  - command: "NODE_ENV=development npm ci --ignore-scripts"
    cwd: "workspace"

# Use project's ESLint 10 (flat config). Megalinter v9.5+ EslintLinter strips
# --no-eslintrc itself; declaring it under TYPESCRIPT_ES_COMMAND_REMOVE_ARGUMENTS
# now crashes the run (ValueError: x not in list).
TYPESCRIPT_ES_CLI_EXECUTABLE:
  - "node"
  - "node_modules/.bin/eslint"
TYPESCRIPT_ES_CONFIG_FILE: eslint.config.js

# Global exclusions
FILTER_REGEX_EXCLUDE: "(node_modules/|dist/|build/|\\.git/)"

# yamllint: skip test fixtures (custom multi-doc YAML DSL)
YAML_YAMLLINT_CONFIG_FILE: .yamllint.yml
YAML_YAMLLINT_FILTER_REGEX_EXCLUDE: "(codegen/functional/test/fixtures/|node_modules/)"

COPYPASTE_JSCPD_CONFIG_FILE: .jscpd.json

# trivy's default DB registries (mirror.gcr.io, ghcr.io) have been hitting
# TOOMANYREQUESTS during vulnerability DB download. Add the AWS ECR Public
# mirror as a third fallback (setting this overrides the defaults, so they're
# listed explicitly too) since it draws from a separate rate-limit pool.
# Note: mirror.gcr.io proxies Docker Hub, whose org for this image is
# "aquasec" (not "aquasecurity" like GHCR/ECR); using the wrong namespace
# here causes a permanent MANIFEST_UNKNOWN, not a transient rate limit.
TRIVY_DB_REPOSITORY: "mirror.gcr.io/aquasec/trivy-db:2,ghcr.io/aquasecurity/trivy-db:2,public.ecr.aws/aquasecurity/trivy-db:2"

# shellcheck: warn only until active script work stabilises
BASH_SHELLCHECK_DISABLE_ERRORS: true
